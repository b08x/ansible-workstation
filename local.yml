---
# Syncopated Workstation Local Provisioning Playbook
# Intended for execution via ansible-pull or direct local convergence:
#   ansible-pull -U <repo-url> --tags system local.yml
#   ansible-pull -U <repo-url> --tags user local.yml
#   ansible-playbook local.yml
#
# Adheres to the 15 Ansible Design Patterns (ansible-patterns-anti-patterns):
# - Pattern 5: Pre-flight Check Block (capability detection, user resolution)
# - Pattern 6: Role Composition (layered workstation provisioning)
# - Pattern 7: Tag-as-Select Pattern (comprehensive primary and functional tags)
# - Pattern 8: Backup-on-Write Pattern (sudoers file backup)
# - Pattern 9: Block-as-Unit Pattern (grouped diagnostics and check-mode safety)
# - Pattern 10: Environment Injection Pattern (consistent user and fact propagation)
# - Pattern 11: Conditional Feature Flags (explicit boolean gating)
# - Pattern 12: Post-task Lifecycle Pattern (reboot verification and summary)
# - Pattern 13: Debug-as-Progress-Indicator Pattern (clear phase demarcation)

# ==============================================================================
# Play 1: Syncopated Workstation System Provisioning (Root Privileged)
# ==============================================================================
- name: Syncopated Workstation System Provisioning
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure facts are gathered
      ansible.builtin.setup:
      when: ansible_distribution is not defined
      tags: ["always"]

    - name: Announce local system provisioning start
      ansible.builtin.debug:
        msg: "Starting Syncopated workstation system provisioning on {{ inventory_hostname }}"
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Probe for global group variables
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      register: _preflight_group_vars_stat
      check_mode: false
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Load global group variables if available
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      when: (_preflight_group_vars_stat.stat.exists | default(false)) and (user is not defined)
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    # The ISO image bakes /etc/syncopated-user.conf (WORKSTATION_USER=<name>)
    # precisely so this non-interactive pull can resolve the install-time user
    # deterministically; it outranks the user.name fallback chain (goal
    # two-stage-firstboot, F-29 fix).
    - name: Probe for the osbuild-baked workstation user conf
      ansible.builtin.stat:
        path: /etc/syncopated-user.conf
      register: _preflight_syncopated_user_conf_stat
      check_mode: false
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Read the osbuild-baked workstation user conf when present
      ansible.builtin.slurp:
        src: /etc/syncopated-user.conf
      register: _preflight_syncopated_user_conf
      when: _preflight_syncopated_user_conf_stat.stat.exists | default(false)
      check_mode: false
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Seed the workstation user from the osbuild conf when it names one
      ansible.builtin.set_fact:
        workstation_user: "{{ _preflight_syncopated_user_conf_name }}"
      when: _preflight_syncopated_user_conf_name | default('', true) | trim | length > 0
      vars:
        _preflight_syncopated_user_conf_name: >-
          {{ (_preflight_syncopated_user_conf.content | default('')
              | b64decode | regex_findall('(?m)^WORKSTATION_USER=(\S+)')
              | first | default('', true)) | trim }}
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Resolve target workstation user account
      ansible.builtin.set_fact:
        workstation_user: "{{ user.name }}"
      when: workstation_user is not defined
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Ensure user dictionary is defined for roles
      ansible.builtin.set_fact:
        user: "{{ (user | default({})) | combine({'name': workstation_user}, recursive=True) }}"
      when: user is not defined or user.name is not defined
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]

    - name: Disable requiretty in sudoers for unattended execution
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: "^Defaults    requiretty"
        line: "Defaults:{{ workstation_user }}    !requiretty"
        backrefs: false
        backup: true
        validate: "visudo -cf %s"
      when: workstation_user != 'root'
      tags: ["sudoers", "common", "system"]

    - name: Ensure /etc/system-release symlink exists
      ansible.builtin.file:
        src: /etc/os-release
        dest: /etc/system-release
        state: link
      tags: ["common", "system"]

    - name: Pre-flight capability detection
      check_mode: false
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
          "assert",
        ]
      block:
        - name: Check for KVM hardware acceleration support
          ansible.builtin.stat:
            path: /dev/kvm
          register: _preflight_kvm_stat

        - name: Query default systemd target
          ansible.builtin.command: systemctl get-default
          register: _preflight_default_target
          changed_when: false
          failed_when: false

        - name: Check for CUDA hardware acceleration support
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - |
                if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L 2>/dev/null | grep -q "^GPU "; then
                  exit 0
                fi
                if [ -e /dev/nvidia0 ] || [ -e /dev/nvidiactl ]; then
                  exit 0
                fi
                for d in /sys/bus/pci/devices/*; do
                  if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
                    v=$(cat "$d/vendor")
                    c=$(cat "$d/class")
                    if [ "$v" = "0x10de" ] && [ "${c#0x03}" != "$c" ]; then
                      exit 0
                    fi
                  fi
                done
                exit 1
          register: _preflight_cuda_stat
          changed_when: false
          failed_when: false

        - name: Check for Vulkan hardware acceleration support
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - |
                if command -v vulkaninfo >/dev/null 2>&1; then
                  pattern="deviceType\s*=\s*PHYSICAL_DEVICE_TYPE_(DISCRETE_GPU|INTEGRATED_GPU|VIRTUAL_GPU)"
                  if vulkaninfo --summary 2>/dev/null | grep -E "$pattern" >/dev/null 2>&1; then
                    exit 0
                  fi
                fi
                if ls /dev/dri/renderD* >/dev/null 2>&1; then
                  for d in /sys/bus/pci/devices/*; do
                    if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
                      v=$(cat "$d/vendor")
                      c=$(cat "$d/class")
                      case "$v" in
                        0x8086|0x1002|0x10de)
                          if [ "${c#0x03}" != "$c" ]; then
                            exit 0
                          fi
                          ;;
                      esac
                    fi
                  done
                fi
                exit 1
          register: _preflight_vulkan_stat
          changed_when: false
          failed_when: false

        - name: Assert valid Tier 1 desktop_environment value
          ansible.builtin.assert:
            that:
              - (desktop_environment | default('none')) in ['none', 'gnome', 'cosmic', 'sway']
            fail_msg: >-
              Invalid desktop_environment '{{ desktop_environment | default('') }}'.
              Allowed values: none, gnome, cosmic, sway.
            quiet: true
          tags: ["always", "assert", "desktop"]

        - name: Set auto-detected subsystem facts
          ansible.builtin.set_fact:
            auto_enable_libvirt: >-
              {{ pull_enable_libvirt | default(_preflight_kvm_stat.stat.exists | default(false)) | bool }}
            auto_enable_desktop: >-
              {{
                pull_enable_desktop
                | default((desktop_environment | default('none')) != 'none')
                | bool
              }}
            auto_enable_containerd: "{{ pull_enable_containerd | default(true) | bool }}"
            has_cuda_device: "{{ (_preflight_cuda_stat.rc | default(1)) == 0 }}"
            has_vulkan_device: "{{ (_preflight_vulkan_stat.rc | default(1)) == 0 }}"

        - name: Display pre-flight capability findings
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
              - "Workstation User: {{ workstation_user }}"
              - "KVM Support: {{ _preflight_kvm_stat.stat.exists | default(false) }} -> Libvirt: {{ auto_enable_libvirt }}"
              - "Default Target: {{ _preflight_default_target.stdout | default('unknown') }} -> Desktop: {{ auto_enable_desktop }}"
              - "Containers: {{ auto_enable_containerd }}"
              - "GPU Acceleration: CUDA={{ has_cuda_device }}, Vulkan={{ has_vulkan_device }}"

  tasks:
    - name: Configure DNF performance settings
      ansible.builtin.include_tasks: playbooks/tasks/repositories/dnf.yml
      tags: ["dnf", "mirrors", "repos", "system"]

    - name: Include distribution-specific repository tasks
      ansible.builtin.include_tasks: "{{ repo_distro_tasks }}"
      vars:
        repo_distro_tasks: >-
          {{
            lookup('ansible.builtin.first_found',
                   files=[
                     'playbooks/tasks/repositories/' ~ ansible_distribution ~ '.yml',
                     'playbooks/tasks/repositories/EL.yml'
                   ],
                   paths=[playbook_dir])
          }}
      when: enable_third_party_repos | default(true) | bool
      tags: ["repos", "repositories", "system"]

    - name: Configure Negativo 17 NVIDIA and Multimedia repositories
      ansible.builtin.include_tasks: playbooks/tasks/repositories/negativo17.yml
      when: enable_negativo17 | default(true) | bool
      tags: ["repos", "repositories", "negativo17", "system"]

    - name: Execute system package upgrade
      ansible.builtin.dnf:
        name: "*"
        state: latest # noqa: package-latest
        update_cache: true
        nobest: true
      tags: ["upgrade", "repos", "system"]

    - name: Execute common role
      ansible.builtin.include_role:
        name: common
      tags: ["common", "system", "assert"]

    - name: Execute tuning role
      ansible.builtin.include_role:
        name: tuning
      tags: ["tuning", "system", "assert"]

    - name: Execute gpu role
      ansible.builtin.include_role:
        name: gpu
      tags: ["gpu", "system", "assert"]

    - name: Execute networking role
      ansible.builtin.include_role:
        name: networking
      tags: ["networking", "system", "assert"]

    - name: Execute containerd role
      ansible.builtin.include_role:
        name: containerd
      when: auto_enable_containerd | default(true) | bool
      tags: ["containerd", "virt", "system", "assert"]

    - name: Execute libvirt role
      ansible.builtin.include_role:
        name: libvirt
      when: auto_enable_libvirt | default(false) | bool
      tags: ["libvirt", "virt", "system", "assert"]

    - name: Execute theme role
      ansible.builtin.include_role:
        name: theme
      when: auto_enable_desktop | default(false) | bool
      tags: ["theme", "desktop", "system", "assert"]

    - name: Execute gnome role
      ansible.builtin.include_role:
        name: gnome
      when:
        - auto_enable_desktop | default(false) | bool
        - (desktop_environment | default('none')) == 'gnome'
      tags: ["gnome", "desktop", "system", "assert"]

    - name: Execute cosmic role
      ansible.builtin.include_role:
        name: cosmic
      when:
        - auto_enable_desktop | default(false) | bool
        - (desktop_environment | default('none')) == 'cosmic'
      tags: ["cosmic", "desktop", "system", "assert"]

    - name: Execute sway role
      ansible.builtin.include_role:
        name: sway
      when:
        - auto_enable_desktop | default(false) | bool
        - (desktop_environment | default('none')) == 'sway'
      tags: ["sway", "desktop", "system", "assert"]

    - name: Execute tools role
      ansible.builtin.include_role:
        name: tools
      tags: ["tools", "system", "assert"]

  post_tasks:
    - name: Post-flight execution assessment and reboot verification
      check_mode: false
      tags:
        [
          "system",
          "repos",
          "common",
          "tuning",
          "gpu",
          "networking",
          "containerd",
          "libvirt",
          "theme",
          "gnome",
          "cosmic",
          "sway",
          "desktop",
          "tools",
        ]
      block:
        - name: Check for pending reboot on RedHat/Fedora family
          ansible.builtin.command: needs-restarting -r
          register: _reboot_check_rhel
          changed_when: false
          failed_when: false
          when: ansible_os_family == 'RedHat'

        - name: Check for pending reboot flag
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: _reboot_check_flag

        - name: Evaluate pending reboot status
          ansible.builtin.set_fact:
            system_reboot_required: >-
              {{
                (_reboot_check_rhel.rc is defined and _reboot_check_rhel.rc == 1)
                or (_reboot_check_flag.stat.exists is defined and _reboot_check_flag.stat.exists | bool)
              }}

        - name: Display reboot notice if kernel or core libraries were updated
          ansible.builtin.debug:
            msg: "NOTICE: A system reboot is recommended to apply kernel or core library updates."
          when: system_reboot_required | default(false) | bool

        - name: Display completion summary
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "Syncopated Workstation System Provisioning Complete (ansible-pull)"
              - "Host: {{ inventory_hostname }}"
              - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
              - "Target User: {{ workstation_user }}"
              - "Libvirt Enabled: {{ auto_enable_libvirt }}"
              - "Desktop Enabled: {{ auto_enable_desktop }}"
              - "Containerd Enabled: {{ auto_enable_containerd }}"
              - "Reboot Recommended: {{ system_reboot_required | default(false) }}"
              - "============================================================"

# ==============================================================================
# Play 2: Syncopated Workstation User Provisioning (Unprivileged User Space)
# ==============================================================================
- name: Syncopated Workstation User Provisioning
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  become_user: "{{ _local_user }}"
  gather_facts: false
  vars:
    _local_user: "{{ workstation_user | default(user.name | default('b08x')) }}"
    _local_home: "{{ user.home | default('/home/' ~ _local_user) }}"
  environment:
    PATH: "{{ _local_home }}/.local/bin:/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH | default('') }}"
  tags: ["user"]

  pre_tasks:
    - name: Announce local user provisioning start
      ansible.builtin.debug:
        msg: "Starting Syncopated workstation user provisioning for {{ _local_user }} on {{ inventory_hostname }}"
      tags: ["user", "assert"]

    - name: Probe for global group variables
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      register: _preflight_user_group_vars_stat
      check_mode: false
      tags: ["user", "assert"]

    - name: Load global group variables if available
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      when: (_preflight_user_group_vars_stat.stat.exists | default(false)) and (user is not defined)
      tags: ["user", "assert"]

    # Mirror of the Play 1 osbuild-conf seeding (runs with --tags user too,
    # when Play 1 is skipped entirely).
    - name: Probe for the osbuild-baked workstation user conf
      ansible.builtin.stat:
        path: /etc/syncopated-user.conf
      register: _preflight_syncopated_user_conf_stat
      check_mode: false
      tags: ["user", "assert", "firstboot"]

    - name: Read the osbuild-baked workstation user conf when present
      ansible.builtin.slurp:
        src: /etc/syncopated-user.conf
      register: _preflight_syncopated_user_conf
      when: _preflight_syncopated_user_conf_stat.stat.exists | default(false)
      check_mode: false
      tags: ["user", "assert", "firstboot"]

    - name: Seed the workstation user from the osbuild conf when it names one
      ansible.builtin.set_fact:
        workstation_user: "{{ _preflight_syncopated_user_conf_name }}"
      when: _preflight_syncopated_user_conf_name | default('', true) | trim | length > 0
      vars:
        _preflight_syncopated_user_conf_name: >-
          {{ (_preflight_syncopated_user_conf.content | default('')
              | b64decode | regex_findall('(?m)^WORKSTATION_USER=(\S+)')
              | first | default('', true)) | trim }}
      tags: ["user", "assert", "firstboot"]

    - name: Resolve unprivileged user account facts
      ansible.builtin.set_fact:
        workstation_user: "{{ user.name }}"
      when: workstation_user is not defined
      tags: ["user", "assert", "firstboot"]

    - name: Ensure user dictionary is defined for user role
      ansible.builtin.set_fact:
        user: >-
          {{
            (user | default({}))
            | combine({
                'name': workstation_user,
                'home': user.home | default('/home/' ~ workstation_user)
              }, recursive=True)
          }}
      tags: ["user", "assert", "firstboot"]

    - name: Gather facts as workstation user
      ansible.builtin.setup:
      become: true
      become_user: "{{ workstation_user }}"
      tags: ["user", "assert", "always"]

  tasks:
    - name: Execute user role
      ansible.builtin.include_role:
        name: user
      tags: ["user", "assert"]

  post_tasks:
    - name: Display user provisioning completion summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Syncopated Workstation User Provisioning Complete (ansible-pull)"
          - "Host: {{ inventory_hostname }}"
          - "User: {{ workstation_user }}"
          - "Home: {{ user.home | default('/home/' ~ workstation_user) }}"
          - "============================================================"
      tags: ["user"]
