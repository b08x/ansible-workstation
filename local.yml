---
# Syncopated Workstation Local Provisioning Playbook
# Intended for execution via ansible-pull or direct local convergence:
#   ansible-pull -U <repo-url> --tags system local.yml
#   ansible-pull -U <repo-url> --tags user local.yml
#   ansible-playbook local.yml
#
# Adheres to the 15 Ansible Design Patterns (ansible-patterns-anti-patterns):
# - Pattern 5: Pre-flight Check Block (capability detection, user resolution)
# - Pattern 6: Role Composition (layered workstation provisioning)
# - Pattern 7: Tag-as-Select Pattern (comprehensive primary and functional tags)
# - Pattern 8: Backup-on-Write Pattern (sudoers file backup)
# - Pattern 9: Block-as-Unit Pattern (grouped diagnostics and check-mode safety)
# - Pattern 10: Environment Injection Pattern (consistent user and fact propagation)
# - Pattern 11: Conditional Feature Flags (explicit boolean gating)
# - Pattern 12: Post-task Lifecycle Pattern (reboot verification and summary)
# - Pattern 13: Debug-as-Progress-Indicator Pattern (clear phase demarcation)

# ==============================================================================
# Play 1: Syncopated Workstation System Provisioning (Root Privileged)
# ==============================================================================
- name: Syncopated Workstation System Provisioning
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  tags: ["system"]

  pre_tasks:
    - name: Announce local system provisioning start
      ansible.builtin.debug:
        msg: "Starting Syncopated workstation system provisioning on {{ inventory_hostname }}"
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools", "assert"]

    - name: Probe for global group variables
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      register: _preflight_group_vars_stat
      check_mode: false
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools", "assert"]

    - name: Load global group variables if available
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      when: _preflight_group_vars_stat.stat.exists | default(false)
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools", "assert"]

    - name: Resolve target workstation user account
      ansible.builtin.set_fact:
        workstation_user: >-
          {{
            user.name
            if (user is defined and user.name is defined and user.name | length > 0)
            else (
              ansible_env.SUDO_USER
              if (ansible_env.SUDO_USER is defined and ansible_env.SUDO_USER | length > 0 and ansible_env.SUDO_USER != 'root')
              else (
                lookup('env', 'USER')
                if (lookup('env', 'USER') is defined and lookup('env', 'USER') | length > 0 and lookup('env', 'USER') != 'root')
                else ansible_user_id
              )
            )
          }}
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools", "assert"]

    - name: Ensure user dictionary is defined for roles
      ansible.builtin.set_fact:
        user: "{{ (user | default({})) | combine({'name': workstation_user}, recursive=True) }}"
      when: user is not defined or user.name is not defined
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools", "assert"]

    - name: Disable requiretty in sudoers for unattended execution
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: "^Defaults    requiretty"
        line: "Defaults:{{ workstation_user }}    !requiretty"
        backrefs: false
        backup: true
        validate: "visudo -cf %s"
      when: workstation_user != 'root'
      tags: ["sudoers", "base", "system"]

    - name: Ensure /etc/system-release symlink exists
      ansible.builtin.file:
        src: /etc/os-release
        dest: /etc/system-release
        state: link
      tags: ["base", "system"]

    - name: Pre-flight capability detection
      check_mode: false
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools", "assert"]
      block:
        - name: Check for KVM hardware acceleration support
          ansible.builtin.stat:
            path: /dev/kvm
          register: _preflight_kvm_stat

        - name: Query default systemd target
          ansible.builtin.command: systemctl get-default
          register: _preflight_default_target
          changed_when: false
          failed_when: false

        - name: Check for CUDA hardware acceleration support
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - |
                if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L 2>/dev/null | grep -q "^GPU "; then
                  exit 0
                fi
                if [ -e /dev/nvidia0 ] || [ -e /dev/nvidiactl ]; then
                  exit 0
                fi
                for d in /sys/bus/pci/devices/*; do
                  if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
                    v=$(cat "$d/vendor")
                    c=$(cat "$d/class")
                    if [ "$v" = "0x10de" ] && [ "${c#0x03}" != "$c" ]; then
                      exit 0
                    fi
                  fi
                done
                exit 1
          register: _preflight_cuda_stat
          changed_when: false
          failed_when: false

        - name: Check for Vulkan hardware acceleration support
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - |
                if command -v vulkaninfo >/dev/null 2>&1; then
                  pattern="deviceType\s*=\s*PHYSICAL_DEVICE_TYPE_(DISCRETE_GPU|INTEGRATED_GPU|VIRTUAL_GPU)"
                  if vulkaninfo --summary 2>/dev/null | grep -E "$pattern" >/dev/null 2>&1; then
                    exit 0
                  fi
                fi
                if ls /dev/dri/renderD* >/dev/null 2>&1; then
                  for d in /sys/bus/pci/devices/*; do
                    if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
                      v=$(cat "$d/vendor")
                      c=$(cat "$d/class")
                      case "$v" in
                        0x8086|0x1002|0x10de)
                          if [ "${c#0x03}" != "$c" ]; then
                            exit 0
                          fi
                          ;;
                      esac
                    fi
                  done
                fi
                exit 1
          register: _preflight_vulkan_stat
          changed_when: false
          failed_when: false

        - name: Set auto-detected subsystem facts
          ansible.builtin.set_fact:
            auto_enable_libvirt: >-
              {{ pull_enable_libvirt | default(_preflight_kvm_stat.stat.exists | default(false)) | bool }}
            auto_enable_desktop: >-
              {{
                pull_enable_desktop
                | default(_preflight_default_target.stdout is defined and 'graphical' in _preflight_default_target.stdout)
                | bool
              }}
            auto_enable_containerd: "{{ pull_enable_containerd | default(true) | bool }}"
            has_cuda_device: "{{ (_preflight_cuda_stat.rc | default(1)) == 0 }}"
            has_vulkan_device: "{{ (_preflight_vulkan_stat.rc | default(1)) == 0 }}"
            auto_enable_transcribe: >-
              {{
                ((_preflight_cuda_stat.rc | default(1)) == 0) or
                ((_preflight_vulkan_stat.rc | default(1)) == 0)
              }}

        - name: Display pre-flight capability findings
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }} ({{ ansible_distribution }} {{ ansible_distribution_version }})"
              - "Workstation User: {{ workstation_user }}"
              - "KVM Support: {{ _preflight_kvm_stat.stat.exists | default(false) }} -> Libvirt: {{ auto_enable_libvirt }}"
              - "Default Target: {{ _preflight_default_target.stdout | default('unknown') }} -> Desktop: {{ auto_enable_desktop }}"
              - "Containers: {{ auto_enable_containerd }}"
              - "GPU Acceleration: CUDA={{ has_cuda_device }}, Vulkan={{ has_vulkan_device }} -> Transcribe: {{ auto_enable_transcribe }}"

  tasks:
    - name: Execute base role
      ansible.builtin.include_role:
        name: base
      tags: ["base", "system", "assert"]

    - name: Execute tuning role
      ansible.builtin.include_role:
        name: tuning
      tags: ["tuning", "system", "assert"]

    - name: Execute networking role
      ansible.builtin.include_role:
        name: networking
      tags: ["networking", "system", "assert"]

    - name: Execute containerd role
      ansible.builtin.include_role:
        name: containerd
      when: auto_enable_containerd | default(true) | bool
      tags: ["containerd", "virt", "system", "assert"]

    - name: Execute libvirt role
      ansible.builtin.include_role:
        name: libvirt
      when: auto_enable_libvirt | default(false) | bool
      tags: ["libvirt", "virt", "system", "assert"]

    - name: Execute desktop role
      ansible.builtin.include_role:
        name: desktop
      when: auto_enable_desktop | default(false) | bool
      tags: ["desktop", "system", "assert"]

    - name: Execute tools role
      ansible.builtin.include_role:
        name: tools
      tags: ["tools", "system", "assert"]

  post_tasks:
    - name: Post-flight execution assessment and reboot verification
      check_mode: false
      tags: ["system", "base", "tuning", "networking", "containerd", "libvirt", "desktop", "tools"]
      block:
        - name: Check for pending reboot on RedHat/Fedora family
          ansible.builtin.command: needs-restarting -r
          register: _reboot_check_rhel
          changed_when: false
          failed_when: false
          when: ansible_os_family == 'RedHat'

        - name: Check for pending reboot on Debian family
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: _reboot_check_debian
          when: ansible_os_family == 'Debian'

        - name: Evaluate pending reboot status
          ansible.builtin.set_fact:
            system_reboot_required: >-
              {{
                (_reboot_check_rhel.rc is defined and _reboot_check_rhel.rc == 1)
                or (_reboot_check_debian.stat.exists is defined and _reboot_check_debian.stat.exists | bool)
              }}

        - name: Display reboot notice if kernel or core libraries were updated
          ansible.builtin.debug:
            msg: "NOTICE: A system reboot is recommended to apply kernel or core library updates."
          when: system_reboot_required | default(false) | bool

        - name: Display completion summary
          ansible.builtin.debug:
            msg:
              - "============================================================"
              - "Syncopated Workstation System Provisioning Complete (ansible-pull)"
              - "Host: {{ inventory_hostname }}"
              - "Distribution: {{ ansible_distribution }} {{ ansible_distribution_version }}"
              - "Target User: {{ workstation_user }}"
              - "Libvirt Enabled: {{ auto_enable_libvirt }}"
              - "Desktop Enabled: {{ auto_enable_desktop }}"
              - "Containerd Enabled: {{ auto_enable_containerd }}"
              - "Reboot Recommended: {{ system_reboot_required | default(false) }}"
              - "============================================================"

# ==============================================================================
# Play 2: Syncopated Workstation User Provisioning (Unprivileged User Space)
# ==============================================================================
- name: Syncopated Workstation User Provisioning
  hosts: "{{ target_hosts | default('all') }}"
  become: false
  gather_facts: true
  environment:
    PATH: "{{ ansible_env.HOME | default('/home/' ~ ansible_user_id) }}/.local/bin:/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH | default('') }}"
  tags: ["user"]

  pre_tasks:
    - name: Announce local user provisioning start
      ansible.builtin.debug:
        msg: "Starting Syncopated workstation user provisioning for {{ ansible_user_id }} on {{ inventory_hostname }}"
      tags: ["user", "assert"]

    - name: Probe for global group variables
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      register: _preflight_user_group_vars_stat
      check_mode: false
      tags: ["user", "assert"]

    - name: Load global group variables if available
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/inventory/group_vars/all.yml"
      when: _preflight_user_group_vars_stat.stat.exists | default(false)
      tags: ["user", "assert"]

    - name: Resolve unprivileged user account facts
      ansible.builtin.set_fact:
        workstation_user: >-
          {{
            user.name
            if (user is defined and user.name is defined and user.name | length > 0)
            else ansible_user_id
          }}
      tags: ["user", "assert"]

    - name: Ensure user dictionary is defined for user role
      ansible.builtin.set_fact:
        user: >-
          {{
            (user | default({}))
            | combine({
                'name': workstation_user,
                'home': ansible_env.HOME | default('/home/' ~ workstation_user)
              }, recursive=True)
          }}
      tags: ["user", "assert"]

  tasks:
    - name: Execute user role
      ansible.builtin.include_role:
        name: user
      tags: ["user", "assert"]

  post_tasks:
    - name: Display user provisioning completion summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "Syncopated Workstation User Provisioning Complete (ansible-pull)"
          - "Host: {{ inventory_hostname }}"
          - "User: {{ workstation_user }}"
          - "Home: {{ user.home | default(ansible_env.HOME) }}"
          - "============================================================"
      tags: ["user"]
