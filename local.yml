---
- name: Workstation Bootstrap Orchestrator
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run Interactive TUI Wizard (Bubbletea)
      command: bundle exec ruby scripts/playbook_composer/app.rb
      args:
        stdin: /dev/tty
        
    - name: Execute Dynamically Generated Tasks
      include_tasks: dynamic_run.yml
