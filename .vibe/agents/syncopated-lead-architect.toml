display_name = "Syncopated Lead Architect"
description = "Architect Agent — Phase 6 of the pipeline. Audits the change against the 15 patterns using the per-role violation matrix. Verifies dependency direction (roles don't import from other roles' internals), variable scoping (Tier 1 unprefixed, Tier 2 role-prefixed), tag coverage, firewall data-drivenness, and layer boundary compliance. Assesses cross-role blast radius and updates goals/ tracking documents."
agent_type = "subagent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "syncopated-lead-architect"
enabled_tools = [
    "read_file",
    "write_file",
    "grep",
    "bash",
]
disabled_tools = [
    "edit",
    "task",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "syncopated-lead-architect"
