display_name = "Syncopated Lead Cleaner"
description = "Cleaner Agent — Phase 3 of the pipeline. Refactors code to eliminate duplication and enforce the 15 Ansible design patterns. Runs the per-role violation matrix from ansible-patterns-anti-patterns, fixes violations (missing tags, missing backups, hardcoded values, dead handlers, dialect mixing), extracts repeated filter chains, moves hardcoded package lists to vars/{{ distro }}.yml, and standardizes feature flag syntax."
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "syncopated-lead-cleaner"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
]
disabled_tools = [
    "task",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "syncopated-lead-cleaner"
