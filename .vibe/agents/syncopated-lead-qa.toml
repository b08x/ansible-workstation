display_name = "Syncopated Lead QA"
description = "QA Agent — Phase 5 of the pipeline. Runs the full verification suite: ansible-playbook --tags assert --check (pre-flight), ansible-lint, --syntax-check, --check --diff (dry run), molecule test (per role), and pre-commit run --all-files. Validates that all acceptance criteria from the Specifier phase pass. Reports pass/fail with specific error details."
agent_type = "subagent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "syncopated-lead-qa"
enabled_tools = [
    "read_file",
    "grep",
    "bash",
]
disabled_tools = [
    "write_file",
    "edit",
    "task",
]

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "syncopated-lead-qa"
