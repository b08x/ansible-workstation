display_name = "Syncopated Lead Implementer"
description = "Implementer Agent — Phase 2 of the pipeline. Writes production Ansible code: tasks/*.yml (Task Dispatcher Pattern), defaults/main.yml (overridable config), vars/main.yml (internal data), templates, handlers, and distro-specific vars. Follows all 15 patterns: tags on every task, backup on every template, include_vars for distro-switching, block-as-unit grouping, debug entry messages. Ensures every handler is notified."
agent_type = "subagent"
safety = "destructive"
bypass_tool_permissions = false
system_prompt_id = "syncopated-lead-implementer"
enabled_tools = [
    "read_file",
    "write_file",
    "edit",
    "grep",
    "bash",
]
disabled_tools = [
    "task",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "syncopated-lead-implementer"
