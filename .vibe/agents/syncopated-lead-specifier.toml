display_name = "Syncopated Lead Specifier"
description = "Specifier Agent — Phase 1 of the pipeline. Translates requirements into role/playbook designs, variable schemas (Tier 1/Tier 2 scoping), and Gherkin-style acceptance criteria. For custom OS images, designs osbuild blueprints and intent files in the companion osbuild repo. Produces design documents and testable acceptance checklists. Writes no implementation code."
agent_type = "subagent"
safety = "neutral"
bypass_tool_permissions = false
system_prompt_id = "syncopated-lead-specifier"
enabled_tools = [
    "read_file",
    "write_file",
    "grep",
    "bash",
]
disabled_tools = [
    "edit",
    "task",
]

[tools.read_file]
permission = "always"

[tools.write_file]
permission = "ask"

[tools.grep]
permission = "always"

[tools.bash]
permission = "ask"

[session_logging]
enabled = true
session_prefix = "syncopated-lead-specifier"
