---
repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        # black (line-length=100) is the line-length authority: E501 would
        # flag non-splittable URLs/literals that black leaves alone.
        # E203/W503 are incompatible with black's slice/operator formatting.
        # Imports that must follow sys.path setup carry inline "# noqa: E402".
        args:
          - --max-line-length=100
          - --extend-ignore=E501,E203,W503

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [yaml, toml]

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        entry: ansible-lint
        language: system
        always_run: true
        pass_filenames: false
      - id: vagrant-validate
        name: Validate Vagrantfile
        entry: vagrant validate
        language: system
        files: ^Vagrantfile$
        pass_filenames: false
