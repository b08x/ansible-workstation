---
# defaults file for b08x.devworkstation.desktop_ui

# Control pre-flight assertions (Fail-Fast Pattern)
desktop_ui_assert_enabled: true

# Target desktop environment: gnome, cosmic, or sway
desktop_ui_environment: gnome

# Target display manager: defaults to cosmic-greeter when environment is cosmic, otherwise gdm
desktop_ui_display_manager: "{{ 'cosmic-greeter' if desktop_ui_environment == 'cosmic' else 'gdm' }}"

# COSMIC Desktop Environment options
desktop_ui_cosmic_use_copr: false
desktop_ui_cosmic_install_supplementary_apps: false

desktop_ui_theme_force_install: false

desktop_ui_gnome_flatpaks:
  - com.mattjakeman.ExtensionManager
  - page.tesk.Refine
# GNOME Shell Extensions to ensure are installed via dnf
desktop_ui_gnome_extensions:
  # System extensions (available via dnf)
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-apps-menu
  - gnome-shell-extension-auto-move-windows
  - gnome-shell-extension-dash-to-dock
  - gnome-shell-extension-places-menu
  - gnome-shell-extension-user-theme
  - gnome-shell-extension-window-list
  - gnome-shell-extension-launch-new-instance
  - gnome-shell-extension-workspace-indicator

# User extensions (installed to ~/.local/share/gnome-shell/extensions/)
# These are installed separately (e.g. via extensions.gnome.org) and will be enabled if present
desktop_ui_gnome_user_extensions:
  - notification-timeout@chlumskyvaclav.gmail.com
  - notification-configurator@exposedcat
  - junk-notification-cleaner@murar8.github.com
  - kando-integration@kando-menu.github.io

# Control whether installed extensions are enabled in dconf (disabled by default)
desktop_ui_gnome_extensions_enable: false
