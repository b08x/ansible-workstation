---
# Pre-flight assertions for desktop_ui role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the desktop_ui role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["desktop_ui", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The desktop_ui role only supports RedHat-family distributions
      (Fedora, AlmaLinux, Rocky Linux). Current host is
      {{ ansible_distribution | default('Unknown') }}
      ({{ ansible_os_family | default('Unknown') }}).
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["desktop_ui", "assert", "always"]

- name: Assert package manager is DNF
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The desktop_ui role relies on DNF/DNF5 package management.
      Detected package manager: '{{ ansible_pkg_mgr | default('unknown') }}'.
    quiet: true
  tags: ["desktop_ui", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _desktop_ui_effective_uid
  changed_when: false
  check_mode: false
  tags: ["desktop_ui", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _desktop_ui_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The desktop_ui role installs system packages and desktop repositories
      requiring root privileges. Ensure 'become: true' is enabled for this play or role.
    quiet: true
  tags: ["desktop_ui", "assert", "always"]

- name: Assert supported desktop environment
  ansible.builtin.assert:
    that:
      - desktop_ui_environment in ['gnome', 'cosmic', 'sway', 'none']
    fail_msg: >-
      Unsupported desktop environment '{{ desktop_ui_environment }}'.
      Allowed values: gnome, cosmic, sway, none (headless).
    quiet: true
  tags: ["desktop_ui", "assert", "always"]

- name: Assert supported OS distribution and version for COSMIC
  ansible.builtin.assert:
    that:
      - >-
        (ansible_distribution == 'Fedora' and (ansible_distribution_major_version | int >= 43)) or
        (ansible_distribution in ['AlmaLinux', 'Rocky', 'RedHat', 'CentOS'] and (ansible_distribution_major_version | int >= 10))
    fail_msg: >-
      COSMIC desktop environment requires Fedora 43+ or Enterprise Linux 10+.
      Detected: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('unknown') }}.
    quiet: true
  when: desktop_ui_environment == 'cosmic'
  tags: ["desktop_ui", "assert", "always"]

- name: Assert supported display manager for COSMIC
  ansible.builtin.assert:
    that:
      - desktop_ui_display_manager in ['cosmic-greeter', 'gdm']
    fail_msg: >-
      Unsupported display manager '{{ desktop_ui_display_manager }}' for COSMIC desktop.
      Allowed values: cosmic-greeter, gdm.
    quiet: true
  when: desktop_ui_environment == 'cosmic'
  tags: ["desktop_ui", "assert", "always"]
