---
# tasks file for COSMIC package installation in roles/desktop_ui

- name: Ensure Cosmic Flatpak remote repository is present
  community.general.flatpak_remote:
    name: cosmic
    flatpakrepo_url: https://apt.pop-os.org/cosmic/cosmic.flatpakrepo
    method: user
    state: present
  become: false
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["flatpak", "cosmic", "packages", "desktop_ui"]

- name: Enable ryanabx/cosmic-epoch COPR repository
  community.general.copr:
    name: ryanabx/cosmic-epoch
    state: enabled
  when:
    - desktop_ui_cosmic_use_copr | default(false) | bool
    - ansible_distribution == 'Fedora'
  tags: ["desktop_ui", "cosmic", "packages", "copr"]

- name: Install COSMIC core packages
  ansible.builtin.dnf:
    name: "{{ desktop_ui_packages.cosmic_core }}"
    state: present
  when:
    - desktop_ui_environment == 'cosmic'
    - (desktop_ui_packages.cosmic_core | default([]) | length) > 0
  tags: ["desktop_ui", "cosmic", "packages"]

- name: Install COSMIC supplementary applications
  ansible.builtin.dnf:
    name: "{{ desktop_ui_packages.cosmic_apps }}"
    state: present
  when:
    - desktop_ui_cosmic_install_supplementary_apps | default(false) | bool
    - (desktop_ui_packages.cosmic_apps | default([]) | length) > 0
  tags: ["desktop_ui", "cosmic", "packages"]
