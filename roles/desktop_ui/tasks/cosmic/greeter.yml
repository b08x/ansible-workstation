---
# tasks file for COSMIC display manager and greeter configuration in roles/desktop_ui

- name: Verify current default systemd target
  ansible.builtin.command: systemctl get-default
  changed_when: false
  check_mode: false
  register: _desktop_ui_cosmic_current_target
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Set default systemd target to graphical.target
  ansible.builtin.command: systemctl set-default graphical.target
  when:
    - _desktop_ui_cosmic_current_target.stdout | default('') | trim != 'graphical.target'
  register: _desktop_ui_cosmic_set_target
  changed_when: _desktop_ui_cosmic_set_target.rc == 0
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Check if cosmic-greeter systemd unit exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/cosmic-greeter.service
  register: _desktop_ui_cosmic_greeter_unit
  check_mode: false
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Check if GDM systemd unit exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/gdm.service
  register: _desktop_ui_gdm_unit
  check_mode: false
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Disable and stop GDM service when cosmic-greeter is selected
  ansible.builtin.service:
    name: gdm
    enabled: false
    state: stopped
  when:
    - desktop_ui_display_manager == 'cosmic-greeter'
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type | default('') not in ['container', 'docker', 'podman']
    - _desktop_ui_gdm_unit.stat.exists | default(false)
  notify: Restart display manager
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Enable and start cosmic-greeter service
  ansible.builtin.service:
    name: cosmic-greeter
    enabled: true
    state: started
  when:
    - desktop_ui_display_manager == 'cosmic-greeter'
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type | default('') not in ['container', 'docker', 'podman']
    - (_desktop_ui_cosmic_greeter_unit.stat.exists | default(false)) or not ansible_check_mode
  notify: Restart display manager
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Ensure GDM configuration directory exists
  ansible.builtin.file:
    path: /etc/gdm
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: desktop_ui_display_manager == 'gdm'
  tags: ["desktop_ui", "cosmic", "greeter", "gdm"]

- name: Configure GDM to use Wayland in /etc/gdm/custom.conf
  community.general.ini_file:
    path: /etc/gdm/custom.conf
    section: daemon
    option: WaylandEnable
    value: "true"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: desktop_ui_display_manager == 'gdm'
  notify: Restart display manager
  tags: ["desktop_ui", "cosmic", "greeter", "gdm"]

- name: Disable and stop cosmic-greeter service when GDM is selected
  ansible.builtin.service:
    name: cosmic-greeter
    enabled: false
    state: stopped
  when:
    - desktop_ui_display_manager == 'gdm'
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type | default('') not in ['container', 'docker', 'podman']
    - _desktop_ui_cosmic_greeter_unit.stat.exists | default(false)
  tags: ["desktop_ui", "cosmic", "greeter", "systemd"]

- name: Ensure GDM service is enabled and started when GDM is selected
  ansible.builtin.service:
    name: gdm
    enabled: true
    state: started
  when:
    - desktop_ui_display_manager == 'gdm'
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type | default('') not in ['container', 'docker', 'podman']
    - (_desktop_ui_gdm_unit.stat.exists | default(false)) or not ansible_check_mode
  notify: Restart display manager
  tags: ["desktop_ui", "cosmic", "greeter", "gdm", "systemd"]
