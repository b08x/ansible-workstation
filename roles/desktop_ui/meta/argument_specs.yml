---
# argument spec file for b08x.devworkstation.desktop_ui

argument_specs:
  main:
    short_description: Desktop UI role managing graphical desktop environments, toolkits, and display managers.
    options:
      desktop_ui_assert_enabled:
        type: bool
        default: true
        description: Run pre-flight validation assertions to fail fast on invalid environments.
      desktop_ui_environment:
        type: str
        default: "gnome"
        choices:
          - "gnome"
          - "cosmic"
          - "sway"
        description: Desktop environment to provision (gnome, cosmic, or sway).
      desktop_ui_display_manager:
        type: str
        choices:
          - "gdm"
          - "cosmic-greeter"
        description: Target display manager (defaults to cosmic-greeter for cosmic, otherwise gdm).
      desktop_ui_cosmic_use_copr:
        type: bool
        default: false
        description: Enable ryanabx/cosmic-epoch COPR repository before installing packages.
      desktop_ui_cosmic_install_supplementary_apps:
        type: bool
        default: false
        description: Install supplementary COSMIC desktop applications (@cosmic-desktop-apps).
      desktop_ui_theme_force_install:
        type: bool
        default: false
        description: Force reinstallation/rebuild of Yaru theme.
      desktop_ui_gnome_extensions:
        type: list
        elements: str
        description: System GNOME Shell extension package names to install via DNF.
      desktop_ui_gnome_user_extensions:
        type: list
        elements: str
        description: User GNOME Shell extension IDs to enable in dconf if present.
      desktop_ui_gnome_extensions_enable:
        type: bool
        default: false
        description: Control whether installed GNOME extensions are enabled in dconf.
