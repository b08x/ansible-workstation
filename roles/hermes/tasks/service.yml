---
# service.yml - Systemd service management for b08x.llmops.hermes

- name: Install Hermes gateway as systemd service
  ansible.builtin.command: >-
    {{ hermes_cli }} gateway install --system
  args:
    creates: "/etc/systemd/system/{{ hermes_service_name }}.service"
  become: true
  environment:
    # Pass environment to hermes command
    HERMES_DOCKER_BINARY: "{{ hermes_container_runtime }}"
    PATH: "{{ hermes_venv_bin }}:{{ ansible_env.PATH }}"
  notify:
    - Reload systemd daemon
    - Restart hermes-gateway
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd", "install"]

- name: Ensure systemd service file exists with proper environment
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ hermes_service_name }}.service"
  register: hermes_service_file
  tags: ["hermes", "service", "systemd"]

- name: Deploy custom systemd service file (if not using default)
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: "/etc/systemd/system/{{ hermes_service_name }}.service"
    mode: "0644"
    owner: root
    group: root
    backup: true
  become: true
  notify:
    - Reload systemd daemon
    - Restart hermes-gateway
  when:
    - hermes_system_service | bool
    - not hermes_service_file.stat.exists or hermes_container_runtime == 'podman'
  tags: ["hermes", "service", "systemd", "config"]

- name: Deploy systemd override configuration
  ansible.builtin.template:
    src: hermes-gateway-override.conf.j2
    dest: "/etc/systemd/system/{{ hermes_service_name }}.service.d/override.conf"
    mode: "0644"
    owner: root
    group: root
    backup: true
  become: true
  notify:
    - Reload systemd daemon
    - Restart hermes-gateway
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd", "config"]

- name: Reload systemd daemon after configuration changes
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd"]

- name: Enable Hermes gateway service at boot
  ansible.builtin.service:
    name: hermes-gateway
    enabled: true
    state: started
  become: true
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd", "enable"]

- name: Start Hermes gateway service (if not already running)
  ansible.builtin.service:
    name: hermes-gateway
    state: started
  become: true
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd", "start"]

- name: Verify Hermes gateway service is running
  ansible.builtin.service_facts:
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd", "verify"]

- name: Display service status
  ansible.builtin.debug:
    msg: >-
      Service Status:
      - Service File: {{ hermes_service_file.stat.exists | ternary('Exists', 'Not found') }}
      - Service Name: {{ hermes_service_name }}
      - Enabled at Boot: {{ ansible_facts.services['hermes-gateway.service'].enabled | default(false) | ternary('Yes', 'No') }}
      - Running: {{ ansible_facts.services['hermes-gateway.service'].state | default('unknown') }}
      - System Service: {{ hermes_system_service | bool | ternary('Yes', 'No') }}
  when: hermes_system_service | bool
  tags: ["hermes", "service", "systemd", "status", "always"]

- name: Check Hermes gateway CLI status
  ansible.builtin.command: "{{ hermes_cli }} gateway status --system"
  register: hermes_gateway_status
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ hermes_install_user }}"
  when: hermes_system_service | bool
  tags: ["hermes", "service", "status"]

- name: Display Hermes gateway status
  ansible.builtin.debug:
    msg: >-
      Hermes Gateway Status:
      {% if hermes_gateway_status.rc == 0 %}
      {{ hermes_gateway_status.stdout | indent(2) }}
      {% else %}
      Gateway is not running or not installed as system service.
      {% endif %}
  when:
    - hermes_system_service | bool
    - hermes_gateway_status is defined
  tags: ["hermes", "service", "status", "always"]
