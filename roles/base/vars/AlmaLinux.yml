  # EL 10 (Fedora 40 lineage) removed ebtables; iptables-nft is the
  # nftables-backed replacement that symlinks /usr/sbin/ebtables-nft
  # (https://almalinux.pkgs.org/10/almalinux-appstream-x86_64/iptables-nft-services-1.8.11-13.el10_1.noarch.rpm.html)
  - iptables-nft
  - fd-find
  - ffmpeg
  - ffmpegthumbnailer
  - flatpak
  - fzf
  - gettext
  - git
  - gmp-devel
  - gobject-introspection-devel
  - gtksourceview4
  - highlight
  - htop
  - jq
  - just
  - kernel-devel
  - kernel-headers
  - kernel-modules
  - kernel-modules-core
  - kernel-modules-extra
  - kernel-modules-extra-matched
  - kernel-tools
  - kernel-tools-libs
  - kitty
  - libffi-devel
  - libyaml-devel
  - lm_sensors
  - lm_sensors-devel
  - lnav
  - lsb_release
  - make
  - mediainfo
  - meson
  - micro
  - mpv
  - ninja-build
  - nodejs
  - openssh-server
  - openssl-devel
  - perl-FindBin
  - perl-IPC-Cmd
