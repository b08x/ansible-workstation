  - readline-devel
  - ruby-build
  - sqlite
  - uv
  - vala
  - wayland-devel
  - wayland-protocols-devel
  - wireplumber
  # EL 10 dropped zlib/zlib-devel; zlib-ng-compat-devel is the ABI-compatible
  # zlib-ng replacement (https://github.com/rvm/rvm/issues/5478). Rocky 9 still
  # ships zlib-devel, which is why the base role loads per-major vars for Rocky.
  - zlib-ng-compat-devel
  - zram-generator
  - zram-generator-defaults
  - zsh
