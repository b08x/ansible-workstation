---
# Rocky 9 package set: derived from the Rocky 10 list, verified inside a
# rockylinux:9 (9.8) container with BaseOS, AppStream, CRB, EPEL 9 and RPM
# Fusion EL 9 enabled (2026-10-01). EL 9 differences vs Rocky 10:
#  - zlib-ng-compat-devel does not exist on EL 9; the classic zlib-devel
#    name is used instead.
#  - Dropped, no EL 9 build (verified in the container): just,
#    kernel-modules-extra-matched, python3-nbconvert, uv,
#    zram-generator-defaults.
