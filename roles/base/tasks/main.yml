---
# tasks file for b08x.devworkstation.base

- name: Starting base tasks
  ansible.builtin.debug:
    msg: "Starting base tasks"
  tags: ["base", "always"]

- name: Validate pre-flight assertions and platform support
  ansible.builtin.include_tasks: assert.yml
  when: base_assert_enabled | default(true) | bool
  tags: ["base", "assert", "always"]

- name: Include distribution package variables
  # Per-major file wins when present (EL 9 and EL 10 package names diverge,
  # e.g. zlib-devel vs zlib-ng-compat-devel); otherwise the distro-wide file.
  ansible.builtin.include_vars:
    file: "{{ base_distro_vars }}"
  vars:
    base_distro_vfile: "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    base_distro_vars: "{{ lookup('ansible.builtin.first_found', files=[base_distro_vfile, ansible_distribution ~ '.yml'], paths=role_path ~ '/vars') }}"
  tags: ["packages", "distro"]

# ----------------------------------------------------------------------------
# DNF Performance Optimization
# ----------------------------------------------------------------------------

- name: Include DNF configuration tasks
  ansible.builtin.include_tasks: dnf.yml
  tags: ["dnf", "base", "repos"]

# ----------------------------------------------------------------------------
# Repository Configuration
# ----------------------------------------------------------------------------

- name: Include Distribution Specific Repository Tasks
  # EL-family distributions (AlmaLinux, Rocky) share distro/EL.yml; each
  # distro-specific file wins when one exists (e.g. Fedora.yml). The lookup
  # lives in vars: because include_tasks parses its argument for k=v options
  # and would trip over "files=" inside the template string.
  ansible.builtin.include_tasks: "{{ base_distro_repo_tasks }}"
  vars:
    base_distro_repo_tasks: "{{ lookup('ansible.builtin.first_found', files=[ansible_distribution ~ '.yml', 'EL.yml'], paths=role_path ~ '/tasks/distro') }}"
  when:
    - enable_third_party_repos | default(true) | bool
  tags: ["repos", "base"]

- name: Install Base packages
  tags: ["packages", "base"]
  block:
    # One dnf transaction for the whole list; a loop runs one transaction per
    # package. On failure, dnf's error names the packages it could not resolve.
    - name: Install Base packages
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present
        allowerasing: true

  rescue:
    # Shape 1 (add context, then re-raise): base packages are this role's core
    # contract, so a failure must fail the play rather than report green.
    - name: Report base package installation failure
      ansible.builtin.debug:
        msg: >-
          Failed to install one or more packages from base_packages.
          Re-run with -vv to see which package and why; a missing package
          usually means a repository in tasks/distro/ was never enabled.

    - name: Fail the play on base package installation failure
      ansible.builtin.fail:
        msg: "Base package installation failed - see the preceding task output."

- name: Enable and Start ssh service
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Flush handlers meow
  ansible.builtin.meta: flush_handlers

- name: Include Intel installation tasks
  ansible.builtin.include_tasks: intel.yml
  tags: ["intel", "base"]

- name: Include gitflow installation tasks
  ansible.builtin.include_tasks: gitflow.yml
  tags: ["gitflow", "base"]

- name: Include inxi installation tasks
  ansible.builtin.include_tasks: inxi.yml
  tags: ["inxi", "base"]

- name: Include Homebrew configuration tasks
  ansible.builtin.include_tasks: homebrew.yml
  when:
    - base_install_homebrew | bool
    - ansible_distribution == 'Fedora'
  tags: ["homebrew", "base"]

- name: Include Zsh installation tasks
  ansible.builtin.include_tasks: zsh.yml
  tags: ["zsh", "base"]

- name: Include yadm installation tasks
  ansible.builtin.include_tasks: yadm.yml
  tags: ["yadm", "base"]

- name: Include firstboot onboarding tasks
  ansible.builtin.include_tasks: firstboot.yml
  tags: ["firstboot", "base"]
