- name: Force refresh DNF metadata cache
  ansible.builtin.command:
    cmd: dnf makecache
  changed_when: true
  when: >
    (base_epel_install is changed) or
    (base_rpmfusion_keys is changed) or
    (base_rpmfusion_repos is changed)
