---
- name: Configure DNF and fastestmirror
  when: ansible_distribution == 'Fedora'
  tags: ["mirrors", "repo"]
  block:
    - name: Ensure dnf-plugins-core is installed
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Enable fastestmirror in DNF configuration
      community.general.ini_file:
        path: /etc/dnf/dnf.conf
        section: main
        option: fastestmirror
        value: "True"
        no_extra_spaces: true
        mode: "0644"
        backup: true
      register: base_enable_fastestmirror

    - name: Force refresh DNF metadata cache
      ansible.builtin.command:
        cmd: dnf makecache
      changed_when: true
      when: base_enable_fastestmirror is changed # noqa: no-handler
