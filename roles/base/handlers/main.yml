---
# handlers file for base role

- name: Daemon reload
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "Daemon reload"

- name: Restart zram service
  ansible.builtin.systemd:
    name: "systemd-zram-setup@zram0.service"
    state: restarted
  # Containers have no zram device, so the unit cannot start there.
  when: "'container' not in ansible_virtualization_tech_guest | default([])"
  listen: "Restart zram service"
