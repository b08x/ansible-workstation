---
# defaults file for b08x.devworkstation.base

# Pre-flight assertions
base_assert_enabled: true

# Variable that will be displayed in debug output
# This demonstrates proper role variable naming with the 'run_' prefix
base_my_variable: "default_value"

# Fedora third-party repositories (see tasks/distro/Fedora.yml).
# Gated overall by the domain-scoped enable_third_party_repos in tasks/main.yml.
base_enable_rpmfusion: true

# COPR repositories to enable. Each entry is an "owner/project" pair,
# e.g. "atim/starship".
base_copr_repos: []

# COPR that provides the gitflow package on Fedora (see tasks/gitflow.yml).
base_gitflow_copr_fedora: elegos/gitflow
base_gitflow_copr_el: b08x/syncopated

# Syncopated COPR repository on EL 10 (see tasks/distro/EL.yml).
base_enable_syncopated_copr: true
base_syncopated_copr: b08x/syncopated

# Homebrew is opt-in. When true, Fedora hosts get the official prefix
# /home/linuxbrew/.linuxbrew (see tasks/homebrew.yml).
base_install_homebrew: false

# Yadm standalone binary configuration (see tasks/yadm.yml).
base_yadm_url: "https://github.com/TheLocehiliosan/yadm/raw/master/yadm"
base_yadm_force_install: false

# Rescue strictness. The Intel graphics, zoxide and DNF-priority blocks are
# optional: they report a warning and continue when they fail, because the role
# still meets its contract without them. Set one to true to turn its failure
# into a play failure. Every other rescue in this role re-raises unconditionally.
base_intel_graphics_required: false
base_zoxide_required: false
base_dnf_priorities_required: false
