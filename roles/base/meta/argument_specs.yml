---
# argument spec file for b08x.devworkstation.base

argument_specs:
  main:
    short_description: Role description.
    options:
      base_assert_enabled:
        type: bool
        description: Enable pre-flight environment, platform, and privilege assertions.
        default: true
      base_my_variable:
        type: str
        description: A simple string argument for demonstration.
        default: "default_value"
      base_gitflow_copr:
        type: str
        description: COPR "owner/project" that provides the gitflow package on Fedora.
        default: elegos/gitflow
      base_enable_syncopated_copr:
        type: bool
        description: Enable the Syncopated COPR repository on EL 10 hosts.
        default: true
      base_syncopated_copr:
        type: str
        description: COPR "owner/project" that provides syncopated packages on EL 10.
        default: b08x/syncopated
      base_install_homebrew:
        type: bool
        description: Install Homebrew on Fedora hosts. Off by default.
        default: false
      base_yadm_url:
        type: str
        description: Download URL for the yadm standalone binary.
        default: "https://github.com/TheLocehiliosan/yadm/raw/master/yadm"
      base_yadm_force_install:
        type: bool
        description: Force installation of yadm binary even if already found on the system.
        default: false
