---
all:
  children:
    molecule:
      hosts:
        base-fedora43:
          container_image: localhost/molecule-base-fedora:43
          container_base_image: registry.fedoraproject.org/fedora:43
          container_bootstrap_packages: systemd sudo python3 python3-libdnf5
        base-almalinux10:
          container_image: localhost/molecule-base-almalinux:10
          container_base_image: docker.io/library/almalinux:10
          container_bootstrap_packages: systemd sudo python3 python3-dnf
      vars:
        ansible_connection: containers.podman.podman
        # The role connects as an unprivileged user and escalates with sudo,
        # as it does on real hosts.
        ansible_user: molecule
        container_command: /sbin/init
        user:
          name: molecule
          group: molecule
          home: /home/molecule
