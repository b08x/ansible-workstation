---
all:
  children:
    molecule:
      hosts:
        base-fedora43:
          container_image: localhost/molecule-base-fedora:43
          container_base_image: registry.fedoraproject.org/fedora:43
      vars:
        ansible_connection: containers.podman.podman
        # Homebrew refuses to install as root, so the role runs as an
        # unprivileged user and escalates with sudo, as it does on real hosts.
        ansible_user: molecule
        container_command: /sbin/init
        user:
          name: molecule
          group: molecule
          home: /home/molecule
