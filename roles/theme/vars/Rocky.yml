---
# distribution package variables for roles/theme on Rocky Linux
# gtksourceview5 is not built for EL 9; dropped here so one list serves both majors.

_theme_distro_packages:
  qt:
    - qt6-qtbase
    - qt6-qttools
    - qt6-qtmultimedia
    - qt6-qtdeclarative
    - qt5-qtbase
    - qt5-qttools
    - qt5-qtquickcontrols2
    - qt5-qtgraphicaleffects
    - qscintilla-qt5
    - qt5ct
    - qt6ct
  gtk:
    - gtk4
    - gtk3-devel
    - gtksourceview4
  yaru:
    - gtk3-devel
    - gnome-tweaks
    - sassc
    - meson
    - ninja-build
