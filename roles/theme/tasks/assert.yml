---
# Pre-flight assertions for roles/theme (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the theme role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["theme", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The theme role only supports RedHat-family distributions.
      Current host is {{ ansible_distribution | default('Unknown') }}.
    quiet: false
  tags: ["theme", "assert", "always"]

- name: Assert package manager is DNF
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The theme role relies on DNF/DNF5 package management.
      Detected package manager: '{{ ansible_pkg_mgr | default('unknown') }}'.
    quiet: true
  tags: ["theme", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _theme_effective_uid
  changed_when: false
  check_mode: false
  tags: ["theme", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _theme_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The theme role requires root privileges.
      Effective UID is {{ _theme_effective_uid.stdout | trim }}.
    quiet: true
  tags: ["theme", "assert", "always"]

- name: Assert valid desktop_environment and theme_name values
  ansible.builtin.assert:
    that:
      - (desktop_environment | default('none')) in ['none', 'gnome', 'cosmic', 'sway']
      - theme_name in ['yaru', 'none']
    fail_msg: >-
      Invalid theme configuration: desktop_environment='{{ desktop_environment | default('none') }}',
      theme_name='{{ theme_name | default('') }}'.
    quiet: true
  tags: ["theme", "assert", "always"]

- name: Assert theme boolean flags are valid
  ansible.builtin.assert:
    that:
      - theme_install_toolkits is boolean
      - theme_force_install is boolean
    fail_msg: "theme_install_toolkits and theme_force_install must be booleans."
    quiet: true
  tags: ["theme", "assert", "always"]
