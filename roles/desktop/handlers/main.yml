---
# handlers file for b08x.devworkstation.desktop

- name: Daemon reload
  ansible.builtin.systemd:
    daemon_reload: true
  listen: "Daemon reload"

- name: GDM restart | list sessions on local seats
  ansible.builtin.shell: |
    set -o pipefail
    loginctl list-sessions --no-legend --no-pager 2>/dev/null | while read -r _session _uid _user _seat _rest; do
      if [ -n "${_seat}" ]; then
        printf '%s %s\n' "${_user}" "${_uid}"
      fi
    done | sort -u
  args:
    executable: /bin/bash
  register: desktop_gdm_seat_sessions
  changed_when: false
  check_mode: false
  listen: "Restart GDM"

- name: GDM restart | restart GDM
  ansible.builtin.service:
    name: gdm
    state: restarted
  when:
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type | default('') not in ['container', 'docker', 'podman']
    - desktop_gdm_seat_sessions.stdout | default('') | trim | length == 0
  listen: "Restart GDM"

- name: GDM restart | show pending-restart window to logged-in users
  ansible.builtin.command:
    cmd: >-
      runuser -u {{ desktop_gdm_session_user }} -- env
      DISPLAY=:0
      XDG_RUNTIME_DIR=/run/user/{{ desktop_gdm_session_uid }}
      DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/{{ desktop_gdm_session_uid }}/bus
      zenity --info --timeout 300
      --title 'GDM configuration changed'
      --text 'GDM settings were updated, but you are logged in. Log out and back in (or reboot) to apply them.'
  vars:
    desktop_gdm_session_user: "{{ item.split(' ')[0] }}"
    desktop_gdm_session_uid: "{{ item.split(' ')[1] }}"
  loop: "{{ desktop_gdm_seat_sessions.stdout_lines | default([]) }}"
  loop_control:
    label: "{{ item.split(' ')[0] }}"
  changed_when: false
  failed_when: false
  listen: "Restart GDM"
