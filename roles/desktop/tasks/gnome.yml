---
- name: Report missing GNOME package list for this distribution
  ansible.builtin.debug:
    msg: >-
      desktop_packages has no gnome key for {{ ansible_distribution }};
      skipping the GNOME package install.
  when: (desktop_packages.gnome | default([]) | length) == 0
  tags: ["packages", "desktop", "gnome"]

- name: Install GNOME packages
  ansible.builtin.dnf:
    name: "{{ desktop_packages.gnome | reject('equalto', '@graphical-server-environment') | list }}"
    state: present
    allowerasing: true
  when: (desktop_packages.gnome | default([]) | reject('equalto', '@graphical-server-environment') | list | length) > 0
  tags: ["packages", "desktop", "gnome"]

- name: Ensure GDM configuration directory exists
  ansible.builtin.file:
    path: /etc/gdm
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ["desktop", "gnome", "gdm"]

- name: Configure GDM to use Wayland in /etc/gdm/custom.conf
  community.general.ini_file:
    path: /etc/gdm/custom.conf
    section: daemon
    option: WaylandEnable
    value: "true"
    owner: root
    group: root
    mode: "0644"
  notify: Restart GDM
  tags: ["desktop", "gnome", "gdm"]

- name: Get the current default systemd target
  ansible.builtin.command: systemctl get-default
  changed_when: false
  check_mode: false
  register: desktop_current_target
  tags: ["desktop", "gnome", "systemd"]

- name: Set default target to graphical
  ansible.builtin.command: systemctl set-default graphical.target
  when:
    - desktop_current_target.stdout | default('') | trim != 'graphical.target'
  register: desktop_set_default_target
  changed_when: desktop_set_default_target.rc == 0
  tags: ["desktop", "gnome", "systemd"]

- name: Ensure GDM service is enabled and started
  ansible.builtin.service:
    name: gdm
    enabled: true
    state: started
  when:
    - ansible_service_mgr == 'systemd'
    - ansible_virtualization_type | default('') not in ['container', 'docker', 'podman']
  tags: ["desktop", "gnome", "gdm", "systemd"]
