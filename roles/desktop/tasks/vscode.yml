---
- name: Install VS Code via Flatpak
  when: desktop_vscode_flatpak | default(false) | bool
  block:
    - name: Install VS Code via Flatpak
      community.general.flatpak:
        name: com.visualstudio.code
        state: present
        method: system
        remote: flathub

- name: Install VS Code from dnf repo
  when: not (desktop_vscode_flatpak | default(false) | bool)
  block:
    - name: Import Microsoft GPG key
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Add Visual Studio Code repository
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/vscode.repo
        owner: root
        group: root
        mode: "0644"
        content: |
          [code]
          name=Visual Studio Code
          baseurl=https://packages.microsoft.com/yumrepos/vscode
          enabled=1
          gpgcheck=1
          gpgkey=https://packages.microsoft.com/keys/microsoft.asc
        backup: true

    - name: Update package cache (dnf)
      ansible.builtin.dnf:
        update_cache: true

    - name: Install Visual Studio Code (dnf)
      ansible.builtin.dnf:
        name: code
        state: present
