---
# Pre-flight assertions for desktop role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the desktop role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["desktop", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The desktop role only supports RedHat-family distributions
      (Fedora, AlmaLinux, Rocky Linux). Current host is
      {{ ansible_distribution | default('Unknown') }}
      ({{ ansible_os_family | default('Unknown') }}).
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["desktop", "assert", "always"]

- name: Assert package manager is DNF
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The desktop role relies on DNF/DNF5 package management.
      Detected package manager: '{{ ansible_pkg_mgr | default('unknown') }}'.
    quiet: true
  tags: ["desktop", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _desktop_effective_uid
  changed_when: false
  check_mode: false
  tags: ["desktop", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _desktop_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The desktop role installs system packages and desktop repositories
      requiring root privileges. Ensure 'become: true' is enabled for this play or role.
    quiet: true
  tags: ["desktop", "assert", "always"]

- name: Assert supported desktop environment
  ansible.builtin.assert:
    that:
      - desktop_environment in ['gnome', 'kde', 'xfce', 'none']
    fail_msg: >-
      Unsupported desktop environment '{{ desktop_environment }}'.
      Allowed values: gnome, kde, xfce, none.
    quiet: true
  tags: ["desktop", "assert", "always"]
