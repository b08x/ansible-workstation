---
# defaults file for b08x.devworkstation.desktop

# Variable that will be displayed in debug output
# This demonstrates proper role variable naming with the 'run_' prefix
desktop_my_variable: "default_value"
# Control pre-flight assertions (Fail-Fast Pattern)
desktop_assert_enabled: true

desktop_environment: gnome

desktop_vscode_flatpak: false
desktop_vscode_force_install: false

desktop_theme_force_install: false

desktop_system_flatpaks:
  - com.mattjakeman.ExtensionManager
  - page.tesk.Refine
  - com.github.tchx84.Flatseal
  - io.github.flattool.Warehouse
  - io.github.dvlv.boxbuddyrs
  - com.ranfdev.DistroShelf
  - org.easycoding.TunedSwitcher
  - app.devsuite.Ptyxis
  - io.github.vikdevelop.SaveDesktop
  - io.podman_desktop.PodmanDesktop
  - io.github.tanaybhomia.Whisp
  - org.remmina.Remmina
  - org.cutwire.Drift
  - org.darktable.Darktable
  - io.dbeaver.DBeaverCommunity
  - com.saivert.pwvucontrol
  - com.discordapp.Discord
  - org.upscayl.Upscayl
  - org.audacityteam.Audacity

# Antigravity Hub + IDE (the agy CLI is installed by the coding_agents role)
desktop_antigravity_state: present
desktop_antigravity_hub_url: "https://storage.googleapis.com/antigravity-public/antigravity-hub/2.11.0-6376446768316416/linux-x64/Antigravity.tar.gz"
desktop_antigravity_ide_url: >-
  {{ 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/' ~
     '2.5.5-4923483625488384/linux-x64/Antigravity%20IDE.tar.gz' }}

# GNOME Shell Extensions have been extracted to ~/.config/yadm/bootstrap.d/40-gnome-extensions.sh
