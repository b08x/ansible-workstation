---
# defaults file for b08x.devworkstation.desktop

# Variable that will be displayed in debug output
# This demonstrates proper role variable naming with the 'run_' prefix
desktop_my_variable: "default_value"

desktop_environment: gnome

desktop_vscode_flatpak: false

desktop_system_flatpaks:
  - com.mattjakeman.ExtensionManager
  - com.github.tchx84.Flatseal
  - io.github.flattool.Warehouse
  - io.github.dvlv.boxbuddyrs

# Antigravity Hub + IDE (the agy CLI is installed by the coding_agents role)
desktop_antigravity_state: present
desktop_antigravity_hub_url: "https://storage.googleapis.com/antigravity-public/antigravity-hub/2.11.0-6376446768316416/linux-x64/Antigravity.tar.gz"
desktop_antigravity_ide_url: >-
  {{ 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/' ~
     '2.5.5-4923483625488384/linux-x64/Antigravity%20IDE.tar.gz' }}

# GNOME Shell Extensions to ensure are installed and enabled
desktop_gnome_extensions:
  # System extensions (available via dnf)
  - gnome-shell-extension-appindicator
  - gnome-shell-extension-apps-menu
  - gnome-shell-extension-auto-move-windows
  - gnome-shell-extension-dash-to-dock
  - gnome-shell-extension-places-menu
  - gnome-shell-extension-user-theme
  - gnome-shell-extension-window-list
  - gnome-shell-extension-launch-new-instance
  - gnome-shell-extension-workspace-indicator
  # User extensions (installed to ~/.local/share/gnome-shell/extensions/)
  # These need to be installed separately (e.g., from extensions.gnome.org)
  # and will be enabled if present
desktop_gnome_user_extensions:
  # - hyprwhspr-waveform@ninyawee.github.io
  - notification-timeout@chlumskyvaclav.gmail.com
  - notification-configurator@exposedcat
  - junk-notification-cleaner@murar8.github.com
  - kando-integration@kando-menu.github.io
  # - omega13@b08x.github.io
  # - paperwm@paperwm.github.io
