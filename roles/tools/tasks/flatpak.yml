---
# tasks file for Flatpak configuration in roles/tools

- name: Ensure flatpak package is installed
  ansible.builtin.dnf:
    name: flatpak
    state: present
  tags: ["flathub", "flatpaks", "packages", "tools"]

- name: Ensure Flathub remote repository is present
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["flathub", "flatpaks", "tools"]

- name: Install system Flatpak applications
  community.general.flatpak:
    name: "{{ item }}"
    state: present
    method: system
    remote: flathub
  loop: "{{ system_flatpaks | default(tools_system_flatpaks) }}"
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["flatpaks", "tools"]
