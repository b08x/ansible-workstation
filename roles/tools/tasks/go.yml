---
# tasks file for Go toolchain validation in roles/tools
# Verifies that a valid Go compiler is available for user CLI tools (e.g. Crush).

- name: Ensure user local bin and go directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ tools_user }}"
    mode: "0755"
  loop:
    - "{{ tools_user_local_bin }}"
    - "{{ tools_user_go_bin }}"
  become: true
  become_user: "{{ tools_user }}"
  tags: ["go", "tools"]

- name: Probe Go compiler executable
  ansible.builtin.command: which go
  register: tools_go_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["go", "tools"]

- name: Probe Go compiler version
  ansible.builtin.command: go version
  register: tools_go_version_raw
  changed_when: false
  failed_when: false
  check_mode: false
  when: (tools_go_check.rc | default(1)) == 0
  tags: ["go", "tools"]

- name: Assert proper Go environment is in place
  ansible.builtin.assert:
    that:
      - (tools_go_check.rc | default(1)) == 0
      - tools_go_version_raw.stdout is defined
      - (tools_go_version_raw.stdout | regex_search('[0-9]+\.[0-9]+') | default('0', true)) is version(tools_go_min_version | default('1.22'), '>=')
    fail_msg: >-
      A valid Go compiler (version >= {{ tools_go_min_version | default('1.22') }}) was not found in PATH.
      Found: {{ tools_go_version_raw.stdout | default('none') }}.
      Ensure Go is installed (e.g. via system package manager: dnf install golang).
    success_msg: "Found valid Go environment: {{ tools_go_version_raw.stdout | default('') | trim }}"
    quiet: false
  tags: ["go", "tools"]
