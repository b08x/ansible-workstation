---
# tasks file for tools
# Dispatches system utilities, developer compilers, vendor toolchains, and user-space coding agent CLI installers.

- name: Starting tools tasks
  ansible.builtin.debug:
    msg: "Starting tools installation tasks for user {{ tools_user }}"
  tags: ["always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: tools_assert_enabled | default(true) | bool
  tags: ["tools", "assert", "always"]

- name: Include developer toolchain and runtime tasks
  ansible.builtin.include_tasks: runtimes.yml
  when: tools_install_runtimes | default(true) | bool
  tags: ["runtimes", "compilers", "tools"]

- name: Include transcribe.cpp compilation tasks
  ansible.builtin.include_tasks: transcribe-cpp.yml
  when: tools_install_transcribe | default(true) | bool
  tags: ["transcribe", "tools"]

- name: Include bun installation tasks
  ansible.builtin.include_tasks: bun.yml
  when: tools_install_bun | default(true) | bool
  tags: ["bun", "tools"]

- name: Include user-space Go toolchain installation tasks
  ansible.builtin.include_tasks: go.yml
  when: tools_install_go | default(true) | bool
  tags: ["go", "tools"]

- name: Include Antigravity CLI installation tasks
  ansible.builtin.include_tasks: antigravity.yml
  when: tools_install_antigravity | default(true) | bool
  tags: ["antigravity", "agents", "tools"]

- name: Include Claude Code CLI installation tasks
  ansible.builtin.include_tasks: claude.yml
  when: tools_install_claude | default(true) | bool
  tags: ["claude", "agents", "tools"]

- name: Include Crush CLI installation tasks
  ansible.builtin.include_tasks: crush.yml
  when: tools_install_crush | default(true) | bool
  tags: ["crush", "agents", "tools"]

- name: Include OpenCode CLI installation tasks
  ansible.builtin.include_tasks: opencode.yml
  when: tools_install_opencode | default(true) | bool
  tags: ["opencode", "agents", "tools"]

- name: Include gitflow installation tasks
  ansible.builtin.include_tasks: gitflow.yml
  when: tools_install_gitflow | default(true) | bool
  tags: ["gitflow", "tools"]

- name: Include inxi system information tasks
  ansible.builtin.include_tasks: inxi.yml
  when: tools_install_inxi | default(true) | bool
  tags: ["inxi", "tools"]

- name: Include Homebrew configuration tasks
  ansible.builtin.include_tasks: homebrew.yml
  when:
    - tools_install_homebrew | default(false) | bool
    - ansible_distribution == 'Fedora'
  tags: ["homebrew", "tools"]

- name: Include Visual Studio Code installation tasks
  ansible.builtin.include_tasks: vscode.yml
  when:
    - tools_install_gui_apps | default(true) | bool
    - tools_install_vscode | default(true) | bool
  tags: ["vscode", "tools"]

- name: Include Flatpak management and application tasks
  ansible.builtin.include_tasks: flatpak.yml
  when:
    - tools_install_gui_apps | default(true) | bool
    - tools_install_flatpaks | default(true) | bool
  tags: ["flathub", "flatpaks", "tools"]

- name: Include input-remapper configuration tasks
  ansible.builtin.include_tasks: input-remapper.yml
  when:
    - tools_install_gui_apps | default(true) | bool
    - tools_install_input_remapper | default(true) | bool
  tags: ["input-remapper", "tools"]
