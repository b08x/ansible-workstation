---
# tasks file for tools
# Dispatches host-level GUI utilities: VS Code (real opt-in), system
# Flatpaks, and input-remapper. User-space toolchains live in roles/user;
# inxi/gitflow live in roles/common; homebrew was dropped.

- name: Starting tools tasks
  ansible.builtin.debug:
    msg: "Starting tools installation tasks"
  tags: ["tools", "always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: tools_assert_enabled | default(true) | bool
  tags: ["tools", "assert", "always"]

- name: Include Flatpak management and application tasks
  ansible.builtin.include_tasks: flatpak.yml
  when:
    - tools_install_gui_apps | default(true) | bool
    - tools_install_flatpaks | default(true) | bool
  tags: ["flathub", "flatpaks", "tools"]

- name: Include input-remapper configuration tasks
  ansible.builtin.include_tasks: input-remapper.yml
  when:
    - tools_install_gui_apps | default(true) | bool
    - tools_install_input_remapper | default(true) | bool
  tags: ["input-remapper", "tools"]

- name: Include Visual Studio Code installation tasks
  ansible.builtin.include_tasks: vscode.yml
  when:
    - tools_install_gui_apps | default(true) | bool
    - tools_install_vscode | default(false) | bool
  tags: ["vscode", "tools"]
