---
# tasks file for Claude Code CLI in roles/tools
# Config files and MCP definitions are managed by Yadm dotfiles.

- name: Check for npm command availability
  ansible.builtin.command: which npm
  register: tools_npm_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["claude", "agents", "tools"]

- name: Check if Claude Code binary exists
  ansible.builtin.stat:
    path: "{{ tools_user_local_bin }}/claude"
  register: tools_claude_stat
  tags: ["claude", "agents", "tools"]

- name: Install Claude Code CLI
  when:
    - (tools_npm_check.rc | default(1)) == 0
    - >
      (not (tools_claude_stat.stat.exists | default(false))) or
      (tools_claude_force_install | default(false) | bool)
  tags: ["claude", "agents", "tools"]
  become: true
  become_user: "{{ tools_user }}"
  block:
    - name: Configure npm user prefix
      ansible.builtin.command: "npm config set prefix {{ tools_user_home }}/.local"
      changed_when: false

    - name: Install Claude Code npm package
      ansible.builtin.command: "npm install -g --prefix {{ tools_user_home }}/.local {{ tools_claude_npm_package }}"
      changed_when: true

- name: Warn when npm is missing for Claude Code
  ansible.builtin.debug:
    msg: "WARNING: npm not found in PATH — cannot install Claude Code CLI. Install nodejs/npm via the base role."
  when:
    - (tools_npm_check.rc | default(1)) != 0
    - not (tools_claude_stat.stat.exists | default(false))
  tags: ["claude", "agents", "tools"]
