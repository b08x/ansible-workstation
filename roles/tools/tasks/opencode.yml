---
# tasks file for OpenCode CLI in roles/tools
# Config files (~/.config/opencode/opencode.json) are managed by Yadm dotfiles.

- name: Check for npm command availability for OpenCode
  ansible.builtin.command: which npm
  register: tools_opencode_npm_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["opencode", "agents", "tools"]

- name: Check if OpenCode binary exists
  ansible.builtin.stat:
    path: "{{ tools_user_local_bin }}/opencode"
  register: tools_opencode_stat
  tags: ["opencode", "agents", "tools"]

- name: Install OpenCode CLI
  when:
    - (tools_opencode_npm_check.rc | default(1)) == 0
    - >
      (not (tools_opencode_stat.stat.exists | default(false))) or
      (tools_opencode_force_install | default(false) | bool)
  tags: ["opencode", "agents", "tools"]
  become: true
  become_user: "{{ tools_user }}"
  block:
    - name: Configure npm user prefix for OpenCode
      ansible.builtin.command: "npm config set prefix {{ tools_user_home }}/.local"
      changed_when: false

    - name: Install OpenCode npm package
      ansible.builtin.command: "npm install -g --prefix {{ tools_user_home }}/.local {{ tools_opencode_npm_package }}"
      changed_when: true

- name: Warn when npm is missing for OpenCode
  ansible.builtin.debug:
    msg: "WARNING: npm not found in PATH — cannot install OpenCode CLI. Install nodejs/npm via the base role."
  when:
    - (tools_opencode_npm_check.rc | default(1)) != 0
    - not (tools_opencode_stat.stat.exists | default(false))
  tags: ["opencode", "agents", "tools"]
