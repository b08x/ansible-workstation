---
# defaults file for tools
# Defines default configuration and feature flags for host utilities and agent CLI installations.

# Control pre-flight assertions (Fail-Fast Pattern)
tools_assert_enabled: true

# Target user account for user-space installations
tools_user: "{{ workstation_user | default(user.name | default(ansible_user_id)) }}"
tools_user_home: "{{ user.home | default('/home/' ~ tools_user) }}"
tools_user_local_bin: "{{ tools_user_home }}/.local/bin"
tools_user_go_bin: "{{ tools_user_home }}/go/bin"

# -- Developer Toolchains and Language Runtimes --
tools_install_runtimes: true
tools_runtime_packages:
  - golang
  - nodejs
  - npm

# -- System Tools (Root/System-wide in /usr/local/bin) --

# transcribe.cpp (Whisper transcription CLI)
tools_install_transcribe: true
tools_transcribe_require_gpu: true
tools_transcribe_require_min_specs: true
tools_transcribe_min_cores: 16
tools_transcribe_min_mem_gb: 32
tools_transcribe_min_mem_mb: "{{ ((tools_transcribe_min_mem_gb | int) * 1024 * 0.9) | int }}"
tools_transcribe_repo: "https://github.com/handy-computer/transcribe.cpp.git"
tools_transcribe_version: "main"
tools_transcribe_build_dir: "/tmp/transcribe.cpp-build"
tools_transcribe_dest: "/usr/local/bin/transcribe"
tools_transcribe_force_build: false
tools_transcribe_cleanup: true

# Bun (standalone JS/TS runtime)
tools_install_bun: true
tools_bun_url: "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip"
tools_bun_dest: "/usr/local/bin/bun"
tools_bun_force_install: false

# -- Auxiliary Developer CLIs and Toolchains --

# Intel Graphics and oneAPI Toolkit
tools_install_intel: "{{ intel_oneapi_install | default(false) | bool }}"
tools_install_intel_graphics: false
tools_intel_graphics_required: false

# gitflow-avh
tools_install_gitflow: true
tools_gitflow_copr_fedora: "b08x/syncopated"
tools_gitflow_copr_el: "b08x/syncopated"
tools_gitflow_force_install: false

# inxi system information tool
tools_install_inxi: true

# Homebrew (Fedora only)
tools_install_homebrew: false

# -- User Tools & Toolchains (User-space in ~/.local/bin and ~/.local/go) --

# Go toolchain environment validation
tools_install_go: true
tools_go_min_version: "1.22"
tools_go_version: "1.27.1"
tools_go_url: "https://go.dev/dl/go{{ tools_go_version }}.linux-amd64.tar.gz"
tools_go_dest_dir: "{{ tools_user_home }}/.local/go"
tools_go_force_install: false

# Antigravity CLI (agy) and Hub + IDE
tools_install_antigravity: true
tools_antigravity_install_url: "https://antigravity.google/cli/install.sh"
tools_antigravity_force_install: false
tools_install_antigravity_gui: "{{ tools_install_gui_apps | default(true) | bool }}"
tools_antigravity_state: present
tools_antigravity_hub_url: "https://storage.googleapis.com/antigravity-public/antigravity-hub/2.11.0-6376446768316416/linux-x64/Antigravity.tar.gz"
tools_antigravity_ide_url: >-
  {{ 'https://edgedl.me.gvt1.com/edgedl/release2/j0qc3/antigravity/stable/' ~
     '2.5.5-4923483625488384/linux-x64/Antigravity%20IDE.tar.gz' }}

# Claude Code CLI
tools_install_claude: true
tools_claude_npm_package: "@anthropic-ai/claude-code"
tools_claude_force_install: false

# Crush CLI (Charm)
tools_install_crush: true
tools_crush_go_package: "github.com/charmbracelet/crush@latest"
tools_crush_force_install: false

# OpenCode CLI
tools_install_opencode: true
tools_opencode_npm_package: "opencode-ai"
tools_opencode_force_install: false

# -- Graphical Desktop Tools & Applications --
tools_install_gui_apps: "{{ auto_enable_desktop | default(true) | bool }}"

# Visual Studio Code
tools_install_vscode: "{{ tools_install_gui_apps | default(true) | bool }}"
tools_vscode_flatpak: false
tools_vscode_force_install: false

# System Flatpaks and Flathub Remote
tools_install_flatpaks: "{{ tools_install_gui_apps | default(true) | bool }}"
tools_system_flatpaks:
  - com.mattjakeman.ExtensionManager
  - page.tesk.Refine
  - com.github.tchx84.Flatseal
  - io.github.flattool.Warehouse
  - io.github.dvlv.boxbuddyrs
  - com.ranfdev.DistroShelf
  - org.easycoding.TunedSwitcher
  - app.devsuite.Ptyxis
  - io.github.vikdevelop.SaveDesktop
  - io.podman_desktop.PodmanDesktop
  - io.github.tanaybhomia.Whisp
  - org.remmina.Remmina
  - org.cutwire.Drift
  - org.darktable.Darktable
  - io.dbeaver.DBeaverCommunity
  - com.saivert.pwvucontrol
  - com.discordapp.Discord
  - org.upscayl.Upscayl
  - org.audacityteam.Audacity

# input-remapper
tools_install_input_remapper: "{{ tools_install_gui_apps | default(true) | bool }}"

tools_skills_repos:
  - https://github.com/NeoLabHQ/context-engineering-kit.git
  - https://github.com/cathrynlavery/diagram-design.git
  - https://github.com/virgiliojr94/book-to-skill.git
  - git@github.com:oh-my-mermaid/oh-my-mermaid.git
  - https://github.com/backnotprop/plannotator.git
  - https://github.com/kajisho5/ffmpeg-skill
