---
# argument spec file for tools

argument_specs:
  main:
    short_description: Tools role managing host-level GUI utilities (VS Code, system Flatpaks, input-remapper).
    options:
      tools_assert_enabled:
        type: bool
        description: Enable pre-flight environment, platform, and privilege assertions.
        default: true
      tools_install_gui_apps:
        type: bool
        description: Master gate for graphical desktop applications; lazily consumes the Tier 1 auto_enable_desktop flag.
        default: "{{ auto_enable_desktop | default(true) | bool }}"
      tools_install_vscode:
        type: bool
        description: Install Visual Studio Code (real opt-in - false by default; extensions live in roles/user).
        default: false
      tools_vscode_flatpak:
        type: bool
        description: Install VS Code via Flatpak instead of the native DNF repo.
        default: false
      tools_vscode_force_install:
        type: bool
        description: Force install VS Code even if the code binary exists.
        default: false
      tools_install_flatpaks:
        type: bool
        description: Enable Flatpak package, Flathub remote, and Flatpak application installations.
        default: "{{ tools_install_gui_apps | default(true) | bool }}"
      tools_system_flatpaks:
        type: list
        elements: str
        description: List of system Flatpak application IDs to install.
        default:
          - com.mattjakeman.ExtensionManager
          - page.tesk.Refine
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.dvlv.boxbuddyrs
          - com.ranfdev.DistroShelf
          - org.easycoding.TunedSwitcher
          - app.devsuite.Ptyxis
          - io.github.vikdevelop.SaveDesktop
          - io.podman_desktop.PodmanDesktop
          - io.github.tanaybhomia.Whisp
          - org.remmina.Remmina
          - org.cutwire.Drift
          - org.darktable.Darktable
          - io.dbeaver.DBeaverCommunity
          - com.saivert.pwvucontrol
          - com.discordapp.Discord
          - org.upscayl.Upscayl
          - org.audacityteam.Audacity
      tools_install_input_remapper:
        type: bool
        description: Install and configure the input-remapper service.
        default: "{{ tools_install_gui_apps | default(true) | bool }}"
