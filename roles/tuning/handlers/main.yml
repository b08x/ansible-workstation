---
# handlers file for tuning

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false

- name: Trigger udev rules
  ansible.builtin.command: udevadm trigger
  changed_when: false

- name: Restart tuned
  ansible.builtin.systemd:
    name: tuned
    state: restarted
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart cpupower
  ansible.builtin.systemd:
    name: cpupower
    state: restarted
  when: tuning_cpupower_enabled | default(true) | bool
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart rtirq
  ansible.builtin.systemd:
    name: rtirq
    state: restarted
    enabled: true
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart rtkit
  ansible.builtin.systemd:
    name: rtkit-daemon
    state: restarted
    enabled: true
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
