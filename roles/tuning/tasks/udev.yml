---
# Udev rules & hardware optimizations (Timers, SATA, I/O schedulers, Audio PM)

- name: Ensure /etc/udev/rules.d directory exists
  ansible.builtin.file:
    path: /etc/udev/rules.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ["tuning", "udev"]

- name: Install timer permissions udev rule
  ansible.builtin.template:
    src: etc/udev/rules.d/40-timer-permissions.rules.j2
    dest: /etc/udev/rules.d/40-timer-permissions.rules
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload udev rules
    - Trigger udev rules
  tags: ["tuning", "udev"]

- name: Install SATA active link power management udev rule
  ansible.builtin.template:
    src: etc/udev/rules.d/50-sata.rules.j2
    dest: /etc/udev/rules.d/50-sata.rules
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload udev rules
    - Trigger udev rules
  when: tuning_udev_sata_enabled | default(true) | bool
  tags: ["tuning", "udev"]

- name: Install I/O schedulers udev rule
  ansible.builtin.template:
    src: etc/udev/rules.d/60-ioschedulers.rules.j2
    dest: /etc/udev/rules.d/60-ioschedulers.rules
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload udev rules
    - Trigger udev rules
  when: tuning_udev_iosched_enabled | default(true) | bool
  tags: ["tuning", "udev"]

- name: Ensure audio-pm-ctl parent directory exists
  ansible.builtin.file:
    path: "{{ tuning_udev_audio_pm_ctl_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: tuning_udev_audio_pm_enabled | default(true) | bool
  tags: ["tuning", "udev"]

- name: Install audio-pm-ctl helper script
  ansible.builtin.copy:
    src: audio-pm-ctl
    dest: "{{ tuning_udev_audio_pm_ctl_path }}"
    owner: root
    group: root
    mode: "0755"
    backup: true
  when: tuning_udev_audio_pm_enabled | default(true) | bool
  tags: ["tuning", "udev"]

- name: Install audio power management udev rule
  ansible.builtin.template:
    src: etc/udev/rules.d/20-audio-pm.rules.j2
    dest: /etc/udev/rules.d/20-audio-pm.rules
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify:
    - Reload udev rules
    - Trigger udev rules
  when: tuning_udev_audio_pm_enabled | default(true) | bool
  tags: ["tuning", "udev"]
