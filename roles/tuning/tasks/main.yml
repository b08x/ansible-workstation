---
# tasks file for tuning

- name: Starting system tuning tasks
  ansible.builtin.debug:
    msg: "Starting system tuning tasks"
  tags: ["tuning", "always"]

- name: Validate pre-flight assertions and platform support
  ansible.builtin.include_tasks: assert.yml
  when: tuning_assert_enabled | default(true) | bool
  tags: ["tuning", "assert", "always"]

- name: Load distribution variables
  ansible.builtin.include_vars: "{{ _tuning_distro_vars }}"
  vars:
    _tuning_distro_vfile: "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    _tuning_distro_vars: >-
      {{ lookup('ansible.builtin.first_found',
                files=[_tuning_distro_vfile, ansible_distribution ~ '.yml', 'default.yml'],
                paths=role_path ~ '/vars',
                errors='ignore') }}
  when: _tuning_distro_vars is defined and _tuning_distro_vars | length > 0
  tags: ["tuning", "always"]

- name: Install distribution packages
  ansible.builtin.include_tasks: packages.yml
  when: tuning_packages_enabled | default(true) | bool
  tags: ["tuning", "packages"]

- name: Configure user groups
  ansible.builtin.include_tasks: user_groups.yml
  when: tuning_groups_enabled | default(true) | bool
  tags: ["tuning", "groups"]

- name: Configure kernel limits, sysctl, and zram
  ansible.builtin.include_tasks: kernel.yml
  tags: ["tuning", "limits", "sysctl", "zram"]

- name: Configure udev rules
  ansible.builtin.include_tasks: udev.yml
  when: tuning_udev_enabled | default(true) | bool
  tags: ["tuning", "udev"]

- name: Configure systemd manager settings
  ansible.builtin.include_tasks: systemd.yml
  when: tuning_systemd_enabled | default(true) | bool
  tags: ["tuning", "systemd"]

- name: Configure cpupower
  ansible.builtin.include_tasks: cpupower.yml
  tags: ["tuning", "cpupower"]

- name: Flush tuning handlers immediately
  ansible.builtin.meta: flush_handlers
  tags: ["tuning", "always"]
