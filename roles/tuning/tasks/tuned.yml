---
# Tuned profile management

- name: Assert tuned configuration validity
  ansible.builtin.assert:
    that:
      - tuning_tuned_profile is defined
      - tuning_tuned_profile | length > 0
    fail_msg: "tuning_tuned_profile must be defined when tuning_tuned_enabled is true"
    quiet: true
  when: tuning_tuned_enabled | default(true) | bool
  tags: ["tuning", "tuned", "always"]

- name: Enable and start tuned service
  ansible.builtin.systemd:
    name: tuned
    state: started
    enabled: "{{ tuning_tuned_enabled | default(true) | bool }}"
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["tuning", "tuned"]

- name: Wait for tuned daemon to become ready on DBus
  ansible.builtin.command: tuned-adm active
  register: tuning_tuned_active
  retries: 6
  delay: 2
  until: tuning_tuned_active.rc == 0
  changed_when: false
  failed_when: false
  when:
    - tuning_tuned_enabled | default(true) | bool
    - tuning_tuned_profile is defined
    - tuning_tuned_profile | length > 0
  tags: ["tuning", "tuned"]

- name: Set active tuned profile
  ansible.builtin.command: "tuned-adm profile {{ tuning_tuned_profile }}"
  register: tuning_tuned_set_profile
  changed_when: true
  when:
    - tuning_tuned_enabled | default(true) | bool
    - tuning_tuned_profile is defined
    - tuning_tuned_profile | length > 0
    - "tuning_tuned_profile not in (tuning_tuned_active.stdout | default(''))"
  tags: ["tuning", "tuned"]
