---
# Rather than suppressing sysctl failures, skip the hardware-dependent keys the
# host genuinely lacks: /proc/sys/<key with dots as slashes> exists only where
# the knob does. Everything left is applied without a failure mask, so a
# misspelled or unsupported key still fails the run.

- name: Configure and apply sysctl settings
  tags: ["tuning", "sysctl"]
  block:
    - name: Assert sysctl parameters mapping
      ansible.builtin.assert:
        that:
          - tuning_sysctl is mapping
          - tuning_sysctl | length > 0
        fail_msg: "tuning_sysctl must be a non-empty dictionary of sysctl parameters"
        quiet: true

    - name: Ensure sysctl drop-in directory exists
      ansible.builtin.file:
        path: "{{ tuning_sysctl_file | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Test settability of optional sysctl keys
      ansible.builtin.command:
        cmd: "sysctl -w {{ item.key }}={{ item.value }}"
      check_mode: false
      changed_when: false
      failed_when: false
      loop: >-
        {{ tuning_sysctl | dict2items
           | selectattr('key', 'in', tuning_sysctl_optional)
           | list }}
      register: tuning_sysctl_optional_test

    - name: Collect optional sysctl keys this host does not support
      ansible.builtin.set_fact:
        tuning_sysctl_unsupported: >-
          {{ tuning_sysctl_optional_test.results
             | selectattr('rc', 'ne', 0)
             | map(attribute='item.key')
             | list }}

    - name: Report optional sysctl keys skipped on this host
      ansible.builtin.debug:
        msg: >-
          Skipping optional sysctl keys unsupported on {{ inventory_hostname }}:
          {{ tuning_sysctl_unsupported | join(', ') }}
      when: tuning_sysctl_unsupported | length > 0

    - name: Set sysctl parameters
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: "{{ tuning_sysctl_file }}"
        state: present
        reload: true
      loop: >-
        {{ tuning_sysctl | dict2items
           | rejectattr('key', 'in', tuning_sysctl_unsupported)
           | list }}
      loop_control:
        label: "{{ item.key }}"

  rescue:
    # Shape 1 (add context, then re-raise): kernel parameters are critical to system
    # tuning; a failure must provide actionable diagnostics and fail the run.
    - name: Report sysctl configuration failure
      ansible.builtin.debug:
        msg: >-
          Failed to apply sysctl parameter. Check that parameters defined in
          tuning_sysctl are supported by the active kernel or add missing
          hardware-dependent keys to tuning_sysctl_optional.
          Failed task: {{ ansible_failed_task.name | default('unknown') }}.
          Failed key: {{ ansible_failed_result.item.key | default(ansible_failed_result.item | default('unknown')) }}.
          Error: {{ ansible_failed_result.msg | default('no details available') }}

    - name: Fail the play on sysctl configuration failure
      ansible.builtin.fail:
        msg: "Sysctl configuration failed - see the preceding task output."
