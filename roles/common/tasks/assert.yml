---
# Pre-flight assertions for common role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the common role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["common", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The common role only supports RedHat-family distributions
      (Fedora, AlmaLinux, Rocky Linux). Current host is
      {{ ansible_distribution | default('Unknown') }}
      ({{ ansible_os_family | default('Unknown') }}).
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["common", "assert", "always"]

- name: Assert package manager is DNF
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The common role relies on DNF/DNF5 package management.
      Detected package manager: '{{ ansible_pkg_mgr | default('unknown') }}'.
    quiet: true
  tags: ["common", "assert", "always"]

- name: Assert init system is systemd
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: >-
      The common role manages and restarts systemd services (sshd, tuned,
      auditd). Detected service manager:
      '{{ ansible_service_mgr | default('unknown') }}'.
    quiet: true
  tags: ["common", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _common_effective_uid
  changed_when: false
  check_mode: false
  tags: ["common", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _common_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The common role manages system packages, hardware profiles, and security hardening
      requiring root privileges. Ensure 'become: true' is enabled for this play or role.
    quiet: true
  tags: ["common", "assert", "always"]

- name: Assert workstation user identity is defined
  ansible.builtin.assert:
    that:
      - user is defined
      - user.name is defined
      - user.name | length > 0
    fail_msg: >-
      The common role configures user tooling (yadm, zsh) that requires
      'user.name' to be defined. Set 'user.name' in inventory (e.g. group_vars/all.yml)
      or provide workstation_user.
    quiet: true
  tags: ["common", "assert", "always"]

- name: Assert common feature gates are bool-shaped
  ansible.builtin.assert:
    that:
      - item | default(true) is boolean
        or item | default(true) | string | lower
        in ['true', 'false', 'yes', 'no', 'on', 'off', '1', '0']
    fail_msg: >-
      Common feature gates (inxi, gitflow, packages, syncopated_copr) must be
      booleans (or bool-coercible strings). Got {{ item | default(true) | type_debug }}.
    quiet: true
  loop:
    - "{{ common_install_inxi | default(true) }}"
    - "{{ common_install_gitflow | default(true) }}"
    - "{{ common_packages_enabled | default(true) }}"
    - "{{ common_syncopated_copr_enabled | default(true) }}"
  tags: ["common", "assert", "always"]
