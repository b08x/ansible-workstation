---
# tasks file for inxi installation in roles/common

- name: Install inxi system information tool
  tags: ["inxi", "common"]
  block:
    - name: Check if inxi binary is present
      ansible.builtin.command: which inxi
      environment:
        PATH: "{{ user.home | default('/home/' ~ user.name) }}/.local/bin:/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH | default('') }}"
      register: _common_inxi_check
      changed_when: false
      failed_when: false
      check_mode: false
      tags: ["inxi", "common"]

    - name: Install inxi using package manager
      ansible.builtin.package:
        name: inxi
        state: present
      when: (_common_inxi_check.rc | default(1)) != 0
      tags: ["inxi", "common"]

  rescue:
    - name: Download inxi standalone script from upstream
      ansible.builtin.get_url:
        url: https://codeberg.org/smxi/inxi/raw/branch/master/inxi
        dest: /usr/local/bin/inxi
        mode: "0755"
        owner: root
        group: root
        timeout: 60
      tags: ["inxi", "common"]
