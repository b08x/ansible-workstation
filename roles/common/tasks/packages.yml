---
# Baseline package installation and sshd service activation

- name: Include distribution package variables
  ansible.builtin.include_vars:
    file: "{{ _common_distro_vars }}"
  vars:
    _common_distro_vfile: "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    _common_distro_vars: >-
      {{ lookup('ansible.builtin.first_found',
                files=[_common_distro_vfile, ansible_distribution ~ '.yml'],
                paths=role_path ~ '/vars') }}
  tags: ["common", "packages", "distro"]

- name: Install Common baseline packages
  tags: ["packages", "common"]
  block:
    - name: Install Common baseline packages
      ansible.builtin.dnf:
        name: "{{ _common_distro_packages }}"
        state: present
        allowerasing: true

  rescue:
    - name: Report common package installation failure
      ansible.builtin.debug:
        msg: >-
          Failed to install one or more packages from _common_distro_packages.
          Re-run with -vv to see which package and why; a missing package
          usually means a required repository was never enabled.

    - name: Fail the play on common package installation failure
      ansible.builtin.fail:
        msg: "Common package installation failed - see the preceding task output."

- name: Enable and Start ssh service
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  when: ansible_virtualization_type | default('') not in ['docker', 'podman', 'container']
  tags: ["common", "sshd"]
