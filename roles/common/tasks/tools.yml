---
# Sub-dispatcher for common baseline CLI tools

- name: Include inxi system information tasks
  ansible.builtin.include_tasks: inxi.yml
  when: common_install_inxi | default(true) | bool
  tags: ["inxi", "common"]

- name: Include gitflow installation tasks
  ansible.builtin.include_tasks: gitflow.yml
  when: common_install_gitflow | default(true) | bool
  tags: ["gitflow", "common"]

- name: Include Zsh installation verification
  ansible.builtin.include_tasks: zsh.yml
  tags: ["zsh", "common"]

- name: Include yadm installation tasks
  ansible.builtin.include_tasks: yadm.yml
  tags: ["yadm", "common"]
