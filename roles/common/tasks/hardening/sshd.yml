---
# tasks file for SSH daemon hardening in roles/common (CIS-L2 Workstation)

- name: Ensure /etc/ssh/sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: ["hardening", "sshd", "common"]

- name: Deploy declarative SSH hardening drop-in configuration
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-workstation-cis.conf
    owner: root
    group: root
    mode: "0600"
    backup: true
    content: |
      # Managed by Ansible roles/common (CIS Level 2 Workstation Tailoring)
      PermitRootLogin {{ common_sshd_permit_root_login | default('no') }}
      ClientAliveInterval {{ common_sshd_client_alive_interval | default(300) }}
      ClientAliveCountMax {{ common_sshd_client_alive_count_max | default(3) }}
      MaxAuthTries {{ common_sshd_max_auth_tries | default(4) }}
  notify: restart sshd
  tags: ["hardening", "sshd", "common"]

- name: Ensure sshd service is enabled and started
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  when: ansible_virtualization_type | default('') not in ['docker', 'podman', 'container']
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["hardening", "sshd", "common"]
