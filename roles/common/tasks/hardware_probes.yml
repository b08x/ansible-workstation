---
# ==============================================================================
# Hardware Capability Probes (GPU, CUDA, Vulkan via sysfs/CLI)
# ==============================================================================

- name: Probe GPU vendor via PCI sysfs
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        gpu="none"
        for d in /sys/bus/pci/devices/*; do
          if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
            v=$(cat "$d/vendor" 2>/dev/null)
            c=$(cat "$d/class" 2>/dev/null)
            if [ "${c#0x03}" != "$c" ]; then
              case "$v" in
                0x10de) gpu="nvidia"; break ;;
                0x1002) gpu="amd" ;;
                0x8086) [ "$gpu" != "nvidia" ] && gpu="intel" ;;
              esac
            fi
          fi
        done
        echo "$gpu"
  register: _common_gpu_vendor_stat
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["common", "hardware", "always"]

- name: Probe CUDA hardware acceleration support
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L 2>/dev/null | grep -q "^GPU "; then
          exit 0
        fi
        if [ -e /dev/nvidia0 ] || [ -e /dev/nvidiactl ]; then
          exit 0
        fi
        for d in /sys/bus/pci/devices/*; do
          if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
            v=$(cat "$d/vendor" 2>/dev/null)
            c=$(cat "$d/class" 2>/dev/null)
            if [ "$v" = "0x10de" ] && [ "${c#0x03}" != "$c" ]; then
              exit 0
            fi
          fi
        done
        exit 1
  register: _common_cuda_stat
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["common", "hardware", "always"]

- name: Probe Vulkan hardware acceleration support
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - |
        if command -v vulkaninfo >/dev/null 2>&1; then
          pattern="deviceType\s*=\s*PHYSICAL_DEVICE_TYPE_(DISCRETE_GPU|INTEGRATED_GPU|VIRTUAL_GPU)"
          if vulkaninfo --summary 2>/dev/null | grep -E "$pattern" >/dev/null 2>&1; then
            exit 0
          fi
        fi
        if ls /dev/dri/renderD* >/dev/null 2>&1; then
          for d in /sys/bus/pci/devices/*; do
            if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
              v=$(cat "$d/vendor" 2>/dev/null)
              c=$(cat "$d/class" 2>/dev/null)
              case "$v" in
                0x8086|0x1002|0x10de)
                  if [ "${c#0x03}" != "$c" ]; then
                    exit 0
                  fi
                  ;;
              esac
            fi
          done
        fi
        exit 1
  register: _common_vulkan_stat
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["common", "hardware", "always"]
