---
# tasks file for common role

- name: Starting common tasks
  ansible.builtin.debug:
    msg: "Starting common tasks"
  tags: ["common", "always"]

- name: Validate pre-flight assertions and platform support
  ansible.builtin.include_tasks: assert.yml
  when: common_assert_enabled | default(true) | bool
  tags: ["common", "assert", "always"]

- name: Execute hardware capability auto-detection
  ansible.builtin.include_tasks: hardware.yml
  when: common_hardware_detection_enabled | default(true) | bool
  tags: ["common", "hardware", "always"]

- name: Configure tuned daemon and active profile
  ansible.builtin.include_tasks: tuned.yml
  when: common_tuned_enabled | default(true) | bool
  tags: ["common", "tuned"]

- name: Apply CIS Level 2 Workstation security hardening
  ansible.builtin.include_tasks: hardening/main.yml
  when: common_hardening_enabled | default(true) | bool
  tags: ["common", "hardening"]

- name: Include distribution package variables
  ansible.builtin.include_vars:
    file: "{{ common_distro_vars }}"
  vars:
    common_distro_vfile: "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    common_distro_vars: >-
      {{ lookup('ansible.builtin.first_found',
                files=[common_distro_vfile, ansible_distribution ~ '.yml'],
                paths=role_path ~ '/vars') }}
  tags: ["common", "packages", "distro"]

- name: Install Common baseline packages
  tags: ["packages", "common"]
  block:
    - name: Install Common baseline packages
      ansible.builtin.dnf:
        name: "{{ common_packages }}"
        state: present
        allowerasing: true

  rescue:
    - name: Report common package installation failure
      ansible.builtin.debug:
        msg: >-
          Failed to install one or more packages from common_packages.
          Re-run with -vv to see which package and why; a missing package
          usually means a required repository was never enabled.

    - name: Fail the play on common package installation failure
      ansible.builtin.fail:
        msg: "Common package installation failed - see the preceding task output."

- name: Enable and Start ssh service
  ansible.builtin.systemd:
    name: sshd
    enabled: true
    state: started
  when: ansible_virtualization_type | default('') not in ['docker', 'podman', 'container']
  tags: ["common", "sshd"]

- name: Include inxi system information tasks
  ansible.builtin.include_tasks: inxi.yml
  when: common_install_inxi | default(true) | bool
  tags: ["inxi", "common"]

- name: Include gitflow installation tasks
  ansible.builtin.include_tasks: gitflow.yml
  when: common_install_gitflow | default(true) | bool
  tags: ["gitflow", "common"]

- name: Include Zsh installation verification
  ansible.builtin.include_tasks: zsh.yml
  tags: ["zsh", "common"]

- name: Include yadm installation tasks
  ansible.builtin.include_tasks: yadm.yml
  tags: ["yadm", "common"]

- name: Include firstboot onboarding tasks
  ansible.builtin.include_tasks: firstboot.yml
  when: common_firstboot_enabled | default(true) | bool
  tags: ["firstboot", "common"]

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: ["common", "always"]
