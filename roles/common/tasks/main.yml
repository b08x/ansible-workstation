---
# tasks file for common role

- name: Starting common tasks
  ansible.builtin.debug:
    msg: "Starting common tasks"
  tags: ["common", "always"]

- name: Validate pre-flight assertions and platform support
  ansible.builtin.include_tasks: assert.yml
  when: common_assert_enabled | default(true) | bool
  tags: ["common", "assert", "always"]

- name: Execute hardware capability auto-detection
  ansible.builtin.include_tasks: hardware.yml
  when: common_hardware_detection_enabled | default(true) | bool
  tags: ["common", "hardware", "always"]

- name: Configure centralized Syncopated COPR repository
  ansible.builtin.include_tasks: repos.yml
  when: common_syncopated_copr_enabled | default(true) | bool
  tags: ["common", "repos", "copr"]

- name: Install baseline packages and enable sshd
  ansible.builtin.include_tasks: packages.yml
  when: common_packages_enabled | default(true) | bool
  tags: ["common", "packages", "distro", "sshd"]

- name: Configure tuned daemon and active profile
  ansible.builtin.include_tasks: tuned.yml
  when: common_tuned_enabled | default(true) | bool
  tags: ["common", "tuned"]

- name: Apply CIS Level 2 Workstation security hardening
  ansible.builtin.include_tasks: hardening/main.yml
  when: common_hardening_enabled | default(true) | bool
  tags: ["common", "hardening"]

- name: Install baseline CLI tools
  ansible.builtin.include_tasks: tools.yml
  tags: ["common", "inxi", "gitflow", "zsh", "yadm"]

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: ["common", "always"]
