---
# tasks file for gitflow installation in roles/common
# Fedora and EL10+ ship gitflow through the centralized Syncopated COPR;
# EL9 builds gitflow-avh from source if needed.

- name: Install gitflow package from COPR
  ansible.builtin.dnf:
    name: gitflow
    state: present
  when: ansible_distribution == 'Fedora' or (ansible_distribution_major_version | int) >= 10
  tags: ["gitflow", "common"]

- name: Check if git-flow is installed
  ansible.builtin.command: which git-flow
  environment:
    PATH: "{{ user.home | default('/home/' ~ user.name) }}/.local/bin:/usr/local/bin:/usr/bin:/bin:{{ ansible_env.PATH | default('') }}"
  register: _common_gitflow_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["gitflow", "common"]

- name: Deploy gitflow-avh from source
  when:
    - ansible_distribution != 'Fedora'
    - (_common_gitflow_check.rc | default(1)) != 0 or (common_gitflow_force_install | default(false) | bool)
  tags: ["gitflow", "common"]
  block:
    - name: Ensure clean state for clone
      ansible.builtin.file:
        path: "{{ common_gitflow_build_dir }}"
        state: absent
      tags: ["gitflow", "common"]

    - name: Clone gitflow-avh repository
      ansible.builtin.git:
        repo: https://github.com/b08x/gitflow-avh.git
        dest: "{{ common_gitflow_build_dir }}"
        clone: true
        update: true
        version: develop
      become: false
      tags: ["gitflow", "common"]

    - name: Install git flow-avh
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ common_gitflow_build_dir }}"
        creates: /usr/local/bin/git-flow
      tags: ["gitflow", "common"]

    - name: Clean up gitflow-avh clone
      ansible.builtin.file:
        path: "{{ common_gitflow_build_dir }}"
        state: absent
      tags: ["gitflow", "common"]
