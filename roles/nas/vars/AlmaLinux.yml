---
# AlmaLinux 10 / RHEL-specific package names for NAS role

# NFS server packages
_nas_distro_packages_nfs:
  - nfs-utils
  - rpcbind

# Samba/SMB server packages
_nas_distro_packages_samba:
  - samba
  - samba-client
  - samba-common

# Rsync daemon packages
_nas_distro_packages_rsync:
  - rsync

# NFS service names (Rocky/RHEL uses nfs-server)
_nas_distro_service_nfs: nfs-server
_nas_distro_service_nfs_idmapd: nfs-idmapd
_nas_distro_service_rpcbind: rpcbind

# Samba service names
_nas_distro_service_samba: smb
_nas_distro_service_nmb: nmb
