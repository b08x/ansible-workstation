---
# NFS firewall configuration - Hybrid approach
# Uses firewalld services for standard ports AND explicit port rules for fixed daemons

- name: Enable NFS firewalld services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - nfs
    - mountd
    - rpc-bind
  notify: Reload firewalld
  tags: ["firewall", "nfs"]

- name: Open explicit fixed NFS daemon ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ nas_nfs_firewall.ports.lockd.tcp }}/tcp"
    - "{{ nas_nfs_firewall.ports.lockd.udp }}/udp"
    - "{{ nas_nfs_firewall.ports.mountd }}/tcp"
    - "{{ nas_nfs_firewall.ports.mountd }}/udp"
    - "{{ nas_nfs_firewall.ports.statd }}/tcp"
    - "{{ nas_nfs_firewall.ports.statd }}/udp"
  notify: Reload firewalld
  tags: ["firewall", "nfs", "nfs-lockd", "nfs-mountd", "nfs-statd"]

- name: Open RDMA port in firewalld (TCP)
  ansible.posix.firewalld:
    port: "{{ nas_nfs_firewall.ports.rdma }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  when: nas_nfs_firewall.ports.rdma is defined
  notify: Reload firewalld
  tags: ["firewall", "nfs", "nfs-rdma"]

- name: Open legacy custom NFS ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ nas_nfs_firewall_ports }}"
  when:
    - nas_nfs_firewall_ports is defined
    - nas_nfs_firewall_ports | length > 0
  notify: Reload firewalld
  tags: ["firewall", "nfs", "legacy"]
