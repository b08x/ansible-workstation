---
# Package installation for NAS role
# Supports: Fedora, AlmaLinux, Rocky Linux, RedHat (RedHat family only)

- name: Load distribution-specific variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  tags: ["nas", "nas_packages"]

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  tags: ["nas", "nas_packages"]

- name: Evaluate NAS package installation state
  ansible.builtin.set_fact:
    _nas_all_nfs_packages_installed: >-
      {{ (_nas_distro_packages_nfs | map('extract', ansible_facts.packages, []) | select() | list | length)
         == (_nas_distro_packages_nfs | length) }}
    _nas_all_samba_packages_installed: >-
      {{ (_nas_distro_packages_samba | map('extract', ansible_facts.packages, []) | select() | list | length)
         == (_nas_distro_packages_samba | length) }}
    _nas_all_rsync_packages_installed: >-
      {{ (_nas_distro_packages_rsync | map('extract', ansible_facts.packages, []) | select() | list | length)
         == (_nas_distro_packages_rsync | length) }}
  tags: ["nas", "nas_packages"]

- name: Display NAS package installation status
  ansible.builtin.debug:
    msg: >-
      NAS packages status — NFS({{ nas_enable_nfs | default(true) }}):
      {{ 'installed' if _nas_all_nfs_packages_installed else 'pending' }},
      Samba({{ nas_enable_samba | default(false) }}):
      {{ 'installed' if _nas_all_samba_packages_installed else 'pending' }},
      Rsync({{ nas_enable_rsync | default(false) }}):
      {{ 'installed' if _nas_all_rsync_packages_installed else 'pending' }}
  tags: ["nas", "nas_packages"]

- name: Install NFS server packages
  ansible.builtin.dnf:
    name: "{{ _nas_distro_packages_nfs }}"
    state: present
  when:
    - nas_enable_nfs | default(true) | bool
    - not _nas_all_nfs_packages_installed | default(false)
  tags: ["nas", "nas_packages"]

- name: Install Samba server packages
  ansible.builtin.dnf:
    name: "{{ _nas_distro_packages_samba }}"
    state: present
  when:
    - nas_enable_samba | default(false) | bool
    - not _nas_all_samba_packages_installed | default(false)
  tags: ["nas", "nas_packages"]

- name: Install Rsync daemon packages
  ansible.builtin.dnf:
    name: "{{ _nas_distro_packages_rsync }}"
    state: present
  when:
    - nas_enable_rsync | default(false) | bool
    - not _nas_all_rsync_packages_installed | default(false)
  tags: ["nas", "nas_packages"]
