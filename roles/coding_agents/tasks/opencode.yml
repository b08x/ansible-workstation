---
# OpenCode — npm install + config deployment (opencode.json with embedded MCP)

# -- Uninstall --
- name: Uninstall OpenCode
  when:
    - coding_agents_opencode_state == 'present'
    - coding_agents_uninstall | default(false) | bool
  tags: ["opencode", "uninstall"]
  block:
    - name: Check whether OpenCode CLI is installed
      ansible.builtin.command: "npm list -g --depth=0 {{ coding_agents_opencode_npm_package }}"
      register: coding_agents_opencode_npm_package_check
      changed_when: false
      failed_when: false

    - name: Uninstall OpenCode CLI
      ansible.builtin.command: "npm uninstall -g {{ coding_agents_opencode_npm_package }}"
      when: coding_agents_opencode_npm_package_check.rc == 0
      failed_when: false
      register: coding_agents_opencode_uninstall
      changed_when: >-
        coding_agents_opencode_uninstall.rc == 0 and
        ('removed' in (coding_agents_opencode_uninstall.stdout | default('') | lower))

    - name: Remove OpenCode config directory
      ansible.builtin.file:
        path: "{{ coding_agents_opencode_config_dir }}"
        state: absent

# -- Install --
- name: Install OpenCode
  when:
    - coding_agents_opencode_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["opencode", "install"]
  block:
    - name: Check whether OpenCode CLI is installed
      ansible.builtin.command: "npm list -g --depth=0 {{ coding_agents_opencode_npm_package }}"
      register: coding_agents_opencode_npm_package_check
      changed_when: false
      failed_when: false

    - name: Install OpenCode CLI
      ansible.builtin.command: "npm install -g {{ coding_agents_opencode_npm_package }}"
      when:
        - coding_agents_npm_check.rc == 0
        - coding_agents_opencode_npm_package_check.rc != 0
      changed_when: coding_agents_opencode_npm_package_check.rc != 0

    - name: OpenCode CLI not installed (npm missing)
      ansible.builtin.debug:
        msg: "WARNING: npm not found — cannot install OpenCode CLI. Install nodejs/npm via the base role."
      when: coding_agents_npm_check.rc != 0

# -- Config --
- name: Configure OpenCode
  when:
    - coding_agents_opencode_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["opencode", "config"]
  block:
    - name: Ensure OpenCode config directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_opencode_config_dir }}"
        state: directory
        mode: "0755"

    # - name: Deploy OpenCode config
    #   ansible.builtin.template:
    #     src: opencode/opencode.json.j2
    #     dest: "{{ coding_agents_opencode_config_dir }}/opencode.json"
    #     backup: true
    #     mode: "0644"
    #   tags: ["mcp"]

    - name: Ensure OpenCode agents directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_opencode_agents_dir }}"
        state: directory
        mode: "0755"
