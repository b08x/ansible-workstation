---
# Claude Code — npm install + config deployment

# -- Uninstall --
- name: Uninstall Claude Code
  when:
    - coding_agents_claude_state == 'present'
    - coding_agents_uninstall | default(false) | bool
  tags: ["claude", "uninstall"]
  block:
    - name: Check whether Claude Code CLI is installed
      ansible.builtin.command: "npm list -g --depth=0 {{ coding_agents_claude_npm_package }}"
      register: coding_agents_claude_npm_package_check
      changed_when: false
      failed_when: false

    - name: Uninstall Claude Code CLI
      ansible.builtin.command: "npm uninstall -g {{ coding_agents_claude_npm_package }}"
      when: coding_agents_claude_npm_package_check.rc == 0
      failed_when: false
      register: coding_agents_claude_uninstall
      changed_when: >-
        coding_agents_claude_uninstall.rc == 0 and
        ('removed' in (coding_agents_claude_uninstall.stdout | default('') | lower))

    - name: Remove Claude Code config directory
      ansible.builtin.file:
        path: "{{ coding_agents_claude_config_dir }}"
        state: absent

# -- Install --
- name: Install Claude Code
  when:
    - coding_agents_claude_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["claude", "install"]
  block:
    - name: Check whether Claude Code CLI is installed
      ansible.builtin.command: "npm list -g --depth=0 {{ coding_agents_claude_npm_package }}"
      register: coding_agents_claude_npm_package_check
      changed_when: false
      failed_when: false

    - name: Install Claude Code CLI
      ansible.builtin.command: "npm install -g {{ coding_agents_claude_npm_package }}"
      when:
        - coding_agents_npm_check.rc == 0
        - coding_agents_claude_npm_package_check.rc != 0
      changed_when: coding_agents_claude_npm_package_check.rc != 0

    - name: Claude Code CLI not installed (npm missing)
      ansible.builtin.debug:
        msg: "WARNING: npm not found — cannot install Claude Code CLI. Install nodejs/npm via the base role."
      when: coding_agents_npm_check.rc != 0

# -- Config --
- name: Configure Claude Code
  when:
    - coding_agents_claude_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["claude", "config"]
  block:
    - name: Ensure Claude Code config directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_claude_config_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Claude Code settings
      ansible.builtin.template:
        src: claude/settings.json.j2
        dest: "{{ coding_agents_claude_config_dir }}/settings.json"
        backup: true
        mode: "0644"

    - name: Deploy Claude Code MCP config
      ansible.builtin.template:
        src: claude/mcp.json.j2
        dest: "{{ coding_agents_claude_config_dir }}/.mcp.json"
        backup: true
        mode: "0644"
      tags: ["mcp"]

    - name: Ensure Claude Code agents directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_claude_agents_dir }}"
        state: directory
        mode: "0755"
