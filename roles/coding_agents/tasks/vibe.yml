---
# Vibe — uv install + config deployment (config.toml with embedded MCP)

# -- Uninstall --
- name: Uninstall Vibe
  when:
    - coding_agents_vibe_state == 'present'
    - coding_agents_uninstall | default(false) | bool
  tags: ["vibe", "uninstall"]
  block:
    - name: Check for uv
      ansible.builtin.command: which uv
      register: coding_agents_uv_check
      changed_when: false
      failed_when: false

    - name: Check whether Vibe CLI is installed
      ansible.builtin.command: "uv tool list"
      register: coding_agents_vibe_check
      changed_when: false
      failed_when: false
      when: coding_agents_uv_check.rc == 0

    - name: Uninstall Vibe CLI
      ansible.builtin.command: "uv tool uninstall mistral-vibe"
      when:
        - coding_agents_uv_check.rc == 0
        - coding_agents_vibe_check.stdout is defined
        - "'mistral-vibe' in coding_agents_vibe_check.stdout"
      failed_when: false
      register: coding_agents_vibe_uninstall
      changed_when: coding_agents_vibe_uninstall.rc == 0

    - name: Remove Vibe config directory
      ansible.builtin.file:
        path: "{{ coding_agents_vibe_config_dir }}"
        state: absent

# -- Install --
- name: Install Vibe
  when:
    - coding_agents_vibe_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["vibe", "install"]
  block:
    - name: Check for uv
      ansible.builtin.command: which uv
      register: coding_agents_uv_check
      changed_when: false
      failed_when: false

    - name: Check whether Vibe CLI is installed
      ansible.builtin.command: "uv tool list"
      register: coding_agents_vibe_check
      changed_when: false
      failed_when: false
      when: coding_agents_uv_check.rc == 0

    - name: Install Vibe CLI
      ansible.builtin.command: "uv tool install mistral-vibe"
      when:
        - coding_agents_uv_check.rc == 0
        - coding_agents_vibe_check.stdout is defined
        - "'mistral-vibe' not in coding_agents_vibe_check.stdout"
      changed_when: true

    - name: Vibe CLI not installed (uv missing)
      ansible.builtin.debug:
        msg: "WARNING: uv not found — cannot install Vibe CLI. Install uv via the base role."
      when: coding_agents_uv_check.rc != 0

# -- Config --
- name: Configure Vibe
  when:
    - coding_agents_vibe_state == 'present'
    - not (coding_agents_uninstall | default(false) | bool)
  tags: ["vibe", "config"]
  block:
    - name: Ensure Vibe config directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_vibe_config_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy Vibe config
      ansible.builtin.template:
        src: vibe/config.toml.j2
        dest: "{{ coding_agents_vibe_config_dir }}/config.toml"
        backup: true
        mode: "0644"
      tags: ["mcp"]

    - name: Ensure Vibe agents directory exists
      ansible.builtin.file:
        path: "{{ coding_agents_vibe_agents_dir }}"
        state: directory
        mode: "0755"
