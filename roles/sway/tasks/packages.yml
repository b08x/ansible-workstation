---
# tasks file for package installation in sway role

- name: Assemble initial sway package candidates
  ansible.builtin.set_fact:
    _sway_raw_packages: >-
      {{
        ((_sway_distro_packages | default({})).core | default([]))
        + (((_sway_distro_packages | default({})).companions | default([])) if (sway_install_companions | default(true) | bool) else [])
        + (((_sway_distro_packages | default({})).tools | default([])) if (sway_install_tools | default(true) | bool) else [])
        + (((_sway_distro_packages | default({})).greetd | default([])) if (sway_install_greetd | default(true) | bool) else [])
      }}
  tags: ["sway", "packages"]

- name: Resolve compositor and bar engine packages
  ansible.builtin.set_fact:
    _sway_install_packages: >-
      {{
        (
          (
            _sway_raw_packages
            | reject('equalto', 'sway' if (sway_compositor == 'swayfx' and ('swayfx' in _sway_raw_packages)) else '')
            | reject('equalto', '' if (sway_compositor == 'swayfx') else 'swayfx')
            | reject('equalto', 'waybar' if (sway_bar_engine == 'eww') else 'eww')
            | list
          )
          + (['sway'] if sway_compositor != 'swayfx' else [])
        ) | unique | list
      }}
  tags: ["sway", "packages"]

- name: Install Sway compositor and companion packages
  ansible.builtin.dnf:
    name: "{{ _sway_install_packages }}"
    state: "{{ 'latest' if (sway_force_install | default(false) | bool) else 'present' }}"
    allowerasing: true
    update_cache: true
  when: _sway_install_packages | length > 0
  tags: ["sway", "packages"]
