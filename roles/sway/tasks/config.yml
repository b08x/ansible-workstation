---
# tasks file for user configuration in sway role

- name: Include modular Sway configuration tasks
  ansible.builtin.include_tasks: config_sway.yml
  tags: ["sway", "config"]

- name: Include Eww widget configuration tasks
  ansible.builtin.include_tasks: config_eww.yml
  when: sway_bar_engine == 'eww'
  tags: ["sway", "config", "eww"]

- name: Include companion application theming tasks
  ansible.builtin.include_tasks: config_apps.yml
  tags: ["sway", "config", "apps"]

- name: Deploy WirePlumber volume helper script
  ansible.builtin.copy:
    src: scripts/volume-helper
    dest: "{{ sway_volume_helper_path }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  tags: ["sway", "config"]

- name: Deploy user WirePlumber volume bindings override
  ansible.builtin.template:
    src: 60-bindings-volume.conf.j2
    dest: "{{ user.home | default('/home/' ~ user.name) }}/.config/sway/config.d/60-bindings-volume.conf"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    backup: true
  notify: Reload sway
  tags: ["sway", "config"]
