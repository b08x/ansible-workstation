---
# Pre-flight assertions for sway role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the sway role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["sway", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The sway role only supports RedHat-family distributions (Fedora, AlmaLinux, Rocky).
      Current host is {{ ansible_distribution | default('Unknown') }}
      ({{ ansible_os_family | default('Unknown') }}).
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["sway", "assert", "always"]

- name: Assert package manager is DNF
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The sway role relies on DNF/DNF5 package management.
      Detected package manager: '{{ ansible_pkg_mgr | default('unknown') }}'.
    quiet: true
  tags: ["sway", "assert", "always"]

- name: Assert init system is systemd
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: >-
      The sway role requires systemd as the init system.
      Detected init system: '{{ ansible_service_mgr | default('unknown') }}'.
    quiet: true
  tags: ["sway", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _sway_effective_uid
  changed_when: false
  check_mode: false
  tags: ["sway", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _sway_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The sway role installs system packages and manages greetd services
      requiring root privileges. Ensure 'become: true' is enabled.
    quiet: true
  tags: ["sway", "assert", "always"]

- name: Assert workstation user identity is defined
  ansible.builtin.assert:
    that:
      - user is defined
      - user.name is defined
      - user.name | length > 0
      - user.home is defined
      - user.home | length > 0
    fail_msg: >-
      The sway role requires Tier 1 host variables 'user.name' and 'user.home' to deploy user configuration.
      Ensure 'user.name' and 'user.home' are configured in inventory, host_vars, or group_vars.
    quiet: true
  tags: ["sway", "assert", "always"]
