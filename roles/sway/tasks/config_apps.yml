---
# tasks file for companion applications and launcher theming in sway role

- name: Ensure companion application configuration directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  loop:
    - "{{ user.home | default('/home/' ~ user.name) }}/.config/foot"
    - "{{ user.home | default('/home/' ~ user.name) }}/.config/kitty"
    - "{{ user.home | default('/home/' ~ user.name) }}/.config/rofi"
  tags: ["sway", "config", "apps"]

- name: Deploy Foot terminal configuration
  ansible.builtin.copy:
    src: "theme/{{ sway_theme }}/terminals/foot.ini"
    dest: "{{ user.home | default('/home/' ~ user.name) }}/.config/foot/foot.ini"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    backup: true
  tags: ["sway", "config", "apps", "foot"]

- name: Deploy Kitty terminal configuration
  ansible.builtin.copy:
    src: "theme/{{ sway_theme }}/terminals/{{ item }}"
    dest: "{{ user.home | default('/home/' ~ user.name) }}/.config/kitty/{{ item }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    backup: true
  loop:
    - kitty.conf
    - colors.conf
  tags: ["sway", "config", "apps", "kitty"]

- name: Deploy Rofi launcher configuration
  ansible.builtin.copy:
    src: "theme/{{ sway_theme }}/rofi/{{ item }}"
    dest: "{{ user.home | default('/home/' ~ user.name) }}/.config/rofi/{{ item }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    backup: true
  loop:
    - config.rasi
    - colors.rasi
  tags: ["sway", "config", "apps", "rofi"]

- name: Ensure Waybar configuration directory exists
  ansible.builtin.file:
    path: "{{ user.home | default('/home/' ~ user.name) }}/.config/waybar"
    state: directory
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0755"
  when: sway_bar_engine == 'waybar'
  tags: ["sway", "config", "apps", "waybar"]

- name: Deploy Waybar configuration
  ansible.builtin.copy:
    src: "theme/{{ sway_theme }}/waybar/{{ item }}"
    dest: "{{ user.home | default('/home/' ~ user.name) }}/.config/waybar/{{ item }}"
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    backup: true
  loop:
    - config
    - style.css
  when: sway_bar_engine == 'waybar'
  tags: ["sway", "config", "apps", "waybar"]
