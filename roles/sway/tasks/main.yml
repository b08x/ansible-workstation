---
# tasks file for sway role (Task Dispatcher Pattern)

- name: Announce Sway role execution
  ansible.builtin.debug:
    msg: "Starting Sway window manager provisioning on {{ inventory_hostname }}"
  tags: ["sway", "always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: sway_assert_enabled | default(true) | bool
  tags: ["sway", "assert", "always"]

- name: Load distribution variables
  ansible.builtin.include_vars: "{{ _sway_distro_vars }}"
  vars:
    _sway_distro_vfile: "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    _sway_distro_vars: >-
      {{ lookup('ansible.builtin.first_found',
                files=[_sway_distro_vfile, ansible_distribution ~ '.yml', 'AlmaLinux.yml', 'Fedora.yml'],
                paths=role_path ~ '/vars',
                errors='ignore') }}
  when: _sway_distro_vars is defined and _sway_distro_vars | length > 0
  tags: ["sway", "always"]

- name: Install Sway compositor and companion packages
  ansible.builtin.include_tasks: packages.yml
  tags: ["sway", "packages"]

- name: Configure greetd display manager
  ansible.builtin.include_tasks: greetd.yml
  when: sway_install_greetd | default(true) | bool
  tags: ["sway", "greetd"]

- name: Configure session environment
  ansible.builtin.include_tasks: environment.yml
  when: sway_manage_environment | default(true) | bool
  tags: ["sway", "environment"]

- name: Configure user Sway compositor
  ansible.builtin.include_tasks: config.yml
  tags: ["sway", "config"]

- name: Flush pending Sway handlers
  ansible.builtin.meta: flush_handlers
  tags: ["sway", "always"]
