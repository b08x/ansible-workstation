---
# defaults file for sway role

# Pre-flight & enforcement flags
sway_assert_enabled: true
sway_force_install: false

# User Interface Preferences
sway_mod: "Mod4"
sway_terminal: "foot"
sway_menu: "rofi -show drun"
sway_font: "pango:monospace 10"

# Aphelion Systems Engineering Theme & Compositor Settings
sway_compositor: "{{ 'swayfx' if ansible_distribution == 'Fedora' else 'sway' }}"
sway_bar_engine: "waybar"
sway_theme: "aphelion"
sway_fx_blur: false
sway_fx_shadows: true
sway_fx_corner_radius: 10

# Component installation toggles
sway_install_companions: true
sway_install_tools: true
sway_install_greetd: true
sway_manage_display_manager: true
sway_manage_environment: true
sway_conflicting_display_managers:
  - gdm
  - cosmic-greeter
  - sddm
  - lightdm

# greetd configuration options
sway_greetd_command: "tuigreet --time --remember --remember-user-session --cmd sway"
sway_greetd_user: "greetd"
sway_greetd_vt: 1

# Environment settings
sway_environment_vars:
  XDG_CURRENT_DESKTOP: "sway"
  XDG_SESSION_TYPE: "wayland"
  XDG_SESSION_DESKTOP: "sway"
  MOZ_ENABLE_WAYLAND: "1"
  QT_QPA_PLATFORM: "wayland;xcb"
  SDL_VIDEODRIVER: "wayland"
  _JAVA_AWT_WM_NONREPARENTING: "1"

# Audio and volume management (WirePlumber / PipeWire)
sway_volume_step: 5
sway_volume_limit: "1.0"
sway_volume_helper_path: "{{ user.home | default('/home/' ~ user.name) }}/.local/bin/volume-helper"

# Custom config include paths and extra directives
sway_config_custom_includes: []
sway_extra_config: ""
