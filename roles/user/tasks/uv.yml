---
- name: Add UV_PYTHON_PREFERENCE to shell environments
  ansible.builtin.lineinfile:
    path: "{{ user.home | default('/home/' + user.name) }}/{{ item }}"
    line: 'export UV_PYTHON_PREFERENCE="only-managed"'
    regexp: "^export UV_PYTHON_PREFERENCE="
    owner: "{{ user.name }}"
    group: "{{ user.name }}"
    mode: "0644"
    create: true
    backup: true
  loop:
    - .bashrc
    - .zshrc
  become: false
  ignore_errors: "{{ ansible_check_mode }}"
  tags: ["uv", "base"]

