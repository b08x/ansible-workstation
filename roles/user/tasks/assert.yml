---
# Pre-flight assertions for user role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the user role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["user", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The user role only supports RedHat-family distributions
      (Fedora, AlmaLinux, Rocky Linux). Current host is
      {{ ansible_distribution | default('Unknown') }}
      ({{ ansible_os_family | default('Unknown') }}).
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["user", "assert", "always"]

- name: Assert workstation user identity is defined
  ansible.builtin.assert:
    that:
      - user is defined
      - user.name is defined
      - user.name | length > 0
    fail_msg: >-
      The user role requires Tier 1 host variable 'user.name' to manage user configurations.
      Ensure 'user.name' is set in inventory, host_vars, or group_vars.
    quiet: true
  tags: ["user", "assert", "always"]

- name: Assert workstation user home directory is valid
  ansible.builtin.assert:
    that:
      - user.home is not defined or (user.home is defined and user.home.startswith('/'))
    fail_msg: >-
      When defined, 'user.home' must be an absolute path starting with '/'.
      Current value: '{{ user.home | default('') }}'.
    quiet: true
  tags: ["user", "assert", "always"]

- name: Assert uv Python version format
  ansible.builtin.assert:
    that:
      - user_uv_python_version is defined
      - user_uv_python_version | string | length > 0
    fail_msg: >-
      'user_uv_python_version' must be specified (e.g. '3.12').
    quiet: true
  tags: ["user", "assert", "always"]
