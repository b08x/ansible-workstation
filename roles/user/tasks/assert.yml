---
# Pre-flight assertions for user role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: "Ansible facts must be gathered before executing the user role. Ensure 'gather_facts: true' is set."
    quiet: true
  tags: ["user", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The user role only supports RedHat-family distributions (Fedora, AlmaLinux, Rocky Linux).
      Current: {{ ansible_distribution | default('Unknown') }}.
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["user", "assert", "always"]

- name: Assert workstation user identity is defined
  ansible.builtin.assert:
    that:
      - user is defined
      - user.name is defined
      - user.name | length > 0
    fail_msg: "The user role requires Tier 1 host variable 'user.name' to manage user configurations."
    quiet: true
  tags: ["user", "assert", "always"]

- name: Assert workstation user home directory is valid
  ansible.builtin.assert:
    that:
      - user.home is not defined or (user.home is defined and user.home.startswith('/'))
    fail_msg: "When defined, 'user.home' must be an absolute path starting with '/'. Current value: '{{ user.home | default('') }}'."
    quiet: true
  tags: ["user", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _user_effective_uid
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ user.name }}"
  tags: ["user", "assert", "always"]

- name: Verify target host effective user name
  ansible.builtin.command: id -un
  register: _user_effective_user
  changed_when: false
  check_mode: false
  become: true
  become_user: "{{ user.name }}"
  tags: ["user", "assert", "always"]

- name: Assert role runs as the expected workstation user
  ansible.builtin.assert:
    that:
      - _user_effective_user.stdout | trim == user.name
      - user.uid is not defined or _user_effective_uid.stdout | trim | int == user.uid | int
    fail_msg: >-
      The user role must execute as the Tier 1 workstation user.
      Expected '{{ user.name }}' (uid: {{ user.uid | default('any') }}),
      running as '{{ _user_effective_user.stdout | trim }}' (uid: {{ _user_effective_uid.stdout | trim }}).
    quiet: true
  tags: ["user", "assert", "always"]

- name: Assert package manager is DNF family
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: "The user role reaches DNF/DNF5 package management (Go/cargo system fallbacks). Detected: '{{ ansible_pkg_mgr | default('unknown') }}'."
    quiet: true
  tags: ["user", "assert", "always"]

- name: Validate toolchain and extension manifests
  ansible.builtin.include_tasks:
    file: assert_manifests.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  tags: ["user", "assert", "always"]

- name: Validate firstboot suite contracts
  ansible.builtin.include_tasks:
    file: assert_firstboot.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  when: user_firstboot_enabled | default(false) | bool
  tags: ["user", "assert", "always"]
