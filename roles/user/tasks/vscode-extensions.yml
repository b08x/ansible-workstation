---
# tasks file for VS Code extension management in roles/user
# Migrated from yadm bootstrap.d/91-install-vscode-extensions.sh (behavior parity).

- name: Probe VS Code CLI availability
  ansible.builtin.include_tasks:
    file: vscode-extensions_probe.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  tags: ["vscode-extensions", "user"]

- name: Query installed VS Code extensions
  ansible.builtin.command:
    argv: "{{ _user_vscode_cli + ['--list-extensions'] }}"
  register: _user_vscode_list_raw
  changed_when: false
  failed_when: false
  check_mode: false
  when: _user_vscode_cli | default([]) | length > 0
  tags: ["vscode-extensions", "user"]

- name: Report extension query failure and skip installation
  ansible.builtin.debug:
    msg: >-
      Failed to query installed VS Code extensions via
      '{{ _user_vscode_cli | join(' ') }}' (rc {{ _user_vscode_list_raw.rc | default('n/a') }});
      skipping extension installation to avoid false positives.
  when:
    - _user_vscode_cli | default([]) | length > 0
    - (_user_vscode_list_raw.rc | default(1)) != 0
  tags: ["vscode-extensions", "user"]

- name: Normalize installed extension identifiers
  ansible.builtin.set_fact:
    _user_vscode_installed: "{{ _user_vscode_list_raw.stdout_lines | default([]) | map('lower') | select | list }}"
  when: (_user_vscode_list_raw.rc | default(1)) == 0
  tags: ["vscode-extensions", "user"]

- name: Resolve extensions requiring installation
  ansible.builtin.set_fact:
    _user_vscode_targets: >-
      {{ user_vscode_extensions | map('lower') | list
         if (user_vscode_force_install | default(false) | bool)
         else (user_vscode_extensions | map('lower') | list
               | difference(_user_vscode_installed | default([]))) }}
  when: (_user_vscode_list_raw.rc | default(1)) == 0
  tags: ["vscode-extensions", "user"]

- name: Report a fully converged extension set
  ansible.builtin.debug:
    msg: "All {{ user_vscode_extensions | length }} VS Code extensions are already installed."
  when:
    - (_user_vscode_list_raw.rc | default(1)) == 0
    - _user_vscode_targets | default([]) | length == 0
  tags: ["vscode-extensions", "user"]

- name: Install missing VS Code extensions
  ansible.builtin.include_tasks:
    file: vscode-extensions_install.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  when:
    - (_user_vscode_list_raw.rc | default(1)) == 0
    - _user_vscode_targets | default([]) | length > 0
  tags: ["vscode-extensions", "user"]

- name: Summarize VS Code extension installation
  ansible.builtin.debug:
    msg: >-
      VS Code extensions: attempted {{ _user_vscode_targets | default([]) | length }},
      failed {{ _user_vscode_install_results.results | default([])
      | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length }} (non-fatal).
  when: _user_vscode_targets is defined
  tags: ["vscode-extensions", "user"]
