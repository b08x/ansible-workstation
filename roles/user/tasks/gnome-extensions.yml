---
# tasks file for GNOME Shell user extension management in roles/user
# Migrated from yadm bootstrap.d/40-gnome-extensions.sh (behavior parity).

- name: Probe GNOME Shell and extension CLI availability
  ansible.builtin.include_tasks:
    file: gnome-extensions_probe.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  tags: ["gnome-extensions", "user"]

- name: Discover installed GNOME extensions
  ansible.builtin.include_tasks:
    file: gnome-extensions_discover.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  when: _user_gnome_available | default(false) | bool
  tags: ["gnome-extensions", "user"]

- name: Query GNOME extension metadata
  ansible.builtin.include_tasks:
    file: gnome-extensions_metadata.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  when: _user_gnome_available | default(false) | bool
  tags: ["gnome-extensions", "user"]

- name: Install missing GNOME extension bundles
  ansible.builtin.include_tasks:
    file: gnome-extensions_install.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  when: _user_gnome_available | default(false) | bool
  tags: ["gnome-extensions", "user"]

- name: Enable configured GNOME extensions
  ansible.builtin.include_tasks:
    file: gnome-extensions_enable.yml
    apply:
      become: true
      become_user: "{{ user.name }}"
  when: _user_gnome_available | default(false) | bool
  tags: ["gnome-extensions", "user"]
