---
# Rust/cargo toolchain + crates (roles/user), refactored from monolith.
# Decision tree: probe SYSTEM cargo at /usr/bin/cargo (never via PATH, rustup's ~/.cargo/bin would mask it);
# if cargo is absent, attempt DNF install; if still absent or version < user_cargo_min_system_version, use rustup.
# Strategy verdict uses discrete when-gated set_fact tasks (no ternary chains).
# user_cargo_force_install is a when-gate on the rustup-install block only.
# Rustup availability is verified post-install with a rescue-on-failure pattern.
# Contracts: rustup runs --no-modify-path; ~/.zshenv (Layer 2) sources ~/.cargo/env - this file NEVER writes shell rc files;
# ~/.cargo/config.toml is user-owned (Yadm) - never written; TMPDIR noexec probing falls back to ~/.cargo/tmp.
# DNF-preferred crates resolve via user_cargo_crate_dnf_map; per-crate failures non-fatal.

- name: Validate the cargo feature contract
  ansible.builtin.assert:
    that:
      - user.name is defined
      - user.name != 'root'
      - user.home is defined
      - user.home is match('^/')
      - user_cargo_min_system_version is defined
    fail_msg: >-
      Cargo feature requires Tier 1 identity contract (user.name, user.home) and
      user_cargo_min_system_version to be defined.
  tags: ["cargo", "user", "assert", "always"]

- name: Explain check-mode limitation
  ansible.builtin.debug:
    msg: >-
      Cargo bootstrap and executable probes are skipped in check mode.
      The cargo feature will report its current state but will not mutate.
  when: ansible_check_mode
  tags: ["cargo", "user"]

- name: Resolve cargo toolchain strategy
  ansible.builtin.import_tasks: cargo/strategy.yml
  when: not ansible_check_mode
  tags: ["cargo", "user"]

- name: Set decision note for system strategy
  ansible.builtin.set_fact:
    _user_cargo_decision_note: >-
      system cargo is current ({{ _user_cargo_system_semver | default('0.0.0') }} >= {{ user_cargo_min_system_version }});
      using it and skipping the rustup toolchain
  when: not ansible_check_mode and (_user_cargo_strategy | default('')) == 'system'
  tags: ["cargo", "user"]

- name: Set decision note for rustup strategy
  ansible.builtin.set_fact:
    _user_cargo_decision_note: >-
      {{ 'system cargo is absent' if (_user_cargo_system_final | default('') | length == 0) else
         'system cargo compares older than ' ~ user_cargo_min_system_version }};
      installing the rustup user toolchain
  when: not ansible_check_mode and (_user_cargo_strategy | default('')) == 'rustup'
  tags: ["cargo", "user"]

- name: Report the cargo toolchain decision
  ansible.builtin.debug:
    msg: >-
      Cargo toolchain decision: {{ _user_cargo_strategy | default('skipped') }} - system cargo:
      {{ _user_cargo_system_final | default('absent') | trim }},
      minimum {{ user_cargo_min_system_version }}.
      {{ _user_cargo_decision_note | default('') }}.
  when: not ansible_check_mode
  tags: ["cargo", "user"]

- name: Prepare executable temporary storage
  ansible.builtin.import_tasks: cargo/tmp.yml
  when: not ansible_check_mode
  tags: ["cargo", "user"]

- name: Prepare rustup when selected
  ansible.builtin.import_tasks: cargo/rustup.yml
  when: not ansible_check_mode and (_user_cargo_strategy | default('')) == 'rustup'
  tags: ["cargo", "user"]

- name: Install crates independently
  ansible.builtin.include_tasks: cargo/crate.yml
  loop: "{{ user_cargo_crates | default([]) }}"
  loop_control:
    loop_var: _user_cargo_crate
    label: "{{ _user_cargo_crate }}"
  when: not ansible_check_mode
  tags: ["cargo", "user"]
