---
# tasks file for b08x.devworkstation.user

- name: Display the value of user_my_variable
  ansible.builtin.debug:
    msg: "The value of user_my_variable is {{ user_my_variable }}"

- name: Starting user tasks
  ansible.builtin.debug:
    msg: "Starting user tasks"
  tags: ["user", "always"]

- name: Include distribution variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  tags: ["user", "distro"]

- name: Include cargo installation tasks
  ansible.builtin.include_tasks: cargo.yml
  when: user_install_cargo | default(true) | bool
  tags: ["cargo", "user"]

- name: Include pip configuration tasks
  ansible.builtin.include_tasks: pip.yml
  tags: ["pip", "user"]

- name: Include uv configuration tasks
  ansible.builtin.include_tasks: uv.yml
  tags: ["uv", "user"]

- name: Include Ranger installation tasks
  ansible.builtin.include_tasks: ranger.yml
  tags: ["ranger", "user"]

- name: Include rbenv configuration tasks
  ansible.builtin.include_tasks: rbenv.yml
  when: user_install_rbenv | default(true) | bool
  tags: ["rbenv", "ruby", "user"]
