---
# tasks file for b08x.devworkstation.user

- name: Display the value of user_my_variable
  ansible.builtin.debug:
    msg: "The value of user_my_variable is {{ user_my_variable }}"
  tags: ["user", "always"]

- name: Starting user tasks
  ansible.builtin.debug:
    msg: "Starting user tasks"
  tags: ["user", "always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: user_assert_enabled | default(true) | bool
  tags: ["user", "assert", "always"]

- name: Include distribution variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  tags: ["user", "distro"]

- name: Include uv configuration tasks
  ansible.builtin.include_tasks: uv.yml
  when: user_install_uv | default(true) | bool
  tags: ["uv", "user"]

- name: Include bun installation tasks
  ansible.builtin.include_tasks: bun.yml
  when: user_install_bun | default(true) | bool
  tags: ["bun", "user"]

- name: Include user-space Go toolchain installation tasks
  ansible.builtin.include_tasks: go.yml
  when: user_install_go | default(true) | bool
  tags: ["go", "user"]

- name: Include cargo and Rust crate installation tasks
  ansible.builtin.include_tasks: cargo.yml
  when: user_install_cargo | default(true) | bool
  tags: ["cargo", "user"]

- name: Include GNOME Shell extension installation tasks
  ansible.builtin.include_tasks: gnome-extensions.yml
  when: user_install_gnome_extensions | default(false) | bool
  tags: ["gnome-extensions", "user"]

- name: Include VS Code extension installation tasks
  ansible.builtin.include_tasks: vscode-extensions.yml
  when: user_install_vscode_extensions | default(true) | bool
  tags: ["vscode-extensions", "user"]
