---
# tasks file for b08x.devworkstation.user

- name: Display the value of user_my_variable
  ansible.builtin.debug:
    msg: "The value of user_my_variable is {{ user_my_variable }}"

- name: Starting user tasks
  ansible.builtin.debug:
    msg: "Starting user tasks"
  tags: ["user", "always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: user_assert_enabled | default(true) | bool
  tags: ["user", "assert", "always"]

- name: Include distribution variables
  ansible.builtin.include_vars: "{{ ansible_distribution }}.yml"
  tags: ["user", "distro"]

- name: Include uv configuration tasks
  ansible.builtin.include_tasks: uv.yml
  tags: ["uv", "user"]
