---
# argument spec file for b08x.devworkstation.user

argument_specs:
  main:
    short_description: User-space developer toolchains (bun, go, cargo) and extension management (GNOME, VS Code) for the workstation user.
    options:
      user_my_variable:
        type: str
        description: A simple string argument for demonstration.
        default: "default_value"
      user_assert_enabled:
        type: bool
        default: true
        description: Run pre-flight validation assertions to fail fast on invalid environments.
      user_uv_python_version:
        type: str
        description: Python version installed via uv (Tier 1 override lives in group_vars/all.yml).
        default: "3.12"
      user_install_uv:
        type: bool
        description: Install the uv-managed Python runtime into user space (the uv binary is expected on PATH).
        default: true
      user_install_bun:
        type: bool
        description: Install the Bun JS/TS runtime into user space (~/.bun/bin/bun).
        default: true
      user_bun_dest:
        type: str
        description: Destination path for the user-space bun binary.
        default: "{{ user.home | default('/home/' ~ user.name) }}/.bun/bin/bun"
      user_bun_url:
        type: str
        description: Download URL for the Bun release archive.
        default: "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip"
      user_bun_force_install:
        type: bool
        description: Force bun reinstallation even when the binary already exists.
        default: false
      user_install_go:
        type: bool
        description: Manage the Go toolchain (system-first; DNF fallback; user-space tarball when the system go is absent or older).
        default: true
      user_go_min_version:
        type: str
        description: Minimum acceptable Go compiler version for the effective go in PATH.
        default: "1.22"
      user_go_version:
        type: str
        description: Go version installed user-space when the system go is absent or older.
        default: "1.27.1"
      user_go_url:
        type: str
        description: Official Go binary tarball download URL (arch selected at use site).
        default: "https://go.dev/dl/go{{ user_go_version }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz"
      user_go_dest_dir:
        type: str
        description: User-space Go tree; go/gofmt are symlinked into ~/.local/bin.
        default: "{{ user.home | default('/home/' ~ user.name) }}/.local/go"
      user_go_force_install:
        type: bool
        description: Force reinstallation of the user-space Go toolchain even when present.
        default: false
      user_install_cargo:
        type: bool
        description: Manage the Rust/cargo toolchain (system-first with threshold; rustup fallback) and install crates.
        default: true
      user_cargo_force_install:
        type: bool
        description: Skip-if-present override forcing the rustup installer to run even when rustup is present.
        default: false
      user_cargo_force_crates:
        type: list
        elements: str
        description: Crates always attempted even when their binary or cargo entry is already present.
        default: []
      user_cargo_rustup_url:
        type: str
        description: rustup installer URL.
        default: "https://sh.rustup.rs"
      user_cargo_min_system_version:
        type: str
        description: >-
          Minimum acceptable SYSTEM cargo (/usr/bin/cargo) version; at or
          above it the system cargo is used and rustup is skipped. Fedora
          43/44 ship newer (skip), EL 10 ships Rust 1.79 (older, triggers
          rustup). Overridable per host/group.
        default: "1.80"
      user_cargo_crates:
        type: list
        elements: str
        description: Crate names to provision (seeded verbatim from yadm files/cargo-packages.txt).
        default:
          - bottom
          - choose
          - git-cliff
          - gping
          - ripgrep_all
          - sd
          - gitui
          - eza
          - weathr
          - dua-cli
      user_cargo_crate_bin_map:
        type: dict
        description: Crate name to installed command binary mapping (skip-if-present probes).
        default:
          bottom: btm
          ripgrep_all: rga
          dua-cli: dua
          du-dust: dust
      user_cargo_crate_dnf_map:
        type: dict
        description: Crate name to DNF package mapping (DNF-preferred install with cargo fallback).
        default:
          dua-cli: dua-cli
          gitui: gitui
          eza: eza
      user_install_gnome_extensions:
        type: bool
        description: >-
          Manage GNOME Shell user extensions. Lazily consumes the Tier 1
          enable_desktop host flag and verifies GNOME is the target DE; resolves to false when unset or non-GNOME.
        default: >-
          {{ (enable_desktop | default(false) | bool) and
             ((desktop_ui_environment | default(desktop_environment | default('gnome'))) == 'gnome') }}
      user_gnome_extensions:
        type: list
        elements: str
        description: Extension UUIDs to install from extensions.gnome.org (seeded verbatim from yadm files/gnome-extensions.txt).
        default:
          - notification-timeout@chlumskyvaclav.gmail.com
          - notification-configurator@exposedcat
          - junk-notification-cleaner@murar8.github.com
          - kando-integration@kando-menu.github.io
      user_gnome_extensions_force_install:
        type: bool
        description: Force reinstallation of every configured extension even when present.
        default: false
      user_gnome_extensions_base_url:
        type: str
        description: extensions.gnome.org base URL for extension metadata queries and bundle downloads.
        default: "https://extensions.gnome.org"
      user_install_vscode_extensions:
        type: bool
        description: Install VS Code extensions via the resolved CLI (native code or Flatpak).
        default: false
      user_vscode_command:
        type: str
        description: Optional VS Code CLI override, may contain argv; empty string auto-detects (code, then the Flatpak).
        default: ""
      user_vscode_force_install:
        type: bool
        description: Force reinstallation of every configured extension even when present.
        default: false
      user_vscode_extensions:
        type: list
        elements: str
        description: Marketplace extension identifiers to install (seeded verbatim from yadm files/vscode-extensions.txt).
        default:
          - ahmadawais.shades-of-purple
          - anseki.vscode-color
          - anthropic.claude-code
          - batisteo.vscode-django
          - beardedbear.beardedicons
          - bierner.markdown-mermaid
          - bulletproof-sh.ctrl
          - castwide.solargraph
          - catppuccin.catppuccin-vsc-icons
          - davidanson.vscode-markdownlint
          - donjayamanne.python-environment-manager
          - donjayamanne.python-extension-pack
          - dracula-theme.theme-dracula
          - dreamcatcher45.podmanager
          - eliverlara.sweet-vscode-icons
          - enkia.tokyo-night
          - file-icons.file-icons
          - github.github-vscode-theme
          - github.vscode-github-actions
          - google.google-antigravity
          - hangxingliu.vscode-systemd-support
          - johnpapa.winteriscoming
          - kameshkotwani.google-search
          - kevinrose.vsc-python-indent
          - kuscamara.yamllint-fix
          - magicstack.magicpython
          - mechatroner.rainbow-csv
          - miguelsolorio.fluent-icons
          - misogi.ruby-rubocop
          - mistralai.mistral-vibe-code
          - ms-azuretools.vscode-containers
          - ms-python.black-formatter
          - ms-python.debugpy
          - ms-python.flake8
          - ms-python.pylint
          - ms-python.python
          - ms-python.vscode-pylance
          - ms-python.vscode-python-envs
          - ms-toolsai.jupyter
          - ms-toolsai.jupyter-keymap
          - ms-toolsai.jupyter-renderers
          - ms-toolsai.vscode-jupyter-cell-tags
          - ms-toolsai.vscode-jupyter-slideshow
          - ms-vscode-remote.remote-containers
          - ms-vscode.makefile-tools
          - ms-vscode.vscode-chat-customizations-evaluations
          - naumovs.color-highlight
          - nefrob.vscode-just-syntax
          - njpwerner.autodocstring
          - onatm.open-in-new-window
          - onlyati.quadlet-lsp
          - openai.chatgpt
          - redhat.ansible
          - redhat.vscode-openshift-connector
          - redhat.vscode-redhat-account
          - redhat.vscode-yaml
          - sdras.night-owl
          - shakram02.bash-beautify
          - shopify.ruby-lsp
          - sst-dev.opencode
          - takkao.open-window-tab-context
          - tamasfe.even-better-toml
          - teabyii.ayu
          - tomoki1207.pdf
          - vsls-contrib.gistfs
          - wholroyd.jinja
          - yzane.markdown-pdf
          - zhuangtongfa.material-theme
      user_firstboot_enabled:
        type: bool
        description: >-
          Deploy the 7-file two-stage firstboot suite. Lazily consumes the
          Tier 1 inventory knob enable_firstboot (set it false on hosts that
          opt out); defaults to true.
        default: "{{ enable_firstboot | default(true) | bool }}"
      user_firstboot_files:
        type: list
        description: >-
          The 7 firstboot suite entries ({ src, dest, owner, group, mode });
          byte-identical mirror of the osbuild SSOT injection table.
        default: []
      user_firstboot_marker_path:
        type: str
        description: >-
          Machine pull-success marker path. This role is the single writer
          (full-tag pull runs only); stage 1 and the yadm ansible-pull step
          only test -f it. Phase-4 amendment: it lives in the primary
          workstation user's home (root:root 0644, world-readable), never
          /root — non-root users cannot stat /root (0550 root:root).
        default: "{{ user.home | default('/home/' ~ user.name) }}/.initial-firstboot"
      user_firstboot_marker_write:
        type: bool
        description: Escape hatch that leaves the machine marker untouched (e.g. dev hosts).
        default: true
      user_firstboot_marker_force:
        type: bool
        description: >-
          Skip-if-present override for the marker writer: rewrite the marker
          timestamp even when it exists. Partial-tag runs never write the
          marker regardless of this flag.
        default: false
      user_firstboot_marker_machine_tags:
        type: list
        elements: str
        description: >-
          Machine (system) tags that, together with the user tag, count a
          tag-selection pull as full convergence for the marker gate.
