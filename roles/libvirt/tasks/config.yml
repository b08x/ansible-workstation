---
# Configuration tasks for libvirt

- name: Configure libvirtd
  ansible.builtin.template:
    src: etc/libvirt/libvirtd.conf.j2
    dest: /etc/libvirt/libvirtd.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart libvirtd
  tags: ["libvirt", "config"]

- name: Configure QEMU bridge access
  ansible.builtin.copy:
    src: etc/qemu/bridge.conf
    dest: "{{ _libvirt_distro_bridge_conf_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  tags: ["libvirt", "config", "qemu"]

- name: Disable lvmetad for libvirt storage pools
  ansible.builtin.lineinfile:
    path: /etc/lvm/lvm.conf
    regexp: '^\s*use_lvmetad\s*='
    line: "    use_lvmetad = 0"
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: libvirt_configure_lvm | default(false) | bool
  tags: ["libvirt", "lvm"]

- name: Add specified users to the libvirt group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "libvirt"
    append: true
  loop: "{{ libvirt_users }}"
  when: libvirt_users | length > 0
  tags: ["libvirt", "users"]

- name: Add user to qemu group for KVM access
  ansible.builtin.user:
    name: "{{ user.name }}"
    groups: "{{ item }}"
    append: true
  loop:
    - libvirt
    - qemu
  tags: ["libvirt", "users"]
