---
- name: Check if iptables command is available
  ansible.builtin.command: which iptables
  register: libvirt_iptables_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ["kvm", "docker", "network", "libvirt"]

- name: Check if DOCKER-USER chain exists
  ansible.builtin.command: iptables -L DOCKER-USER -n
  register: libvirt_docker_user_chain
  changed_when: false
  failed_when: false
  check_mode: false
  when: (libvirt_iptables_check.rc | default(1)) == 0
  tags: ["kvm", "docker", "network", "libvirt"]

- name: Ensure libvirt inbound traffic is accepted in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    in_interface: virbr+
    jump: ACCEPT
    action: insert
    rule_num: 1
    state: present
  when:
    - (libvirt_iptables_check.rc | default(1)) == 0
    - (libvirt_docker_user_chain.rc | default(1)) == 0
  tags: ["kvm", "docker", "network", "libvirt"]

- name: Ensure libvirt outbound traffic is accepted in DOCKER-USER chain
  ansible.builtin.iptables:
    chain: DOCKER-USER
    out_interface: virbr+
    jump: ACCEPT
    action: insert
    rule_num: 1
    state: present
  when:
    - (libvirt_iptables_check.rc | default(1)) == 0
    - (libvirt_docker_user_chain.rc | default(1)) == 0
  tags: ["kvm", "docker", "network", "libvirt"]
