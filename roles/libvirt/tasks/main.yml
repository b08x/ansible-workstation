---
# tasks file for libvirt

- name: Starting libvirt tasks
  ansible.builtin.debug:
    msg: "Starting libvirt tasks"
  tags: ["libvirt", "always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: libvirt_assert_enabled | default(true) | bool
  tags: ["libvirt", "assert", "always"]

- name: Load OS-specific variables
  ansible.builtin.include_vars:
    file: "{{ ansible_distribution }}.yml"
  tags: ["libvirt", "always"]

- name: Install virtualization packages
  ansible.builtin.dnf:
    name: "{{ _libvirt_distro_packages }}"
    state: present
  tags: ["libvirt", "install"]

- name: Configure libvirt, QEMU bridge, LVM, and user groups
  ansible.builtin.include_tasks: config.yml
  tags: ["libvirt", "config", "qemu", "lvm", "users"]

- name: Ensure libvirt service is started and enabled
  ansible.builtin.systemd:
    name: "{{ libvirt_service }}"
    enabled: "{{ libvirt_service_enabled }}"
    state: started
  tags: ["libvirt", "service"]

- name: Resolve network conflicts between Libvirt and Docker
  ansible.builtin.include_tasks: network_conflicts.yml
  tags: ["kvm", "docker", "network", "libvirt"]
