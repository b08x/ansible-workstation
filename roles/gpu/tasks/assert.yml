---
# Pre-flight assertions for gpu role (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the gpu role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["gpu", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The gpu role only supports RedHat-family distributions
      (Fedora, AlmaLinux, Rocky Linux). Current host is
      {{ ansible_distribution | default('Unknown') }}
      ({{ ansible_os_family | default('Unknown') }}).
    success_msg: "Supported platform verified: {{ ansible_distribution }} {{ ansible_distribution_major_version | default('') }}"
    quiet: false
  tags: ["gpu", "assert", "always"]

- name: Assert supported package manager
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The gpu role requires the dnf or dnf5 package manager to install
      vendor repositories and driver packages. Current host reports
      '{{ ansible_pkg_mgr | default('Unknown') }}'.
    quiet: true
  tags: ["gpu", "assert", "always"]

- name: Assert supported init system
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: >-
      The gpu role manages systemd services (nvidia-cdi-refresh,
      nvidia-persistenced) and requires the systemd init manager. Current
      host reports '{{ ansible_service_mgr | default('Unknown') }}'.
    quiet: true
  tags: ["gpu", "assert", "always"]

- name: Verify effective user ID
  ansible.builtin.command: id -u
  register: _gpu_effective_uid
  changed_when: false
  check_mode: false
  tags: ["gpu", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _gpu_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The gpu role installs vendor repositories, kernel modules, and
      systemd services. Ensure 'become: true' is enabled.
    quiet: true
  tags: ["gpu", "assert", "always"]

- name: NVIDIA-specific assertions
  when: gpu_install_nvidia | default(false) | bool
  tags: ["gpu", "assert", "always"]
  block:
    - name: Assert NVIDIA CUDA is supported on this distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution ~ '-' ~ ansible_distribution_major_version in _gpu_nvidia_supported
        fail_msg: "gpu: NVIDIA CUDA is not supported on {{ ansible_distribution }} {{ ansible_distribution_major_version }}"
        quiet: false

    - name: Scan enabled repository sections for NVIDIA driver provider references
      ansible.builtin.shell: |
        set -o pipefail
        awk '
          FNR==1   { en=1 }
          /^[ \t]*\[/ { en=1 }
          /^[ \t]*enabled[ \t]*=/ { e=$0; sub(/^[^=]*=/,"",e); gsub(/[ \t]/,"",e); en=(e=="1") }
          /^[ \t]*(baseurl|mirrorlist)[ \t]*=/ { if(en){ v=$0; sub(/^[^=]*=/,"",v); print v } }
        ' /etc/yum.repos.d/*.repo 2>/dev/null
      args:
        executable: /bin/bash
      register: _gpu_provider_url_scan
      changed_when: false
      check_mode: false

    - name: Build candidate NVIDIA driver provider URL list
      ansible.builtin.set_fact:
        _gpu_provider_urls: >-
          {{
            (
              [
                'https://negativo17.org/repos/nvidia/'
                ~ (('fedora-' ~ ansible_distribution_major_version)
                   if ansible_distribution == 'Fedora'
                   else 'epel-' ~ ansible_distribution_major_version) ~ '/x86_64/',
                'https://negativo17.org/repos/multimedia/'
                ~ (('fedora-' ~ ansible_distribution_major_version)
                   if ansible_distribution == 'Fedora'
                   else 'epel-' ~ ansible_distribution_major_version) ~ '/x86_64/'
              ]
              + (_gpu_provider_url_scan.stdout_lines | default([]))
            ) | unique
          }}

    - name: Classify the candidate URLs by NVIDIA driver provider
      ansible.builtin.set_fact:
        _gpu_nvidia_providers: >-
          {%- set ns = namespace(found={}) -%}
          {%- for url in _gpu_provider_urls -%}
          {%-   set provider = none -%}
          {%-   if url is search('developer\.download\.nvidia\.com/compute/cuda') -%}
          {%-     set provider = 'cuda' -%}
          {%-   elif url is search('(?:fedora|epel)-nvidia-lts') -%}
          {%-     set provider = 'negativo17-lts' -%}
          {%-   elif url is search('negativo17\.org/.*(nvidia|multimedia)(?!-lts)') -%}
          {%-     set provider = 'negativo17' -%}
          {%-   elif url is search('rpmfusion\.org/nonfree/.*/nvidia-driver') -%}
          {%-     set provider = 'rpmfusion-nvidia' -%}
          {%-   endif -%}
          {%-   if provider -%}
          {%-     set ns.found = ns.found | combine({provider: ns.found.get(provider, []) + [url]}) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.found }}

    - name: Assert at most one NVIDIA driver provider is configured
      ansible.builtin.assert:
        that:
          - _gpu_nvidia_providers | length | int <= 1
        fail_msg: >-
          {{ _gpu_nvidia_providers | length }} NVIDIA driver providers are
          configured; at most one is allowed. The Negativo 17
          nvidia+multimedia pair counts as one provider.
          {% for provider, urls in _gpu_nvidia_providers.items() %}
          - {{ provider }}: {{ urls | join(', ') }}
          {% endfor %}
          Pick one provider and remove the other repository definitions.
        success_msg: >-
          {{ _gpu_nvidia_providers.keys() | list | join(', ')
             if _gpu_nvidia_providers else 'no' }}
          NVIDIA driver provider(s) configured
        quiet: false
      # Escape hatch (convention: presence checks always get one). Set
      # gpu_nvidia_provider_preflight: false for the single hard-break
      # migration run on a legacy stack host: the skip lets tasks/nvidia.yml
      # remove the legacy CUDA repo files and RPM Fusion driver packages,
      # after which the preflight passes clean on the next run.
      when: gpu_nvidia_provider_preflight | default(true) | bool

    - name: Probe GPU vendor via PCI sysfs (fallback when common was not run)
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - |
            gpu="none"
            for d in /sys/bus/pci/devices/*; do
              if [ -f "$d/vendor" ] && [ -f "$d/class" ]; then
                v=$(cat "$d/vendor" 2>/dev/null)
                c=$(cat "$d/class" 2>/dev/null)
                if [ "${c#0x03}" != "$c" ]; then
                  case "$v" in
                    0x10de) gpu="nvidia"; break ;;
                    0x1002) gpu="amd" ;;
                    0x8086) [ "$gpu" != "nvidia" ] && gpu="intel" ;;
                  esac
                fi
              fi
            done
            echo "$gpu"
      register: _gpu_vendor_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when: detected_gpu_vendor is not defined

    - name: Resolve GPU vendor for NVIDIA gating
      ansible.builtin.set_fact:
        _gpu_vendor: "{{ detected_gpu_vendor | default(_gpu_vendor_probe.stdout | default('none') | trim) }}"

    - name: Evaluate NVIDIA hardware presence
      ansible.builtin.set_fact:
        _gpu_nvidia_active: "{{ _gpu_vendor == 'nvidia' }}"

    - name: Warn and skip NVIDIA tasks on non-NVIDIA hardware
      ansible.builtin.debug:
        msg: >-
          gpu: NVIDIA CUDA install is enabled, but the detected GPU vendor
          is '{{ _gpu_vendor }}'. Skipping NVIDIA driver tasks; the play
          continues normally.
      when: not (_gpu_nvidia_active | bool)

    - name: Check Secure Boot state
      ansible.builtin.command: mokutil --sb-state
      register: _gpu_secure_boot_state
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Warn about Secure Boot MOK enrollment
      ansible.builtin.debug:
        msg: >-
          gpu: Secure Boot is enabled on this host. The NVIDIA kernel module
          must be signed and enrolled into the Machine Owner Key (MOK) list
          manually (mokutil --import at the next reboot). The role cannot
          automate this step, and the driver will not load until it is done.
      when: >-
        (_gpu_secure_boot_state.rc | default(1)) == 0 and
        'SecureBoot enabled' in _gpu_secure_boot_state.stdout | default('')
