---
# tasks file for Intel graphics drivers and oneAPI toolkit in roles/gpu
# Moved from roles/tools/tasks/intel.yml with identical behavior.

- name: Install Intel Graphics Drivers
  when: gpu_install_intel_graphics | default(false) | bool
  tags: ["intel", "gpu"]
  block:
    - name: Install Intel Graphics Drivers packages
      ansible.builtin.dnf:
        name: "{{ gpu_intel_graphics_packages }}"
        state: present

  rescue:
    - name: Report Intel Graphics Drivers failure
      ansible.builtin.debug:
        msg: >-
          WARNING: failed to install the Intel graphics driver packages.
          Expected on non-Intel hardware; otherwise check repository availability.

    - name: Fail the play when Intel Graphics Drivers are required
      ansible.builtin.fail:
        msg: "Intel graphics driver installation failed and gpu_intel_graphics_required is true."
      when: gpu_intel_graphics_required | default(false) | bool

- name: Include Intel oneAPI toolkit tasks
  ansible.builtin.include_tasks: intel_oneapi.yml
  when: gpu_install_intel_oneapi | default(false) | bool
  tags: ["intel_oneapi", "intel", "gpu"]
