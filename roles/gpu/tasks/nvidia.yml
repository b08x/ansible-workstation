---
# tasks file for the NVIDIA driver, CUDA toolkit, and container toolkit
# in roles/gpu. Drivers and CUDA come from the Negativo 17 repository
# (the osbuild nvidia component payload); the repo definitions and the
# priority/exclusion override drop-in are owned by the repositories
# playbook (playbooks/tasks/repositories/negativo17.yml). RPM Fusion
# repositories remain ensured for non-driver content and cannot win
# driver/CUDA conflicts because the override drop-in excludes those
# packages there. Legacy installs of the old stack (official NVIDIA CUDA
# repo + RPM Fusion driver set) are migrated in one safe break below.

- name: Apply NVIDIA driver, CUDA toolkit, and container toolkit
  when: >-
    (gpu_install_nvidia | default(false) | bool) and
    (_gpu_nvidia_active | default(true) | bool)
  tags: ["gpu", "nvidia"]
  block:
    - name: Ensure RPM Fusion Free repository is installed (Fedora)
      ansible.builtin.dnf:
        name: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      when:
        - gpu_nvidia_ensure_rpmfusion | default(true) | bool
        - ansible_distribution == 'Fedora'

    - name: Ensure RPM Fusion Non-Free repository is installed (Fedora)
      ansible.builtin.dnf:
        name: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      when:
        - gpu_nvidia_ensure_rpmfusion | default(true) | bool
        - ansible_distribution == 'Fedora'

    - name: Ensure RPM Fusion repositories are installed (Enterprise Linux)
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-{{ ansible_distribution_major_version }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-{{ ansible_distribution_major_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true
      when:
        - gpu_nvidia_ensure_rpmfusion | default(true) | bool
        - ansible_os_family == 'RedHat'
        - ansible_distribution != 'Fedora'

    # --- Hard-break legacy migration ---------------------------------------
    # The old stack (official NVIDIA CUDA repository + RPM Fusion driver set)
    # is removed in one safe break, gated on presence so fresh hosts stay
    # idempotent and the role never mutates a clean install.
    - name: Detect legacy official NVIDIA CUDA repository files
      ansible.builtin.command:
        argv:
          - sh
          - -c
          - >
            grep -l 'developer\.download\.nvidia\.com/compute/cuda'
            /etc/yum.repos.d/*.repo 2>/dev/null || true
      register: _gpu_legacy_cuda_repos
      changed_when: false
      check_mode: false

    - name: Remove legacy official NVIDIA CUDA repository files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ _gpu_legacy_cuda_repos.stdout_lines | default([]) }}"
      when: (_gpu_legacy_cuda_repos.stdout_lines | default([])) | length > 0
      register: _gpu_legacy_cuda_repo_removal

    - name: Detect legacy RPM Fusion NVIDIA driver packages
      ansible.builtin.command:
        argv:
          - rpm
          - -qa
          - xorg-x11-drv-nvidia*
          - nvidia-kmod-common
          - cuda-drivers
      register: _gpu_legacy_rpmfusion_driver
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remove legacy RPM Fusion NVIDIA driver packages
      ansible.builtin.command:
        cmd: dnf -y remove 'xorg-x11-drv-nvidia*'
      register: _gpu_legacy_driver_removal
      changed_when: true
      when: (_gpu_legacy_rpmfusion_driver.stdout_lines | default([])) | length > 0

    - name: Distro-sync after legacy driver removal
      ansible.builtin.command:
        cmd: dnf -q -y distro-sync
      register: _gpu_legacy_distro_sync
      changed_when: _gpu_legacy_driver_removal is changed
      when: >-
        (_gpu_legacy_driver_removal is changed) or
        (_gpu_legacy_cuda_repo_removal is changed)

    # --- Negativo 17 payload -----------------------------------------------
    - name: Configure NVIDIA container toolkit repository
      when: gpu_nvidia_container_toolkit | default(true) | bool
      tags: ["nvidia-container-toolkit"]
      block:
        - name: Import NVIDIA container toolkit repository GPG key
          ansible.builtin.rpm_key:
            state: present
            key: "{{ gpu_nvidia_container_repo_gpgkey }}"

        - name: Add NVIDIA container toolkit repository
          ansible.builtin.yum_repository:
            name: nvidia-container-toolkit
            description: "NVIDIA Container Toolkit repository (libnvidia-container)"
            baseurl: "{{ gpu_nvidia_container_repo_baseurl }}"
            enabled: true
            gpgcheck: true
            gpgkey: "{{ gpu_nvidia_container_repo_gpgkey }}"

    - name: Install Negativo 17 NVIDIA driver and CUDA packages
      ansible.builtin.dnf:
        name: >-
          {{ gpu_nvidia_negativo17_packages
             if (gpu_nvidia_cuda_toolkit | default(true) | bool)
             else gpu_nvidia_negativo17_packages | difference(['cuda', 'cuda-devel']) }}
        state: "{{ 'latest' if (gpu_nvidia_force_install | default(false) | bool) else 'present' }}"
        allowerasing: true

    - name: Create CUDA environment profile script
      ansible.builtin.copy:
        dest: /etc/profile.d/cuda.sh
        content: |
          #!/bin/bash
          # NVIDIA CUDA toolkit environment initialization
          if [ -d /usr/local/cuda/bin ]; then
              export PATH=/usr/local/cuda/bin${PATH:+:${PATH}}
          fi
          if [ -d /usr/local/cuda/lib64 ]; then
              export LD_LIBRARY_PATH=/usr/local/cuda/lib64${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}
          fi
        mode: "0755"
        owner: root
        group: root
        backup: true
      when: gpu_nvidia_cuda_toolkit | default(true) | bool

    - name: Install NVIDIA container toolkit
      ansible.builtin.dnf:
        name: nvidia-container-toolkit
        state: present
      when: gpu_nvidia_container_toolkit | default(true) | bool

    - name: Install NVIDIA utilities
      ansible.builtin.dnf:
        name: "{{ gpu_nvidia_utils_packages }}"
        state: present
      when: gpu_nvidia_utils | default(true) | bool

    - name: Configure NVIDIA CDI generation for containers
      when: gpu_nvidia_container_toolkit | default(true) | bool
      tags: ["nvidia-container-toolkit"]
      block:
        - name: Install NVIDIA CDI generation script
          ansible.builtin.copy:
            src: nvidia-cdi-generate.sh
            dest: /usr/local/bin/nvidia-cdi-generate.sh
            owner: root
            group: root
            mode: "0755"
            backup: true

        - name: Install NVIDIA CDI refresh service unit
          ansible.builtin.copy:
            src: nvidia-cdi-refresh.service
            dest: /etc/systemd/system/nvidia-cdi-refresh.service
            owner: root
            group: root
            mode: "0644"
            backup: true

        - name: Enable NVIDIA CDI refresh service
          ansible.builtin.systemd:
            name: nvidia-cdi-refresh
            enabled: true
            daemon_reload: true
          # Intentionally left stopped: the oneshot service runs at boot and
          # needs the NVIDIA module loaded to generate the CDI specification.

    - name: Enable NVIDIA power management services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
      loop: "{{ gpu_nvidia_power_services }}"
      when: gpu_nvidia_power_management | default(true) | bool

    - name: Enable NVIDIA persistence daemon
      ansible.builtin.systemd:
        name: nvidia-persistenced
        enabled: true
      when: gpu_nvidia_persistenced | default(false) | bool

    - name: Read current kernel command-line arguments
      ansible.builtin.command: grubby --info=ALL
      register: _gpu_grubby_info
      changed_when: false
      check_mode: false

    - name: Collect per-kernel argument tokens
      ansible.builtin.set_fact:
        _gpu_kernel_arg_sets: >-
          {{ _gpu_grubby_info.stdout_lines
             | select('match', '^args="(.*)"$')
             | map('regex_replace', '^args="(.*)"$', '\1')
             | map('split')
             | list }}

    - name: Determine missing NVIDIA kernel arguments
      ansible.builtin.set_fact:
        _gpu_missing_kernel_args: "{{ _gpu_missing_kernel_args | default([]) + [item] }}"
      loop: "{{ gpu_nvidia_kernel_args }}"
      when: >-
        (_gpu_kernel_arg_sets | map('intersect', [item]) | map('length') | sum)
        < (_gpu_kernel_arg_sets | length)

    - name: Apply missing NVIDIA kernel arguments
      ansible.builtin.command:
        argv:
          - grubby
          - --update-kernel=ALL
          - --args={{ _gpu_missing_kernel_args | join(' ') }}
      register: _gpu_grubby_update
      when: (_gpu_missing_kernel_args | default([]) | length) > 0
      changed_when: (_gpu_missing_kernel_args | default([]) | length) > 0
      notify:
        - gpu rebuild initramfs
        - gpu flag reboot required

    - name: Blacklist nouveau kernel module
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-nouveau.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          blacklist nouveau
          options nouveau modeset=0
      notify:
        - gpu rebuild initramfs
        - gpu flag reboot required
