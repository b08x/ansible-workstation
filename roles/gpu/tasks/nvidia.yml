---
# tasks file for the NVIDIA driver, CUDA toolkit, and container toolkit
# in roles/gpu. Drivers and CUDA come from the Negativo 17 repository.

- name: Apply NVIDIA driver, CUDA toolkit, and container toolkit
  when: >-
    (gpu_install_nvidia | default(false) | bool) and
    (_gpu_nvidia_active | default(true) | bool)
  tags: ["gpu", "nvidia"]
  block:
    - name: Configure NVIDIA and RPM Fusion repositories
      ansible.builtin.include_tasks: nvidia_repos.yml
      tags: ["gpu", "nvidia", "nvidia-container-toolkit"]

    - name: Migrate legacy NVIDIA CUDA and RPM Fusion driver installations
      ansible.builtin.include_tasks: nvidia_legacy.yml

    - name: Install NVIDIA drivers, CUDA toolkit, and CDI configuration
      ansible.builtin.include_tasks: nvidia_packages.yml
      tags: ["gpu", "nvidia", "nvidia-container-toolkit"]

    - name: Configure NVIDIA services, kernel arguments, and nouveau blacklist
      ansible.builtin.include_tasks: nvidia_kernel.yml
