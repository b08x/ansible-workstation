---
# tasks file for gpu role
# Dispatches host GPU compute stacks: Intel oneAPI/graphics and NVIDIA CUDA.
# Both stacks are off by default (Tier 1 intel_oneapi_install /
# nvidia_cuda_install host flags); with neither enabled the role performs
# no changes.

- name: Starting gpu tasks
  ansible.builtin.debug:
    msg: "Starting gpu tasks"
  tags: ["gpu", "always"]

- name: Pre-flight role assertions (Fail-Fast Pattern)
  ansible.builtin.include_tasks: assert.yml
  when: gpu_assert_enabled | default(true) | bool
  tags: ["gpu", "assert", "always"]

- name: Include distribution variables
  ansible.builtin.include_vars:
    file: "{{ gpu_distro_vars }}"
  vars:
    gpu_distro_vfile: "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    gpu_distro_vars: >-
      {{ lookup('ansible.builtin.first_found',
                files=[gpu_distro_vfile],
                paths=role_path ~ '/vars') }}
  when: gpu_install_nvidia | default(false) | bool
  tags: ["gpu", "nvidia", "distro"]

- name: Include Intel graphics and oneAPI tasks
  ansible.builtin.include_tasks: intel.yml
  when: >-
    (gpu_install_intel_oneapi | default(false) | bool) or
    (gpu_install_intel_graphics | default(false) | bool)
  tags: ["gpu", "intel", "intel_oneapi"]

- name: Include NVIDIA CUDA tasks
  ansible.builtin.include_tasks: nvidia.yml
  when: gpu_install_nvidia | default(false) | bool
  tags: ["gpu", "nvidia"]

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: ["gpu", "always"]
