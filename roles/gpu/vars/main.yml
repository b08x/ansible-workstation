---
# Internal data for the gpu role (not meant for user override).
# Distribution-specific values (the nvidia-persistenced service default)
# live in vars/<Distro>-<major>.yml and are loaded by tasks/main.yml via a
# first_found lookup. The Negativo 17 repository endpoints themselves are
# owned exclusively by the repositories task file
# (playbooks/tasks/repositories/negativo17.yml), per the one-owner rule.

# Distro-major combinations the NVIDIA CUDA stack supports
_gpu_nvidia_supported:
  - Fedora-43
  - Fedora-44
  - Rocky-9
  - Rocky-10
  - AlmaLinux-9
  - AlmaLinux-10

# NVIDIA container toolkit (libnvidia-container) repository — identical across
# supported distros (matches the osbuild nvidia component's repository table).
_gpu_nvidia_container_repo_baseurl: https://nvidia.github.io/libnvidia-container/stable/rpm/x86_64/
_gpu_nvidia_container_repo_gpgkey: https://nvidia.github.io/libnvidia-container/gpgkey
