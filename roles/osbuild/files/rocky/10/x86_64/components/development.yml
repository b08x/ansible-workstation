---
# Blueprint component "development" for Rocky Linux 10 (x86_64).
# Split from workstation/rocky-10-2-workstation-nvidia.toml; every name
# was verified against live repodata there (2026-10-01). Entries starting
# with @ are comps groups. Versions are never pinned here; use
# osbuild_package_pins.
label: "Compilers, language toolchains and -devel packages"
repo_urls: []
services: []
kernel_args: []
packages:
  - "@development"
  - "@rpm-development-tools"
  - "btrfs-progs-devel"
  - "cargo"
  - "chromium-headless"
  - "gcc"
  - "gcc-c++"
  - "golang"
  - "lm_sensors-devel"
  - "postgresql-server"
  - "postgresql-contrib"
  - "pgvector"
  - "ruby-devel"
