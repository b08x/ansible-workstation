---
# Pre-flight assertions for roles/gnome (Fail-Fast Pattern)

- name: Assert Ansible facts are gathered
  ansible.builtin.assert:
    that:
      - ansible_os_family is defined
      - ansible_distribution is defined
    fail_msg: >-
      Ansible facts must be gathered before executing the gnome role.
      Ensure 'gather_facts: true' is set or execute 'ansible.builtin.setup'.
    quiet: true
  tags: ["gnome", "assert", "always"]

- name: Assert supported OS family and distribution
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution in ['Fedora', 'AlmaLinux', 'Rocky', 'RedHat', 'CentOS']
    fail_msg: >-
      The gnome role only supports RedHat-family distributions.
      Current host is {{ ansible_distribution | default('Unknown') }}.
    quiet: false
  tags: ["gnome", "assert", "always"]

- name: Assert package manager is DNF
  ansible.builtin.assert:
    that:
      - ansible_pkg_mgr in ['dnf', 'dnf5']
    fail_msg: >-
      The gnome role relies on DNF/DNF5 package management.
      Detected package manager: '{{ ansible_pkg_mgr | default('unknown') }}'.
    quiet: true
  tags: ["gnome", "assert", "always"]

- name: Assert init system is systemd
  ansible.builtin.assert:
    that:
      - ansible_service_mgr == 'systemd'
    fail_msg: "The gnome role requires systemd (detected '{{ ansible_service_mgr | default('unknown') }}')."
    quiet: true
  tags: ["gnome", "assert", "always"]

- name: Verify target host effective user ID
  ansible.builtin.command: id -u
  register: _gnome_effective_uid
  changed_when: false
  check_mode: false
  tags: ["gnome", "assert", "always"]

- name: Assert effective root privileges
  ansible.builtin.assert:
    that:
      - _gnome_effective_uid.stdout | trim == '0'
    fail_msg: >-
      The gnome role requires root privileges.
      Effective UID is {{ _gnome_effective_uid.stdout | trim }}.
    quiet: true
  tags: ["gnome", "assert", "always"]

- name: Assert user.name is defined when enabling GNOME extensions
  ansible.builtin.assert:
    that:
      - user is defined
      - user.name is defined
      - user.name | length > 0
    fail_msg: "user.name must be defined when gnome_extensions_enable is true."
    quiet: true
  when: gnome_extensions_enable | default(false) | bool
  tags: ["gnome", "assert", "always"]
