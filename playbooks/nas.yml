---
- name: Configure Networked Storage
  hosts: all
  become: true
  gather_facts: true
  vars:
    path:
      - "{{ lookup('env','HOME') }}/.local/bin"
    user:
      name: b08x
      home: /home/b08x
  environment:
    PATH: "{{ ansible_env.PATH }}:/sbin:/bin:{{ path|join(':') }}"

  roles:
    - { role: nas, tags: ["nas"] }
