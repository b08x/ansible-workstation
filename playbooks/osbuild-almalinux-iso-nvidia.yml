# SPDX-License-Identifier: MIT-0
---
# Build the AlmaLinux 10.3 workstation ISO installer (NVIDIA variant) on tinybot.
#
# Uses the static, pre-verified NVIDIA blueprint at
# roles/osbuild/files/almalinux/10/x86_64/workstation/almalinux-10-3-workstation-nvidia.toml
# rather than the dynamic Jinja2 template — that blueprint's package list was
# checked package-by-package against live AlmaLinux 10 / EPEL 10 / RPM Fusion
# EL 10 repodata and intentionally excludes sway (no EPEL 10 build).
#
# The NVIDIA blueprint carries its own [[customizations.repositories]] entries
# for the CUDA EL10 repo and NVIDIA Container Toolkit repo; the extra-repo
# URLs below ensure image-builder can resolve those repos during the build.
#
# tinybot is itself AlmaLinux 10, so it builds its own distro's installer.

- name: Build AlmaLinux 10.3 workstation ISO installer (NVIDIA)
  hosts: tinybot
  become: true
  gather_facts: false
  vars:
    # image-builder 52.1 (installed on tinybot) only ships distro definitions
    # up to almalinux-10.2 — `image-builder list` has no almalinux-10.3 entry
    # yet, so 10.2 is what's actually buildable today. The blueprint file/name
    # stays "10-3" as the target OS label; only the --distro value differs.
    osbuild_distro: "almalinux-10.2"
    osbuild_arch: "x86_64"

    osbuild_blueprint_name: "almalinux-10-3-workstation-nvidia"
    osbuild_blueprint_version: "1.0.0"
    osbuild_blueprint_description: "AlmaLinux Workstation 10.3 (NVIDIA)"

    # Static blueprint, not the Jinja2 template — the file already has its
    # full package list, NVIDIA packages, kernel args, CDI service, and
    # repository entries baked in.
    osbuild_use_blueprint_template: false
    osbuild_static_blueprint_path: "files/almalinux/10/x86_64/workstation/almalinux-10-3-workstation-nvidia.toml"

    # Build mode: traditional ISO, not bootc, not generate-only.
    # "minimal-installer" is Fedora-only in image-builder; AlmaLinux only
    # exposes image-installer/network-installer (confirmed via
    # `image-builder list | grep almalinux-10.2` on tinybot).
    osbuild_build_bootc: false
    osbuild_only_generate: false
    osbuild_image_type: image-installer

    # Components only drive --extra-repo sources and gpgkey fetching here
    # (the static blueprint already carries its own packages); anaconda is
    # required for an installer ISO.
    osbuild_components:
      - base
      - anaconda

    osbuild_output_dir: "/var/tmp/osbuild-images"
    osbuild_output_filename: "almalinux-10-3-workstation-nvidia.iso"

    osbuild_build_retries: 1

    # Extra-repo URLs for the NVIDIA stack. These mirror the
    # [[customizations.repositories]] entries in the blueprint and ensure
    # image-builder can resolve the CUDA EL10 and NVIDIA Container Toolkit
    # repos during the build, even if the blueprint's internal repo definitions
    # are not fully processed by the compose pipeline.
    #
    # CUDA EL10: https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64
    #   GPG key:  https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64/CDF6BA43.pub
    # NVIDIA Container Toolkit: https://nvidia.github.io/libnvidia-container/stable/rpm/x86_64
    #   GPG key: https://nvidia.github.io/libnvidia-container/gpgkey
    osbuild_extra_repo_urls:
      - "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64"
      - "https://nvidia.github.io/libnvidia-container/stable/rpm/x86_64"

  pre_tasks:
    - name: Gather facts as unprivileged connection user
      ansible.builtin.setup:
      become: false
      tags: ["always"]

    - name: Verify build host is AlmaLinux
      ansible.builtin.assert:
        that:
          - ansible_distribution == "AlmaLinux"
          - ansible_distribution_major_version == "10"
        fail_msg: >-
          This playbook builds the AlmaLinux 10.3 NVIDIA blueprint and must run on an
          AlmaLinux 10 host. Detected: {{ ansible_distribution }}
          {{ ansible_distribution_version }}.
        success_msg: "Target distribution '{{ ansible_distribution }} {{ ansible_distribution_version }}' is supported."

  roles:
    - role: osbuild
