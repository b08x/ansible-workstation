---
# ============================================================================
# DNF Performance Optimization
# Configures max_parallel_downloads, minrate, timeout in dnf.conf (DNF4)
# and libdnf5 drop-in (DNF5); fastestmirror=False unconditionally in DNF4
# ============================================================================

- name: Configure DNF performance settings
  tags: ["dnf", "mirrors", "repos", "repositories"]
  block:
    - name: Ensure dnf-plugins-core is installed
      ansible.builtin.dnf:
        name: dnf-plugins-core
        state: present

    - name: Build DNF performance settings list
      ansible.builtin.set_fact:
        _dnf_performance_settings:
          - option: max_parallel_downloads
            value: "{{ dnf_max_parallel_downloads | default(10) | string }}"
          - option: fastestmirror
            value: "False"
          - option: minrate
            value: "{{ dnf_minrate | default('100k') | string }}"
          - option: timeout
            value: "{{ dnf_timeout | default(10) | string }}"

    - name: Configure DNF4 performance settings in dnf.conf
      community.general.ini_file:
        path: "{{ dnf_conf_path | default('/etc/dnf/dnf.conf') }}"
        section: main
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        mode: "0644"
        backup: true
      loop: "{{ _dnf_performance_settings }}"
      when: ansible_pkg_mgr != 'dnf5'
      register: _dnf_conf_changed

    - name: Configure DNF5 performance drop-in
      community.general.ini_file:
        path: "{{ dnf_dnf5_conf_path | default('/etc/dnf/libdnf5.conf.d/10-speed.conf') }}"
        section: main
        option: "{{ item.option }}"
        value: "{{ item.value }}"
        no_extra_spaces: true
        mode: "0644"
        backup: true
      loop: >-
        {{
          _dnf_performance_settings | rejectattr('option', 'equalto', 'fastestmirror') | list
        }}
      when: ansible_pkg_mgr == 'dnf5'
      register: _dnf5_dropin_changed

    # noqa: no-handler
    - name: Force refresh DNF metadata cache
      ansible.builtin.command:
        cmd: dnf makecache
      changed_when: true
      when: >-
        (_dnf_conf_changed is changed) or
        (_dnf5_dropin_changed is changed)
