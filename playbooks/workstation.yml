---
- name: Distribution Repositories and System Update
  ansible.builtin.import_playbook: repositories.yml

- name: System Provisioning and Common Configuration
  hosts: workstations
  become: true
  # Facts are gathered as root so that virtualization and other privileged
  # facts are complete. Tasks that need the connection user use ansible_user
  # or user.home, not ansible_user_id or ansible_user_dir.
  gather_facts: true
  pre_tasks:
    # to allow for ansible pipelining functionality
    # https://docs.ansible.com/ansible/2.4/intro_configuration.html#pipelining
    # while this requirement was removed in RHEL, many other distros leave this option enabled
    - name: Disable requiretty for user so automation can run without interruption
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: "^Defaults    requiretty"
        line: "Defaults:{{ ansible_user }}    !requiretty"
        backrefs: false
        backup: false
        validate: "visudo -cf %s"
      when: ansible_user != 'root'
      tags: ["sudoers"]

    - name: Display ansible_distribution
      ansible.builtin.debug:
        msg: |
          The host {{ inventory_hostname }} has {{ ansible_distribution }} installed,
          which belongs to the {{ ansible_os_family }} OS family. Connected as {{ ansible_user }}
      tags: ["always"]

    - name: Symlink /etc/os-release to /etc/system-release
      ansible.builtin.file:
        src: /etc/os-release
        dest: /etc/system-release
        state: link

    - name: Assert valid Tier 1 desktop_environment value
      ansible.builtin.assert:
        that:
          - (desktop_environment | default('none')) in ['none', 'gnome', 'cosmic', 'sway']
        fail_msg: >-
          Invalid desktop_environment '{{ desktop_environment | default('') }}'.
          Allowed values: none, gnome, cosmic, sway.
        quiet: true
      tags: ["always", "assert", "desktop"]
  roles:
    - role: common
      tags: ["common", "system"]

- name: System Configuration
  hosts: workstations
  become: true
  gather_facts: false
  pre_tasks:
    - name: Gather facts as unprivileged connection user
      ansible.builtin.setup:
      become: false
      tags: ["always"]
  roles:
    - role: tuning
      tags: ["tuning", "system"]
    - role: gpu
      tags: ["gpu", "system"]
    - role: networking
      tags: ["networking", "system"]
    - role: containerd
      tags: ["containerd", "virt"]
    - role: theme
      when: (desktop_environment | default('none')) != 'none'
      tags: ["theme", "desktop", "system"]
    - role: gnome
      when: (desktop_environment | default('none')) == 'gnome'
      tags: ["gnome", "desktop", "system"]
    - role: cosmic
      when: (desktop_environment | default('none')) == 'cosmic'
      tags: ["cosmic", "desktop", "system"]
    - role: sway
      when: (desktop_environment | default('none')) == 'sway'
      tags: ["sway", "desktop", "system"]
    - role: libvirt
      tags: ["libvirt", "virt"]

- name: Host Tools
  hosts: workstations
  become: true
  gather_facts: false
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: ["always"]
  roles:
    - role: tools
      tags: ["tools", "system"]

# Play ordering note: Host Tools runs BEFORE User Workstation Setup,
# mirroring local.yml (tools in the system play, user provisioning last),
# so user-space toolchains in roles/user can build against whichever
# system packages tools/common just installed.
- name: User Workstation Setup
  hosts: workstations
  become: true
  become_user: "{{ user.name }}"
  gather_facts: false
  vars:
    path:
      - "{{ user.home | default('/home/' ~ user.name) }}/.local/bin"
      - "{{ user.home | default('/home/' ~ user.name) }}/.cargo/bin"
      - "{{ user.home | default('/home/' ~ user.name) }}/go/bin"
  environment:
    PATH: "{{ path | join(':') }}:{{ ansible_env.PATH | default('') }}:/sbin:/bin"
  pre_tasks:
    - name: Gather facts as workstation user
      ansible.builtin.setup:
      become: true
      become_user: "{{ user.name }}"
      tags: ["always", "user", "assert"]
  roles:
    - role: user
      tags: ["user", "system"]

- name: Post-flight Execution Assessment and Reboot Verification
  hosts: workstations
  become: true
  gather_facts: false
  tasks:
    - name: Post-flight reboot assessment
      check_mode: false
      tags: ["always"]
      block:
        - name: Check for pending reboot on RedHat/Fedora family
          ansible.builtin.command: needs-restarting -r
          register: _reboot_check_rhel
          changed_when: false
          failed_when: false
          when: ansible_os_family | default('RedHat') == 'RedHat'

        - name: Check for pending reboot flag
          ansible.builtin.stat:
            path: /var/run/reboot-required
          register: _reboot_check_flag

        - name: Evaluate pending reboot status
          ansible.builtin.set_fact:
            system_reboot_required: >-
              {{
                (_reboot_check_rhel.rc is defined and _reboot_check_rhel.rc == 1)
                or (_reboot_check_flag.stat.exists is defined and _reboot_check_flag.stat.exists | bool)
              }}

        - name: Display reboot notice if required
          ansible.builtin.debug:
            msg: >-
              NOTICE: A system reboot is recommended for {{ inventory_hostname }} to apply kernel or audit configuration updates.
          when: system_reboot_required | default(false) | bool

        - name: Prompt before system reboot
          ansible.builtin.pause:
            prompt: "Reboot is recommended for {{ inventory_hostname }}. Press Enter to reboot, or Ctrl+C then 'C' to continue without rebooting."
            minutes: 1
          register: _reboot_prompt
          when:
            - system_reboot_required | default(false) | bool
            - workstation_prompt_reboot | default(false) | bool

        - name: Reboot system if confirmed
          ansible.builtin.reboot:
            msg: "Rebooting system to apply updates (Syncopated Workstation)"
            reboot_timeout: 300
          when:
            - system_reboot_required | default(false) | bool
            - workstation_prompt_reboot | default(false) | bool
