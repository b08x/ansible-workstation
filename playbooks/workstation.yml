---
- name: System Provisioning and Base Configuration
  hosts: workstations
  become: true
  # Facts are gathered as root so that virtualization and other privileged
  # facts are complete. Tasks that need the connection user use ansible_user
  # or user.home, not ansible_user_id or ansible_user_dir.
  gather_facts: true
  pre_tasks:
    # to allow for ansible pipelining functionality
    # https://docs.ansible.com/ansible/2.4/intro_configuration.html#pipelining
    # while this requirement was removed in RHEL, many other distros leave this option enabled
    - name: Disable requiretty for user so automation can run without interruption
      ansible.builtin.lineinfile:
        dest: /etc/sudoers
        regexp: "^Defaults    requiretty"
        line: "Defaults:{{ ansible_user }}    !requiretty"
        backrefs: false
        backup: false
        validate: "visudo -cf %s"
      when: ansible_user != 'root'
      tags: ["sudoers"]

    - name: Display ansible_distribution
      ansible.builtin.debug:
        msg: |
          The host {{ inventory_hostname }} has {{ ansible_distribution }} installed,
          which belongs to the {{ ansible_os_family }} OS family. Connected as {{ ansible_user }}
      tags: ["always"]

    - name: Symlink /etc/os-release to /etc/system-release
      ansible.builtin.file:
        src: /etc/os-release
        dest: /etc/system-release
        state: link
  roles:
    - role: base
      tags: ["base", "system"]

- name: System Configuration
  hosts: workstations
  become: true
  gather_facts: false
  pre_tasks:
    - name: Gather facts as unprivileged connection user
      ansible.builtin.setup:
      become: false
      tags: ["always"]
  roles:
    - role: tuning
      tags: ["tuning", "system"]
    - role: networking
      tags: ["networking", "system"]
    - role: containerd
      tags: ["containerd", "virt"]
    - role: desktop
      tags: ["desktop", "system"]
    - role: libvirt
      tags: ["libvirt", "virt"]

- name: User Workstation Setup
  hosts: workstations
  become: false
  gather_facts: false
  vars:
    path:
      - "{{ ansible_user }}/.local/bin"
      - "{{ ansible_user }}/.cargo/bin"
      - "{{ ansible_user }}/go/bin"
  environment:
    PATH: "{{ path | join(':') }}:{{ ansible_env.PATH }}:/sbin:/bin"
  pre_tasks:
    - name: Gather facts as unprivileged connection user
      ansible.builtin.setup:
      tags: ["always"]
  roles:
    - role: user
      tags: ["user", "system"]

- name: Host Tools and Coding Agent Utilities
  hosts: workstations
  become: true
  gather_facts: false
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: ["always"]
  roles:
    - role: tools
      tags: ["tools", "system"]
