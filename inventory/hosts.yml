---
all:
  vars:
    ansible_user: "{{ lookup('env', 'USER') }}"
    ansible_connection: ssh
  children:
    workstations:
      children:
        dev:
        builder:
        virt:
        langfuse:
    server:
      children:
        headless:
    # Image-build targets for playbooks/osbuild.yml. Children of builder rather
    # than a second host list, so membership cannot drift from it and gir's
    # local-connection setting stays defined in one place.
    osbuild_targets:
      children:
        builder:
    dev:
      hosts:
        gir:
          ansible_connection: local
          ansible_host: 192.168.41.10
        tinybot:
          ansible_host: 192.168.41.11
        soundbot:
          ansible_host: 192.168.41.13
    builder:
      hosts:
        tinybot:
        gir:
    headless:
      hosts:
        ninjabot:
    langfuse:
      hosts:
        tinybot:
    dify:
      hosts:
        ninjabot:
    virt:
      hosts:
        almalinux-test.syncopated.dev:
          ansible_host: 192.168.121.149
          ansible_user: vagrant
          ansible_ssh_private_key_file: ~/.vagrant.d/insecure_private_key
