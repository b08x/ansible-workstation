---
all:
  vars:
    ansible_user: b08x
    ansible_connection: ssh
  children:
    workstations:
      children:
        dev:
        builder:

    server:
      children:
        nas:
        dns:

    # Image-build targets for playbooks/osbuild.yml. Children of builder rather
    # than a second host list, so membership cannot drift from it and gir's
    # local-connection setting stays defined in one place.
    osbuild_targets:
      children:
        builder:

    dev:
      hosts:
        gir:
          ansible_connection: local
          ansible_host: 192.168.41.10
        tinybot:
          ansible_host: 192.168.41.11
        soundbot:
          ansible_host: 192.168.41.29
        studio-cosmic:
          ansible_host: 192.168.41.23
        gir-sway:
          ansible_host: 192.168.41.58

    builder:
      hosts:
        tinybot:
        gir:

    nas:
      hosts:
        bender:
          ansible_host: 192.168.41.14
    
    dns:
      hosts:
        steve:
          ansible_host: 192.168.41.2
          raspi_version: 4
