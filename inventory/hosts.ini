[all:vars]
ansible_user="{{lookup('env', 'USER')}}"
ansible_connection=ssh

[workstations:children]
dev
builder
virt

[server:children]
headless

# Image-build targets for playbooks/osbuild.yml. Children of builder rather
# than a second host list, so membership cannot drift from it and gir's
# local-connection setting stays defined in one place.
[osbuild_targets:children]
builder

[dev]
gir ansible_connection=local
tinybot
soundbot

[builder]
tinybot
gir ansible_connection=local

[headless]
ninjabot

[virt]
almalinux-test.syncopated.dev ansible_host=192.168.121.149 ansible_user=vagrant ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key