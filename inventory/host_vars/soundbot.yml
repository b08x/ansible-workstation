---
tuning_cpupower_governor: powersave
tuning_cpupower_min_freq: "400MHz"
tuning_cpupower_max_freq: "3800MHz"
tuning_irqbalance_enabled: false

nas_nfs_exports:
  - path: "{{ user.home }}/Archive"
    create_dir: true
    is_root: false
  - path: "{{ user.home }}/Workspace"
    create_dir: false
    is_root: false
