sway_bar_engine: "eww"
# Theme name applied across Sway, terminals, Rofi, Waybar, and Eww
# sway_theme: "aphelion"
# Enable SwayFX background blur effect
# sway_fx_blur: false
# Enable SwayFX drop shadows on windows and UI components
