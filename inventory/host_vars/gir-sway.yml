# ==============================================================================
# Tier 2 — Role: containerd (13 variables)
# ==============================================================================

# Enable pre-flight environment, platform, and privilege assertions
# containerd_assert_enabled: true
# Container runtime engine to install; choices: podman | docker | none
# containerd_engine: "podman"
# List of Podman packages installed when containerd_engine is 'podman'
# containerd_podman_packages:
#   - podman
#   - podman-compose
#   - podman-docker
# Optional specific Docker CE version string to pin (e.g. "27.3.1")
# containerd_docker_version: ""
# Core Docker packages installed when containerd_engine is 'docker'
# containerd_docker_packages:
