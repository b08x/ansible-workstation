# Install and configure the input-remapper service
# tools_install_input_remapper: "{{ tools_install_gui_apps | default(false) | bool }}"

# ==============================================================================
# Tier 2 — Role: tts (1 variable)
# ==============================================================================

# Enable pre-flight environment, platform, and privilege assertions
# tts_assert_enabled: true

# ==============================================================================
# Tier 2 — Role: user (35 variables)
# ==============================================================================

# Enable pre-flight environment, platform, and privilege assertions
# user_assert_enabled: true
# Python version installed via uv (group_vars/all.yml overrides to "3.14")
# user_uv_python_version: "3.12"
# Install uv-managed Python runtime into user space
# user_install_uv: true
# Install the Bun JS/TS runtime into user space (~/.bun/bin/bun)
# user_install_bun: true
# Destination path for the user-space bun binary
# user_bun_dest: "{{ user.home | default('/home/' ~ user.name) }}/.bun/bin/bun"
# Download URL for the Bun release archive
# user_bun_url: "https://github.com/oven-sh/bun/releases/latest/download/bun-linux-x64.zip"
# Force bun reinstallation even when the binary already exists
# user_bun_force_install: false
# Manage Go toolchain (system-first, DNF fallback, then user-space tarball)
# user_install_go: true
# Minimum acceptable Go compiler version for the effective go in PATH
# user_go_min_version: "1.22"
# Go version installed user-space when system go is absent or older
# user_go_version: "1.27.1"
# Official Go binary tarball download URL
# user_go_url: "https://go.dev/dl/go{{ user_go_version }}.linux-{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}.tar.gz"
# User-space Go installation tree (go/gofmt symlinked into ~/.local/bin)
# user_go_dest_dir: "{{ user.home | default('/home/' ~ user.name) }}/.local/go"
# Force reinstallation of user-space Go toolchain even when present
# user_go_force_install: false
# Manage Rust/cargo toolchain and install configured crates
# user_install_cargo: true
# Force rustup installer to run even when rustup is already present
# user_cargo_force_install: false
# Crates always attempted even when their binary or cargo entry exists
# user_cargo_force_crates: []
# rustup installer URL
# user_cargo_rustup_url: "https://sh.rustup.rs"
# Minimum acceptable system cargo version before falling back to rustup
# user_cargo_min_system_version: "1.99.1"
# Cargo crate names to provision
# user_cargo_crates:
#   - bottom
#   - choose
#   - git-cliff
#   - gping
#   - ripgrep_all
#   - sd
#   - gitui
#   - eza
#   - weathr
#   - dua-cli
# Crate name to installed command binary mapping (skip-if-present probes)
# user_cargo_crate_bin_map:
#   bottom: btm
#   ripgrep_all: rga
#   dua-cli: dua
#   du-dust: dust
# Crate name to DNF package mapping (DNF-preferred install with cargo fallback)
# user_cargo_crate_dnf_map:
#   dua-cli: dua-cli
#   gitui: gitui
#   eza: eza
# Manage GNOME Shell user extensions (derived from desktop_environment == 'gnome')
# user_install_gnome_extensions: "{{ (desktop_environment | default('none')) == 'gnome' }}"
# Force reinstallation of every configured GNOME extension
# user_gnome_extensions_force_install: false
# extensions.gnome.org base URL for metadata queries and bundle downloads
# user_gnome_extensions_base_url: "https://extensions.gnome.org"
# GNOME Shell extension UUIDs to install from extensions.gnome.org
# user_gnome_extensions:
#   - notification-timeout@chlumskyvaclav.gmail.com
#   - notification-configurator@exposedcat
#   - junk-notification-cleaner@murar8.github.com
#   - kando-integration@kando-menu.github.io
# Install VS Code extensions via resolved CLI (native code or Flatpak)
# user_install_vscode_extensions: false
# Optional VS Code CLI override (empty auto-detects code, then Flatpak)
# user_vscode_command: ""
# Force reinstallation of every configured VS Code extension
# user_vscode_force_install: false
# Marketplace extension identifiers to install (see roles/user/defaults/main.yml for full 68-item list)
# user_vscode_extensions:
#   - anthropic.claude-code
#   - google.google-antigravity
#   - redhat.ansible
#   - redhat.vscode-yaml
# Deploy the 7-file two-stage firstboot suite
# user_firstboot_enabled: true
# Firstboot suite file entries ({ src, dest, owner, group, mode }; see roles/user/defaults/main.yml)
# user_firstboot_files:
#   - src: syncopated-firstboot
#     dest: /usr/local/bin/syncopated-firstboot
#     owner: root
#     group: root
#     mode: "0755"
# Machine pull-success marker path (written only on full-tag convergence)
# user_firstboot_marker_path: "{{ user.home | default('/home/' ~ user.name) }}/.initial-firstboot"
# Escape hatch to leave the machine marker untouched (e.g. dev hosts)
# user_firstboot_marker_write: true
# Rewrite the marker timestamp even when it already exists
# user_firstboot_marker_force: false
# Machine tags that, with the user tag, count as full convergence for marker gate
# user_firstboot_marker_machine_tags:
#   - system
#   - repos
#   - common
#   - tuning
#   - networking
#   - gpu
#   - containerd
#   - libvirt
#   - theme
#   - gnome
#   - cosmic
