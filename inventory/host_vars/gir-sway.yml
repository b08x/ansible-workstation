---
# Host variables reference for Syncopated Workstation (Tier 1 & Tier 2).
# Usage: cp inventory/host_vars/example.yml.example inventory/host_vars/<hostname>.yml
# Uncomment only the variables you want to override for a specific host.

# ==============================================================================
# Tier 1 — Host & Global Workstation SSOT
# ==============================================================================
# Defined globally in inventory/group_vars/all.yml; override per host as needed.

# Primary workstation user account (SSOT consumed across roles)
user:
  name: b08x
  group: b08x
  uid: 1000
  gid: 1000
  home: /home/b08x
  shell: /usr/bin/zsh
  secondary_groups: "wheel,input,video,audio,render"
  realname: Robert Pannick
  sudoers: true
  email: rwpannick@gmail.com

# Target desktop environment; choices: none | gnome | cosmic | sway
desktop_environment: sway

# Enable third-party package repositories (RPM Fusion, COPR, etc.)
enable_third_party_repos: true

# Ordered PATH directories for workstation user shell profile
workstation_path_dirs:
  - "{{ ansible_user_dir }}/.local/bin"
  - "{{ ansible_user_dir }}/.cargo/bin"
  - "{{ ansible_user_dir }}/go/bin"
  - "{{ ansible_user_dir }}/.bun/bin"
  - "/usr/local/bin"
  - "/usr/bin"
  - "/bin"

# Prompt for reboot when kernel/system changes require a restart
workstation_prompt_reboot: true

# Optional local.yml pre-flight overrides (auto-detected when unset)
# pull_enable_libvirt: false
# pull_enable_desktop: false
# pull_enable_containerd: true

# ==============================================================================
# Tier 2 — Role: common (31 variables)
# ==============================================================================

# Enable pre-flight environment, platform, and privilege assertions
# common_assert_enabled: true
# Enable baseline system and interactive package installation
# common_packages_enabled: true
# Enable centralized Syncopated COPR repository on Fedora and EL10+
# common_syncopated_copr_enabled: true
# Centralized Syncopated COPR repository slug
# common_syncopated_copr: "b08x/syncopated"
# Enable hardware capability auto-detection (chassis, CPU, GPU, CUDA, Vulkan)
# common_hardware_detection_enabled: true
# Enable tuned daemon service and active profile enforcement
# common_tuned_enabled: true
# Active tuned profile name (defaults to hardware-recommended profile)
# common_tuned_profile: "{{ recommended_tuned_profile | default('throughput-performance') }}"
# Enable CIS Level 2 Workstation security hardening tasks
# common_hardening_enabled: true
# Enable auditd bounded rotation and syscall filtering
# common_hardening_auditd_enabled: true
# Enable SSH daemon security hardening
# common_hardening_sshd_enabled: true
# Enable system crypto policy enforcement
# common_hardening_crypto_enabled: true
# Enable umask and core dump limits
# common_hardening_limits_enabled: true
# Maximum audit log size in MB before rotation
# common_auditd_max_log_file: 32
# Number of rotated audit log files to retain
# common_auditd_num_logs: 16
# Auditd space left warning threshold in MB
# common_auditd_space_left: 75
# Auditd admin space left threshold in MB
# common_auditd_admin_space_left: 50
# Append immutable flag (-e 2) to audit rules
# common_auditd_rules_immutable: false
# SSH PermitRootLogin directive value
# common_sshd_permit_root_login: "no"
# SSH ClientAliveInterval in seconds
# common_sshd_client_alive_interval: 300
# SSH ClientAliveCountMax timeout count
# common_sshd_client_alive_count_max: 3
# Maximum SSH authentication attempts before disconnect
# common_sshd_max_auth_tries: 4
# System crypto policy name (e.g. DEFAULT, FUTURE)
# common_crypto_policy: "DEFAULT"
# Deploy default restrictive umask in /etc/profile.d
# common_enforce_umask: true
# Restrictive default umask value
# common_default_umask: "027"
# Prevent unauthorized core dumps in security limits
# common_disable_coredumps: true
# Download URL for yadm standalone binary fallback
# common_yadm_url: "https://github.com/TheLocehiliosan/yadm/raw/master/yadm"
# Force standalone yadm binary installation even if present
# common_yadm_force_install: false
# Install inxi system information tool
# common_install_inxi: true
# Install gitflow-avh (COPR on Fedora/EL10+, source build on EL9)
# common_install_gitflow: true
# Force gitflow source deployment even when git-flow is present
# common_gitflow_force_install: false
# Scratch directory for gitflow-avh source build
# common_gitflow_build_dir: "/tmp/gitflow-avh"

# ==============================================================================
# Tier 2 — Role: tuning (41 variables)
# ==============================================================================

# Enable pre-flight environment, platform, and privilege assertions
# tuning_assert_enabled: true
# Permit execution inside container guests (skips host kernel assertion)
# tuning_allow_containers: false
# Enable system tuning package installation
# tuning_packages_enabled: true
# Enable user group membership configuration
# tuning_groups_enabled: true
# Enable security limits configuration for real-time priority
# tuning_limits_enabled: true
# Enable udev rules for hardware and power optimizations
# tuning_udev_enabled: true
# Enable kernel sysctl parameter tuning
# tuning_sysctl_enabled: true
# Enable ZRAM swap and dynamic swappiness tuning
# tuning_zram_enabled: true
# Enable systemd manager timeout and limit drop-ins
# tuning_systemd_enabled: true
# Enable rtirq real-time IRQ thread prioritization
# tuning_rtirq_enabled: true
# Enable RealtimeKit daemon configuration
# tuning_rtkit_enabled: true
# Enable CPU frequency governor configuration (true on Fedora, false on EL)
# tuning_cpupower_enabled: "{{ ansible_distribution == 'Fedora' }}"
# State of irqbalance service
# tuning_irqbalance_enabled: false
# Groups to which the workstation user is added
# tuning_groups:
#   - audio
# Target sysctl drop-in file path
# tuning_sysctl_file: /etc/sysctl.d/70-cachyos-settings.conf
# Sysctl keys allowed to fail if host kernel lacks them
# tuning_sysctl_optional:
#   - dev.hpet.max-user-freq
#   - kernel.unprivileged_userns_clone
#   - kernel.nmi_watchdog
# Dictionary of sysctl key-value pairs to enforce
# tuning_sysctl:
#   vm.swappiness: 150
#   vm.vfs_cache_pressure: 50
#   vm.dirty_bytes: 268435456
#   vm.page-cluster: 0
#   vm.dirty_background_bytes: 67108864
#   vm.dirty_writeback_centisecs: 1500
#   kernel.nmi_watchdog: 0
#   kernel.unprivileged_userns_clone: 1
#   kernel.printk: "3 3 3 3"
#   kernel.kptr_restrict: 2
#   net.core.netdev_max_backlog: 4096
#   fs.file-max: 2097152
#   fs.inotify.max_user_watches: 524288
#   kernel.sysrq: 1
#   dev.hpet.max-user-freq: 3072
# Dictionary mapping user groups to real-time security limits
# tuning_limits:
#   audio:
#     rtprio: 98
#     memlock: unlimited
#     nice: -20
# Hardware timer devices assigned to the audio group
# tuning_udev_timers:
#   - rtc0
#   - hpet
# Enable SATA active link power management udev rule
# tuning_udev_sata_enabled: true
# SATA link power management policy
# tuning_udev_sata_policy: max_performance
# Enable udev rule assigning I/O schedulers by storage type
# tuning_udev_iosched_enabled: true
# I/O scheduler for rotational HDDs
# tuning_udev_iosched_hdd: bfq
# I/O scheduler for SATA SSDs
# tuning_udev_iosched_ssd: mq-deadline
# I/O scheduler for NVMe drives
# tuning_udev_iosched_nvme: kyber
# Disable snd-hda-intel power save while on AC power
# tuning_udev_audio_pm_enabled: true
# Path to audio-pm-ctl helper script
# tuning_udev_audio_pm_ctl_path: /usr/local/bin/audio-pm-ctl
# ZRAM block device name
# tuning_zram_device: zram0
# Compression algorithm for ZRAM
# tuning_zram_compression_algorithm: zstd
# ZRAM swap size relative to RAM or absolute
# tuning_zram_size: ram
# Priority of the ZRAM swap device
# tuning_zram_swap_priority: 100
# Filesystem type for the ZRAM swap device
# tuning_zram_fs_type: swap
# Dynamic swappiness value triggered when ZRAM initializes
# tuning_zram_swappiness: 150
# Packages required for ZRAM generator
# tuning_zram_packages:
#   - zram-generator
# Default start timeout for systemd services
# tuning_systemd_timeout_start_sec: 15s
# Default stop timeout for systemd services
# tuning_systemd_timeout_stop_sec: 10s
# Default file descriptor limits for systemd user manager
# tuning_systemd_user_limit_nofile: "1024:1048576"
# Configuration file path for cpupower service
# tuning_cpupower_config_file: "{{ '/etc/cpupower-service.conf' if ansible_distribution == 'Fedora' else '/etc/default/cpupower' }}"
# CPU frequency scaling governor; choices: powersave | performance | ondemand | conservative | userspace | schedutil
# tuning_cpupower_governor: powersave
# Minimum CPU scaling frequency (e.g. "400MHz" or "800MHz")
# tuning_cpupower_min_freq: ""
# Maximum CPU scaling frequency (e.g. "3100MHz" or "3800MHz")
# tuning_cpupower_max_freq: ""

