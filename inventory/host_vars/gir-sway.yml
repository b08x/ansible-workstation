# Command line executed by greetd for session selection and login
# sway_greetd_command: "tuigreet --time --remember --remember-user-session --cmd sway"
# User account under which the greetd daemon runs
# sway_greetd_user: "greetd"
# Virtual terminal on which greetd displays the greeter
# sway_greetd_vt: 1
# Key-value map of Wayland and desktop session environment variables
# sway_environment_vars:
#   XDG_CURRENT_DESKTOP: "sway"
