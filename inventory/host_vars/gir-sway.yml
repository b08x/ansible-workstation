# Install and configure greetd login manager and tuigreet greeter
# sway_install_greetd: true
# Manage display manager service status (enable greetd, disable conflicts)
sway_manage_display_manager: true
# Manage system and user session environment files for Sway
# sway_manage_environment: true
# Display manager services to stop and disable when greetd is enabled
