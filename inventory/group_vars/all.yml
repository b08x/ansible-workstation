---
workstation_path_dirs:
  - "{{ ansible_user_dir }}/.local/bin"
  - "{{ ansible_user_dir }}/.cargo/bin"
  - "{{ ansible_user_dir }}/go/bin"
  - "$(go env GOPATH)/bin"

user:
  name: b08x
  group: b08x
  uid: 1000
  gid: 1000
  home: /home/b08x
  shell: /usr/bin/zsh
  secondary_groups: "wheel,input,video,audio,render"
  realname: Robert Pannick
  sudoers: true
  email: rwpannick@gmail.com
enable_desktop: true
workstation_prompt_reboot: false

# ==============================================================================
# OSBuild Single Source of Truth (SSOT) Component Mapping - Layered Inheritance
# ==============================================================================
# Layer 1: Universal baseline components for all managed hosts (vendor/osbuild)
osbuild_base_components:
  - base

# Defaults for higher layers
osbuild_group_components: []
osbuild_host_components: []

# Resolved list of OSBuild components: base + group + host (unique)
osbuild_components: "{{ (osbuild_base_components + (osbuild_group_components | default([])) + (osbuild_host_components | default([]))) | unique }}"
