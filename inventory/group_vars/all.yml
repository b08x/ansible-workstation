---
workstation_path_dirs:
  - "{{ ansible_user_dir }}/.local/bin"
  - "{{ ansible_user_dir }}/.cargo/bin"
  - "{{ ansible_user_dir }}/go/bin"
  - "{{ ansible_user_dir }}/.bun/bin"
  - "/usr/local/bin"
  - "/usr/bin"
  - "/bin"

user:
  name: b08x
  group: b08x
  uid: 1000
  gid: 1000
  home: /home/b08x
  shell: /usr/bin/zsh
  secondary_groups: "wheel,input,video,audio,render"
  realname: Robert Pannick
  sudoers: true
  email: rwpannick@gmail.com
desktop_environment: none
workstation_prompt_reboot: false

# uv-managed Python version for the user role (roles/user/tasks/uv.yml).
# The osbuild image installs Python 3.14 at firstboot; this override keeps
# Ansible convergence aligned with the image.
user_uv_python_version: "3.14"
